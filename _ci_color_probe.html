<!doctype html><meta charset="utf-8"><title>probe</title>
<style>html,body{margin:0}iframe{width:1440px;height:1000px;border:0}</style>
<div id="out">RUNNING</div>
<script>
const PAGES=['index.html','neuheiten.html','kollektion.html','produkt.html?p=polarisyg','warenkorb.html','kasse.html','bestellung.html','journal.html','story.html','kontakt.html','faq.html','agb.html','datenschutz.html','widerruf.html','impressum.html'];
const M={coral:[255,122,106],navy:[11,29,63],sage:[55,179,105],lav:[125,111,214],coralD:[201,59,39],sageD:[39,128,76],lavD:[99,85,196],ww:[250,247,242],softgray:[234,234,234],warmgrey:[191,184,176],charcoal:[34,34,34],gold:[217,193,160],silver:[192,192,192],black:[0,0,0],white:[255,255,255]};
function L(c){const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*f(c[0])+.7152*f(c[1])+.0722*f(c[2])}
function CR(a,b){const l1=L(a),l2=L(b);return ((Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05))}
function px(s){const m=(s||'').match(/rgba?\(([^)]+)\)/);if(!m)return null;const p=m[1].split(/[,\s\/]+/).filter(x=>x!=='').map(Number);return [p[0],p[1],p[2],p.length>3?p[3]:1]}
function over(fg,bg){const a=fg[3];return [Math.round(fg[0]*a+bg[0]*(1-a)),Math.round(fg[1]*a+bg[1]*(1-a)),Math.round(fg[2]*a+bg[2]*(1-a))]}
function effBg(el,doc){let n=el,stack=[];while(n&&n.nodeType===1){const cs=doc.defaultView.getComputedStyle(n);const c=px(cs.backgroundColor);const bi=cs.backgroundImage;if(bi&&bi!=='none'&&bi.indexOf('gradient')>-1){const g=bi.match(/#[0-9a-fA-F]{6}|rgba?\([^)]+\)/g);if(g){let hx=g[0];if(hx[0]==='#')stack.push([parseInt(hx.slice(1,3),16),parseInt(hx.slice(3,5),16),parseInt(hx.slice(5,7),16),1]);else stack.push(px(hx));break}}
 if(c&&c[3]>0){stack.push(c);if(c[3]===1)break}
 n=n.parentElement}
 let bg=[250,247,242];for(let i=stack.length-1;i>=0;i--)bg=over(stack[i],bg);return bg}
function near(a,b,t){t=t||14;return Math.abs(a[0]-b[0])<=t&&Math.abs(a[1]-b[1])<=t&&Math.abs(a[2]-b[2])<=t}
function name(c){for(const k in M)if(near(c,M[k],10))return k;return null}
function isLight(bg){return L(bg)>0.5}
const res=[];
function run(i){
 if(i>=PAGES.length){document.getElementById('out').textContent='###JSON###'+JSON.stringify(res);document.title='DONE';return}
 const f=document.createElement('iframe');f.src='http://127.0.0.1:8123/'+PAGES[i];document.body.appendChild(f);
 f.onload=()=>{setTimeout(()=>{try{
  const d=f.contentDocument,w=f.contentWindow;const page=PAGES[i];
  const rows=[];
  // bubbles
  d.querySelectorAll('.bg-bubble').forEach(b=>{const cs=w.getComputedStyle(b);rows.push({t:'bubble',page,op:cs.opacity,bg:cs.backgroundColor,bd:cs.borderColor,bw:cs.borderWidth,w:cs.width,h:cs.height,cls:b.className})});
  // body text color
  const bcs=w.getComputedStyle(d.body);rows.push({t:'body',page,color:bcs.color,bg:bcs.backgroundColor});
  // all text elements
  const all=d.querySelectorAll('*');
  all.forEach(el=>{
   const cs=w.getComputedStyle(el);
   if(cs.display==='none'||cs.visibility==='hidden')return;
   const r=el.getBoundingClientRect(); if(r.width<1||r.height<1)return;
   let txt='';for(const n of el.childNodes)if(n.nodeType===3)txt+=n.nodeValue;txt=txt.trim();
   const bg=effBg(el,d);
   // coral-surface buttons: check text colour
   const ownBg=px(cs.backgroundColor);
   if(ownBg&&ownBg[3]>0.9&&near([ownBg[0],ownBg[1],ownBg[2]],M.coral,12)){
     const fc=px(cs.color);const eff=over(fc,[ownBg[0],ownBg[1],ownBg[2]]);
     rows.push({t:'coralSurface',page,sel:sel(el),color:cs.color,eff:eff,nm:name(eff),cr:+CR(eff,[ownBg[0],ownBg[1],ownBg[2]]).toFixed(2),fs:cs.fontSize,txt:txt.slice(0,40)});
   }
   if(!txt||txt.length<1)return;
   const fc=px(cs.color); if(!fc)return; const eff=over(fc,bg);
   const nm=name(eff), bnm=name(bg);
   const cr=+CR(eff,bg).toFixed(2);
   const fs=parseFloat(cs.fontSize),fw=parseInt(cs.fontWeight)||400;
   const big=(fs>=24)||(fs>=19&&fw>=700);
   const need=big?3:4.5;
   // flag brand-rule violations
   let flag=null;
   if(nm==='coral'&&isLight(bg))flag='CORAL_ON_LIGHT';
   else if(nm==='white'&&bnm==='coral')flag='WHITE_ON_CORAL';
   else if(nm==='gold'&&isLight(bg))flag='GOLD_ON_LIGHT';
   else if(nm==='warmgrey'&&isLight(bg))flag='WARMGREY_ON_LIGHT';
   else if(nm==='sage'&&isLight(bg))flag='SAGE_ON_LIGHT';
   else if(nm==='lav'&&isLight(bg))flag='LAV_ON_LIGHT';
   else if(nm==='coralD'&&!isLight(bg)&&!big)flag='CORALDEEP_ON_DARK_SMALL';
   else if(nm==='lavD'&&!isLight(bg))flag='LAVDEEP_ON_DARK';
   if(flag||cr<need)rows.push({t:'text',page,flag,sel:sel(el),color:cs.color,eff,bg,bgnm:bnm,cr,need,fs:cs.fontSize,fw:cs.fontWeight,txt:txt.slice(0,60)});
  });
  res.push({page,rows});
 }catch(e){res.push({page:PAGES[i],err:String(e)})}
 f.remove();run(i+1);},1400)}
}
function sel(el){let s=el.tagName.toLowerCase();if(el.id)s+='#'+el.id;if(el.className&&typeof el.className==='string')s+='.'+el.className.trim().split(/\s+/).slice(0,3).join('.');return s}
run(0);
</script>
