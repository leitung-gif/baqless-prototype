<!doctype html><meta charset="utf-8"><title>probe</title>
<style>html,body{margin:0}iframe{width:1440px;height:1200px;border:0}</style>
<div id="out">RUNNING</div>
<script>
const PAGES=['index.html','neuheiten.html','kollektion.html','produkt.html?p=polarisyg','warenkorb.html','kasse.html','bestellung.html','journal.html','story.html','kontakt.html','faq.html','agb.html','datenschutz.html','widerruf.html','impressum.html'];
const res=[];
function run(i){
 if(i>=PAGES.length){document.getElementById('out').textContent='###JSON###'+JSON.stringify(res);document.title='DONE';return}
 const f=document.createElement('iframe');f.src='http://127.0.0.1:8123/'+PAGES[i];document.body.appendChild(f);
 f.onload=()=>{setTimeout(()=>{const o={page:PAGES[i]};try{
  const d=f.contentDocument,w=f.contentWindow;
  o.wordmarks=[...d.querySelectorAll('.wordmark')].map(e=>{const r=e.getBoundingClientRect(),cs=w.getComputedStyle(e);
    return {w:+r.width.toFixed(1),h:+r.height.toFixed(1),ff:cs.fontFamily.split(',')[0],fs:cs.fontSize,fw:cs.fontWeight,ls:cs.letterSpacing,tt:cs.textTransform,color:cs.color,vis:r.width>0&&cs.visibility!=='hidden'&&cs.display!=='none',par:e.parentElement.tagName+'.'+(e.parentElement.className||'')}});
  o.logoImgs=[...d.querySelectorAll('img')].filter(im=>/logo|wordmark|baqless-logo/i.test(im.src||'')).map(im=>im.src);
  // bubbles per section
  const secs={};
  d.querySelectorAll('.bg-bubble,.blob').forEach(b=>{
    let s=b.closest('section,footer,header,div[class]');
    const key=(s?(s.tagName.toLowerCase()+'.'+(typeof s.className==='string'?s.className.split(/\s+/)[0]:'')):'?');
    const cs=w.getComputedStyle(b);
    const col=cs.backgroundColor!=='rgba(0, 0, 0, 0)'?cs.backgroundColor:cs.borderTopColor;
    secs[key]=secs[key]||{n:0,cols:{},op:{}};secs[key].n++;secs[key].cols[col]=(secs[key].cols[col]||0)+1;secs[key].op[cs.opacity]=(secs[key].op[cs.opacity]||0)+1;
  });
  o.sections=secs;
  o.nBubble=d.querySelectorAll('.bg-bubble').length; o.nBlob=d.querySelectorAll('.blob').length;
  // gradients in use
  const g=[];d.querySelectorAll('*').forEach(e=>{const bi=w.getComputedStyle(e).backgroundImage;if(bi&&bi.indexOf('gradient')>-1){const r=e.getBoundingClientRect();if(r.width>2&&r.height>2)g.push({sel:e.tagName.toLowerCase()+'.'+(typeof e.className==='string'?e.className.trim().split(/\s+/).slice(0,2).join('.'):''),bi:bi.slice(0,110),w:Math.round(r.width),h:Math.round(r.height)})}});
  const gs={};g.forEach(x=>{gs[x.bi]=(gs[x.bi]||0)+1});o.grad=gs;
  // navy text share: count chars rendered in navy vs charcoal
  let navyChars=0,charcoalChars=0,otherChars=0;
  const walker=d.createTreeWalker(d.body,NodeFilter.SHOW_TEXT);let n;
  while(n=walker.nextNode()){const tx=(n.nodeValue||'').trim();if(!tx)continue;const p=n.parentElement;if(!p)continue;const cs=w.getComputedStyle(p);if(cs.display==='none'||cs.visibility==='hidden')continue;const r=p.getBoundingClientRect();if(r.width<1)continue;
   const c=cs.color;if(c==='rgb(11, 29, 63)')navyChars+=tx.length;else if(c==='rgb(34, 34, 34)')charcoalChars+=tx.length;else otherChars+=tx.length}
  o.textChars={navy:navyChars,charcoal:charcoalChars,other:otherChars};
 }catch(e){o.err=String(e)}
 res.push(o);f.remove();run(i+1);},1500)}
}
run(0);
</script>
