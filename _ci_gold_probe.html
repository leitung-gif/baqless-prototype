<!doctype html><meta charset="utf-8"><title>probe</title>
<style>html,body{margin:0}iframe{width:1440px;height:1200px;border:0}</style>
<div id="out">RUNNING</div>
<script>
const PAGES=['index.html','journal.html','story.html','kollektion.html','neuheiten.html','produkt.html?p=wakumo'];
const SEL=['.wa','.wa .eyebrow','.wa-card .price','.wa-line','.btn-gold','.story-stats .stat b','.story-stats .stat','.befunde .kick','.bfind .n','.bfind .n i','.ed-break p','.ed-break a','.ed-break .eyebrow','.foot-dots i','.wordmark','.collections .eyebrow','.film .eyebrow','.story .eyebrow','.eyebrow','.card:nth-of-type(4n+4) .card-img'];
function L(c){const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*f(c[0])+.7152*f(c[1])+.0722*f(c[2])}
function CR(a,b){const l1=L(a),l2=L(b);return ((Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05))}
function px(s){const m=(s||'').match(/rgba?\(([^)]+)\)/);if(!m)return null;const p=m[1].split(/[,\s\/]+/).filter(x=>x!=='').map(Number);return [p[0],p[1],p[2],p.length>3?p[3]:1]}
function over(fg,bg){const a=fg[3];return [Math.round(fg[0]*a+bg[0]*(1-a)),Math.round(fg[1]*a+bg[1]*(1-a)),Math.round(fg[2]*a+bg[2]*(1-a))]}
function effBg(el,d){let n=el,st=[];while(n&&n.nodeType===1){const cs=d.defaultView.getComputedStyle(n);const c=px(cs.backgroundColor);const op=parseFloat(cs.opacity);if(c&&c[3]>0){st.push([c[0],c[1],c[2],c[3]*(isNaN(op)?1:1)]);if(c[3]===1)break}n=n.parentElement}
let bg=[250,247,242];for(let i=st.length-1;i>=0;i--)bg=over(st[i],bg);return bg}
const res=[];
function run(i){
 if(i>=PAGES.length){document.getElementById('out').textContent='###JSON###'+JSON.stringify(res);document.title='DONE';return}
 const f=document.createElement('iframe');f.src='http://127.0.0.1:8123/'+PAGES[i];document.body.appendChild(f);
 f.onload=()=>{setTimeout(()=>{const o={page:PAGES[i],hits:[],secs:[]};try{
  const d=f.contentDocument,w=f.contentWindow;
  SEL.forEach(s=>{let els;try{els=d.querySelectorAll(s)}catch(e){return}
   if(!els.length)return;const e=els[0];const cs=w.getComputedStyle(e);const r=e.getBoundingClientRect();
   const bg=effBg(e.parentElement||e,d);const fc=px(cs.color);const opc=parseFloat(cs.opacity);
   const fcA=[fc[0],fc[1],fc[2],fc[3]*(isNaN(opc)?1:opc)];
   const eff=over(fcA,bg);
   const ownBg=px(cs.backgroundColor);
   o.hits.push({s,n:els.length,color:cs.color,opacity:cs.opacity,ownBg:cs.backgroundColor,bg,eff,cr:+CR(eff,bg).toFixed(2),fs:cs.fontSize,fw:cs.fontWeight,ff:cs.fontFamily.split(',')[0],w:+r.width.toFixed(1),h:+r.height.toFixed(1),txt:(e.textContent||'').trim().slice(0,40)});
  });
  // per-section bubble colour count
  d.querySelectorAll('.section,.plp-wrap,.xsell,.seen').forEach(sec=>{
    const bs=[...sec.children].filter(c=>c.classList&&c.classList.contains('bg-bubble'));
    if(!bs.length)return;const cols={};bs.forEach(b=>{const cs=w.getComputedStyle(b);const c=cs.backgroundColor!=='rgba(0, 0, 0, 0)'?cs.backgroundColor:cs.borderTopColor;cols[c]=(cols[c]||0)+1});
    o.secs.push({id:sec.id||sec.className.slice(0,40),n:bs.length,cols});
  });
 }catch(e){o.err=String(e)}
 res.push(o);f.remove();run(i+1);},1500)}
}
run(0);
</script>
