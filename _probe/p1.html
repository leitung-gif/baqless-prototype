<!doctype html><meta charset="utf-8">
<style>html,body{margin:0}iframe{border:0}</style>
<iframe id="f" src="/index.html" width="1440" height="1000"></iframe>
<pre id="out">wait</pre>
<script>
const f=document.getElementById('f'), out=document.getElementById('out');
function run(){
 const d=f.contentDocument,w=f.contentWindow;const L=[];
 const wm=d.querySelector('nav .wordmark');
 const r=wm.getBoundingClientRect();const cs=w.getComputedStyle(wm);
 L.push('WORDMARK desktop: w='+r.width.toFixed(1)+' h='+r.height.toFixed(1)+' font='+cs.fontFamily+' weight='+cs.fontWeight+' size='+cs.fontSize+' ls='+cs.letterSpacing+' tt='+cs.textTransform+' color='+cs.color+' text='+JSON.stringify(wm.textContent));
 const em=wm.querySelector('em'); if(em) L.push('  em color='+w.getComputedStyle(em).color+' text='+JSON.stringify(em.textContent));
 const nav=d.querySelector('nav'); const nr=nav.getBoundingClientRect(); const ncs=w.getComputedStyle(nav);
 L.push('NAV: padding='+ncs.paddingTop+'/'+ncs.paddingRight+'/'+ncs.paddingBottom+'/'+ncs.paddingLeft+' h='+nr.height.toFixed(1)+' navcolor='+ncs.color);
 L.push('  wordmark box: left='+r.left.toFixed(1)+' top='+r.top.toFixed(1)+' bottom='+(nr.height-r.bottom).toFixed(1));
 // next element to the right
 const links=d.querySelector('nav .nav-links'); const lr=links.getBoundingClientRect();
 L.push('  gap wordmark->nav-links = '+(lr.left-r.right).toFixed(1));
 // cap height estimate
 const probe=d.createElement('span'); probe.textContent='B'; probe.style.cssText='font:'+cs.fontWeight+' '+cs.fontSize+' '+cs.fontFamily+';position:absolute;visibility:hidden';
 d.body.appendChild(probe);
 L.push('  fontSize px='+parseFloat(cs.fontSize));
 // footer wordmark
 const fw=d.querySelector('footer .wordmark');
 if(fw){const fr=fw.getBoundingClientRect(); const fcs=w.getComputedStyle(fw);
  L.push('FOOTER wordmark: w='+fr.width.toFixed(1)+' size='+fcs.fontSize+' color='+fcs.color+' mb='+fcs.marginBottom);
  const claim=d.querySelector('.foot-claim'); if(claim){L.push('  gap to .foot-claim = '+(claim.getBoundingClientRect().top-fr.bottom).toFixed(1));}
 }
 // wrap widths
 ['.wrap','.plp-wrap','.legal','.seen'].forEach(s=>{const e=d.querySelector(s); if(e){const b=e.getBoundingClientRect();L.push('BOX '+s+': left='+b.left.toFixed(1)+' width='+b.width.toFixed(1));}});
 const bodycs=w.getComputedStyle(d.body);
 L.push('--pad @1440 = '+w.getComputedStyle(d.documentElement).getPropertyValue('--pad'));
 // hero h1
 const h1=d.querySelector('.hero h1'); if(h1){const hc=w.getComputedStyle(h1);L.push('HERO h1: size='+hc.fontSize+' lh='+hc.lineHeight+' weight='+hc.fontWeight+' fam='+hc.fontFamily);}
 const h2=d.querySelector('.sec-head h2'); if(h2){const hc=w.getComputedStyle(h2);L.push('SEC h2: size='+hc.fontSize+' lh='+hc.lineHeight+' weight='+hc.fontWeight);}
 const ch3=d.querySelector('.card-meta h3'); if(ch3){const hc=w.getComputedStyle(ch3);L.push('CARD h3 (Produktname): size='+hc.fontSize+' lh='+hc.lineHeight+' weight='+hc.fontWeight+' fam='+hc.fontFamily);}
 const btn=d.querySelector('.btn'); if(btn){const bc=w.getComputedStyle(btn);const bb=btn.getBoundingClientRect();L.push('BTN: h='+bb.height.toFixed(1)+' padX='+bc.paddingLeft+' size='+bc.fontSize+' weight='+bc.fontWeight+' lh='+bc.lineHeight+' radius='+bc.borderRadius+' ls='+bc.letterSpacing);}
 out.textContent=L.join('\n');
}
f.onload=()=>setTimeout(run,1200);
</script>
