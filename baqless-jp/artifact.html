<title>baqless.jp Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex">
<meta name="description" content="Clickable prototype of the new baqless.jp on Shopify, Japanese first, three finished shop directions A, B and C.">
<meta name="theme-color" content="#0B1D3F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400;1,500&family=Inter:wght@300;400;500;600&family=Noto+Serif+JP:wght@300;400;500&family=Zen+Kaku+Gothic+New:wght@300;400;500;700;900&display=swap">
<style>
/* Layout: one shop, three finished skins. A 静 calm and precise on white (centered, thin lines, Inter caps). B 躍 bold brand (Navy, Coral, offset shadows, big italic serif, ticker). C 艶 dark and noble (black, gold hairlines, Mincho, light and slow motion). A prototype bar sits on top. */
:root{
  /* Baqless brand, names as in baqless-prototype/src/styles.css */
  --navy:#0B1D3F; --coral:#FF7A6A; --coral-deep:#C93B27; --rose:#F5DADF; --gold:#D9C1A0; --ground:#FAF7F2;
  --charcoal:#222222; --ink:#5A554E; --ink-soft:#6B655C; --black:#0A0A0A;

  /* Skin A (default) */
  --bg:#FFFFFF; --bg-alt:#F7F6F3; --surface:#FFFFFF; --fg:#1E1E1E; --text:#55504A; --soft:#7A746B; --line:#E7E3DC;
  --head:#FFFFFF; --head-fg:#1E1E1E; --head-line:#E7E3DC; --wm:#0A0A0A; --under:#1E1E1E;
  --ann:#F7F6F3; --ann-fg:#55504A;
  --btn:#1E1E1E; --btn-fg:#FFFFFF; --btn-line:#1E1E1E; --fill:#FFFFFF; --fill-fg:#1E1E1E;
  --btn2-fg:#1E1E1E; --btn2-line:#1E1E1E; --fill2:#1E1E1E; --fill2-fg:#FFFFFF;
  --price:#1E1E1E; --tag:#FFFFFF; --tag-fg:#1E1E1E; --accent:#0B1D3F; --img-bg:#F7F6F3;
  --foot:#F7F6F3; --foot-fg:#1E1E1E; --foot-soft:#6B655C; --foot-line:#E2DED6; --foot-accent:#1E1E1E;
  --chip:#FFFFFF; --chip-on:#1E1E1E; --chip-on-fg:#FFFFFF; --focus:#0B1D3F;

  --jp:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  --jp-serif:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  --display:"Cormorant Garamond","Cormorant",Georgia,"Times New Roman",serif;
  --lat:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --h-font:var(--lat); --h-weight:500; --h-size:13px; --h-track:.32em; --h-case:uppercase;
  --name-font:var(--lat); --name-size:12px; --name-track:.08em; --name-weight:400;

  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
  --bar:44px; --ease:cubic-bezier(.22,.61,.36,1); --slow:cubic-bezier(.25,.1,.25,1);
  --t-img:.6s; --t-zoom:1.2s; --z:1.02; --t-btn:.3s; --t-line:.4s; --t-in:.8s; --rise:0px; --blur:0px;
  --sec:96px; --radius:0px;
  color-scheme:light;
}
html[data-skin="b"]{
  --bg:#FAF7F2; --bg-alt:#FFFFFF; --surface:#FFFFFF; --fg:#0B1D3F; --text:#4A453E; --soft:#6B655C; --line:#E3DDD2;
  --head:#0B1D3F; --head-fg:#FFFFFF; --head-line:#0B1D3F; --wm:#FFFFFF; --under:#FF7A6A;
  --ann:#F5DADF; --ann-fg:#0B1D3F;
  --btn:#FF7A6A; --btn-fg:#0B1D3F; --btn-line:#0B1D3F; --fill:#0B1D3F; --fill-fg:#FFFFFF;
  --btn2-fg:#0B1D3F; --btn2-line:#0B1D3F; --fill2:#0B1D3F; --fill2-fg:#FFFFFF;
  --price:#0B1D3F; --tag:#FF7A6A; --tag-fg:#0B1D3F; --accent:#FF7A6A; --img-bg:#FFFFFF;
  --foot:#0B1D3F; --foot-fg:#FFFFFF; --foot-soft:#C9CFDB; --foot-line:#22365E; --foot-accent:#FF7A6A;
  --chip:#FFFFFF; --chip-on:#0B1D3F; --chip-on-fg:#FFFFFF; --focus:#0B1D3F;
  --h-font:var(--display); --h-weight:500; --h-size:clamp(40px,6vw,72px); --h-track:0; --h-case:none;
  --name-font:var(--jp); --name-size:14px; --name-track:.02em; --name-weight:700;
  --t-img:.45s; --t-zoom:.6s; --z:1.04; --t-btn:.25s; --t-line:.25s; --t-in:.55s; --rise:32px;
  --sec:88px; --radius:12px;
}
html[data-skin="c"]{
  --bg:#0A0A0A; --bg-alt:#121212; --surface:#121212; --fg:#F3EEE6; --text:#C9C2B6; --soft:#9C9488; --line:#2A2A2A;
  --head:#0A0A0A; --head-fg:#F3EEE6; --head-line:#1F1F1F; --wm:#F3EEE6; --under:#D9C1A0;
  --ann:#0A0A0A; --ann-fg:#D9C1A0;
  --btn:transparent; --btn-fg:#D9C1A0; --btn-line:#D9C1A0; --fill:#D9C1A0; --fill-fg:#0A0A0A;
  --btn2-fg:#F3EEE6; --btn2-line:#4B4F54; --fill2:#F3EEE6; --fill2-fg:#0A0A0A;
  --price:#D9C1A0; --tag:#0A0A0A; --tag-fg:#D9C1A0; --accent:#D9C1A0; --img-bg:#151515;
  --foot:#050505; --foot-fg:#F3EEE6; --foot-soft:#9C9488; --foot-line:#1F1F1F; --foot-accent:#D9C1A0;
  --chip:#0A0A0A; --chip-on:#D9C1A0; --chip-on-fg:#0A0A0A; --focus:#D9C1A0;
  --h-font:var(--display); --h-weight:300; --h-size:clamp(36px,5vw,60px); --h-track:.12em; --h-case:uppercase;
  --name-font:var(--display); --name-size:19px; --name-track:.02em; --name-weight:400;
  --t-img:1.1s; --t-zoom:1.8s; --z:1.06; --t-btn:.6s; --t-line:.7s; --t-in:1.2s; --rise:12px; --blur:6px;
  --sec:120px; --radius:0px;
  color-scheme:dark;
}
html[data-fx="off"]{--t-img:0s; --t-zoom:0s; --t-btn:0s; --t-line:0s; --t-in:0s}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.9 var(--jp);letter-spacing:.04em;-webkit-font-smoothing:antialiased;padding-top:calc(var(--bar) + env(safe-area-inset-top, 0px));overflow-x:hidden}
html[data-skin="a"] body{font-weight:400}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:90;background:#121212}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit;letter-spacing:inherit}
input{font:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.wrap{max-width:1320px;margin:0 auto;padding-left:var(--gl);padding-right:var(--gr)}
html[data-skin="a"] .wrap{max-width:1240px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-family:var(--lat);font-variant-numeric:tabular-nums;letter-spacing:.02em}
p{margin:0;line-break:strict;word-break:auto-phrase;text-wrap:pretty}
.jh{font-family:var(--jp-serif);font-weight:400;color:var(--fg);line-height:1.6;letter-spacing:.08em;font-feature-settings:"palt";line-break:strict;word-break:auto-phrase;text-wrap:balance;margin:0}
.eyebrow{font:500 11px/1.5 var(--lat);letter-spacing:.24em;text-transform:uppercase;color:var(--soft)}
.prop{display:inline-flex;align-items:center;font:600 10px/1 var(--lat);letter-spacing:.14em;text-transform:uppercase;color:var(--soft);border:1px dashed currentColor;border-radius:3px;padding:4px 6px;vertical-align:middle;white-space:nowrap}

/* ---------- prototype bar ---------- */
.pbar{position:fixed;inset:0 0 auto;top:env(safe-area-inset-top, 0px);z-index:80;height:var(--bar);background:#121212;color:#EDE9E2;font:500 12px/1 var(--lat);letter-spacing:.06em;border-bottom:1px solid #2A2A2A}
.pbar .wrap{max-width:none;height:100%;display:flex;align-items:center;gap:10px}
.pbar .pname{display:flex;align-items:center;gap:8px;white-space:nowrap;color:#BDB7AD}
.pbar .pname b{color:#FFFFFF;font-weight:600;letter-spacing:.16em}
.pbar .dot{width:6px;height:6px;border-radius:50%;background:#FF7A6A}
.seg{display:inline-flex;border:1px solid #3A3A3A;border-radius:4px;overflow:hidden}
.seg button{background:transparent;border:0;color:#BDB7AD;padding:0 11px;height:30px;cursor:pointer;font:500 12px/1 var(--lat);letter-spacing:.06em;white-space:nowrap}
.seg button+button{border-left:1px solid #3A3A3A}
.seg button[aria-pressed="true"]{background:#EDE9E2;color:#121212}
.pbar .grow{flex:1}
.pbar .ibtn{background:transparent;border:1px solid #3A3A3A;border-radius:4px;height:30px;padding:0 10px;cursor:pointer;color:#EDE9E2}
.pbar .long{display:none}
@media (min-width:900px){.pbar .long{display:inline}}
@media (max-width:520px){.pbar .pname span{display:none}.seg button{padding:0 9px}.pbar .wrap{gap:6px}}

/* ---------- announcement, ticker, header ---------- */
.ann{background:var(--ann);color:var(--ann-fg);font:500 11.5px/1.5 var(--jp);letter-spacing:.1em;text-align:center;border-bottom:1px solid var(--head-line)}
.ann .wrap{padding-block:8px}
.head{position:sticky;top:calc(var(--bar) + env(safe-area-inset-top, 0px));z-index:60;background:var(--head);color:var(--head-fg);border-bottom:1px solid var(--head-line);transition:background-color .5s var(--ease),border-color .5s var(--ease)}
.head .row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:60px;gap:12px}
.head .wm{width:112px;height:auto;color:var(--wm);display:block}
.head .logo{justify-self:center;display:block;padding:6px 0}
.head .left,.head .right{display:flex;align-items:center;gap:2px}
.head .right{justify-self:end}
.icon{width:40px;height:40px;display:inline-grid;place-items:center;background:transparent;border:0;cursor:pointer;color:inherit;position:relative;text-decoration:none}
.icon svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.3}
.count{position:absolute;right:1px;top:3px;min-width:17px;height:17px;border-radius:9px;background:var(--accent);color:var(--head);font:600 10px/17px var(--lat);text-align:center;padding:0 4px;letter-spacing:0}
html[data-skin="b"] .count{color:#0B1D3F}
.nav{display:none}
.nav a,.ul{position:relative;text-decoration:none;padding-block:8px;white-space:nowrap}
.nav a::after,.ul::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:1px;background:var(--under);transform:scaleX(0);transform-origin:center;transition:transform var(--t-line) var(--ease)}
html[data-skin="b"] .nav a::after,html[data-skin="b"] .ul::after{height:2px;transform-origin:left}
.nav a:hover::after,.nav a:focus-visible::after,.nav a[aria-current="page"]::after,.ul:hover::after,.ul:focus-visible::after{transform:scaleX(1)}
.search-ic{display:none}
@media (min-width:1080px){
  .search-ic{display:inline-grid}
  .nav{display:flex;gap:28px;font:500 11px/1 var(--lat);letter-spacing:.18em}
  .head .left .menu-ic{display:none}
  /* A: logo centered on top, nav centered below, like the Japanese jewellery houses */
  html[data-skin="a"] .head .row{height:76px}
  html[data-skin="a"] .nav{justify-content:center;border-top:1px solid var(--head-line);padding-block:4px}
  html[data-skin="a"] .head .wm{width:132px}
  /* B and C: one line, logo left */
  html[data-skin="b"] .head .row,html[data-skin="c"] .head .row{grid-template-columns:auto 1fr auto;height:72px}
  html[data-skin="b"] .head .logo,html[data-skin="c"] .head .logo{justify-self:start;order:-1}
  html[data-skin="b"] .head .left,html[data-skin="c"] .head .left{order:3;justify-self:end}
  html[data-skin="b"] .nav,html[data-skin="c"] .nav{position:absolute;left:50%;top:0;height:72px;transform:translateX(-50%);align-items:center;padding:0;width:auto;max-width:none}
  html[data-skin="b"] .head .right,html[data-skin="c"] .head .right{order:4}
  html[data-skin="b"] .head,html[data-skin="c"] .head{position:sticky}
  html[data-skin="b"] .head .row{grid-template-columns:auto 1fr auto auto}
  html[data-skin="c"] .head .row{grid-template-columns:auto 1fr auto auto}
}
/* C: header lies over the hero on the home page and turns solid on scroll */
html[data-skin="c"][data-route="home"] .head.over{background:transparent;border-color:transparent}
html[data-skin="c"][data-route="home"] .ann{position:relative;z-index:61}
html[data-skin="c"][data-route="home"] main{margin-top:-61px}
@media (min-width:1080px){html[data-skin="c"][data-route="home"] main{margin-top:-73px}}

.ticker{background:var(--rose);color:#0B1D3F;overflow:hidden;border-bottom:2px solid #0B1D3F;display:none}
html[data-skin="b"] .ticker{display:block}
.ticker .track{display:flex;gap:48px;width:max-content;padding-block:10px;animation:tick 38s linear infinite;font:700 12.5px/1 var(--jp);letter-spacing:.1em;white-space:nowrap}
.ticker .track span::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#FF7A6A;margin-right:14px;vertical-align:middle;box-shadow:0 0 0 1.5px #0B1D3F}
@keyframes tick{to{transform:translateX(-50%)}}
html[data-fx="off"] .ticker .track{animation:none}

/* ---------- buttons, three languages ---------- */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:12px;overflow:hidden;isolation:isolate;min-height:52px;padding:0 30px;border:1px solid var(--btn-line);background:var(--btn);color:var(--btn-fg);font:500 13px/1.3 var(--jp);letter-spacing:.16em;text-decoration:none;cursor:pointer;transition:color var(--t-btn) var(--ease),background-color var(--t-btn) var(--ease)}
.btn::before{content:"";position:absolute;inset:0;background:var(--fill);z-index:-1;opacity:0;transition:opacity var(--t-btn) var(--ease),transform var(--t-btn) var(--ease)}
.btn:hover,.btn:focus-visible{color:var(--fill-fg)}
.btn:hover::before,.btn:focus-visible::before{opacity:1}
.btn.ghost{background:transparent;color:var(--btn2-fg);border-color:var(--btn2-line)}
.btn.ghost::before{background:var(--fill2)}
.btn.ghost:hover,.btn.ghost:focus-visible{color:var(--fill2-fg)}
.btn.wide{width:100%}
.btn .arr{display:inline-block;transition:transform var(--t-btn) var(--ease)}
.btn:hover .arr{transform:translateX(4px)}
/* B: colour sweeps from the left, hard shadow, arrow jumps */
html[data-skin="b"] .btn{border-width:2px;border-radius:999px;font-weight:700;letter-spacing:.1em;box-shadow:3px 3px 0 #0B1D3F;transition:color var(--t-btn) var(--ease),box-shadow var(--t-btn) var(--ease),transform var(--t-btn) var(--ease)}
html[data-skin="b"] .btn::before{opacity:1;transform:scaleX(0);transform-origin:left}
html[data-skin="b"] .btn:hover::before,html[data-skin="b"] .btn:focus-visible::before{transform:scaleX(1)}
html[data-skin="b"] .btn:hover{box-shadow:5px 5px 0 #0B1D3F;transform:translate(-2px,-2px)}
html[data-skin="b"] .btn.ghost{background:#FFFFFF}
/* C: thin gold line, a slow light passes over */
html[data-skin="c"] .btn{font-family:var(--jp-serif);font-weight:400;letter-spacing:.2em}
html[data-skin="c"] .btn::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,240,215,.28),transparent);transform:skewX(-18deg);transition:left 1.2s var(--slow);pointer-events:none}
html[data-skin="c"] .btn:hover::after{left:130%}

/* ---------- section heads, three hierarchies ---------- */
.sec{padding-block:var(--sec)}
.sec.alt{background:var(--bg-alt)}
.sh{display:grid;gap:10px;margin-bottom:40px}
.sh h2{margin:0;font:var(--h-weight) var(--h-size)/1.05 var(--h-font);letter-spacing:var(--h-track);text-transform:var(--h-case);color:var(--fg)}
.sh .ja{font-size:12.5px;color:var(--soft);letter-spacing:.16em}
.sh .more{justify-self:start}
html[data-skin="a"] .sh{justify-items:center;text-align:center}
html[data-skin="a"] .sh .more{justify-self:center}
html[data-skin="a"] .sh h2::after{content:"";display:block;width:24px;height:1px;background:var(--fg);margin:18px auto 0}
html[data-skin="b"] .sh{grid-template-columns:minmax(0,1fr) auto;align-items:end}
html[data-skin="b"] .sh h2{font-style:italic}
html[data-skin="b"] .sh .ja{grid-column:1;font:700 13px/1.5 var(--jp);letter-spacing:.12em;color:#0B1D3F}
html[data-skin="b"] .sh .ja b{background:linear-gradient(transparent 58%,var(--rose) 58%);font-weight:700}
html[data-skin="b"] .sh .more{grid-column:2;grid-row:1/3;align-self:end}
html[data-skin="c"] .sh{justify-items:center;text-align:center}
html[data-skin="c"] .sh .ja{font-family:var(--jp-serif);color:var(--gold);letter-spacing:.3em}
html[data-skin="c"] .sh::before{content:"";width:1px;height:48px;background:linear-gradient(var(--bg),var(--gold));margin-bottom:8px}
html[data-skin="c"] .sh .more{justify-self:center}
.more{font:500 12px/1 var(--lat);letter-spacing:.2em;color:var(--fg);text-transform:uppercase}

/* ---------- trust bar ---------- */
.trust{border-block:1px solid var(--line);background:var(--bg)}
.trust ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.trust li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:center;padding:16px 8px;font-size:12px;line-height:1.5;color:var(--text)}
.trust li b{display:block;color:var(--fg);font-size:12.5px;font-weight:700;letter-spacing:.08em}
.trust svg{width:24px;height:24px;stroke:var(--fg);fill:none;stroke-width:1.2}
@media (min-width:900px){.trust ul{grid-template-columns:repeat(4,minmax(0,1fr))}.trust li{padding:20px 16px}.trust li+li{border-left:1px solid var(--line)}}
html[data-skin="b"] .trust{background:#FFFFFF;border-block:2px solid #0B1D3F}
html[data-skin="b"] .trust svg{stroke:#0B1D3F}
html[data-skin="c"] .trust svg{stroke:var(--gold)}
html[data-skin="c"] .trust li b{font-family:var(--jp-serif);font-weight:400;color:var(--gold)}

/* ---------- A hero: slideshow with caption strip ---------- */
.hero-a{position:relative}
.hero-a .stage{position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--img-bg)}
.hero-a .slide{position:absolute;inset:0;opacity:0;transition:opacity 1.4s var(--slow)}
.hero-a .slide.on{opacity:1}
.hero-a .slide img{width:100%;height:100%;object-fit:cover;transform:scale(1.04);transition:transform 7s linear}
.hero-a .slide.on img{transform:scale(1)}
.hero-a .cap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding-block:22px}
.hero-a .cap .t{display:grid;gap:4px}
.hero-a .cap .t span{font:500 11px/1.4 var(--lat);letter-spacing:.3em;color:var(--soft)}
.hero-a .cap .t b{font:300 clamp(14px,2vw,19px)/1.5 var(--lat);letter-spacing:.2em;color:var(--fg)}
.hero-a .dots{display:flex;gap:8px;align-items:center}
.hero-a .dots button{width:36px;height:24px;background:none;border:0;padding:0;cursor:pointer;position:relative}
.hero-a .dots button::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.hero-a .dots button i{position:absolute;left:0;top:50%;height:1px;width:0;background:var(--fg)}
.hero-a .dots button.on i{animation:prog 6s linear forwards}
html[data-fx="off"] .hero-a .dots button.on i{animation:none;width:100%}
@keyframes prog{to{width:100%}}
.hero-a .lead{text-align:center;padding-block:56px 8px;display:grid;gap:14px;justify-items:center}
.hero-a .lead h1{font:300 clamp(21px,3.4vw,32px)/1.8 var(--jp);letter-spacing:.12em;color:var(--fg);margin:0;font-feature-settings:"palt"}
.hero-a .lead p{font-size:13.5px;letter-spacing:.12em}
@media (min-width:900px){.hero-a .stage{aspect-ratio:16/8}}

/* ---------- B hero: split, product stack that changes ---------- */
.hero-b{background:var(--bg);border-bottom:2px solid #0B1D3F;overflow:hidden}
.hero-b .wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:28px;padding-block:32px 48px}
.hero-b .copy{display:grid;gap:18px;align-content:center}
.hero-b .kick{display:inline-flex;align-items:center;gap:10px;font:700 12px/1 var(--jp);letter-spacing:.14em;color:#0B1D3F}
.hero-b .kick i{width:28px;height:2px;background:#FF7A6A}
.hero-b h1{margin:0;font:900 clamp(34px,8.6vw,76px)/1.18 var(--jp);letter-spacing:.02em;color:#0B1D3F;font-feature-settings:"palt";word-break:auto-phrase}
.hero-b h1 .mk{background:linear-gradient(transparent 62%,#FF7A6A 62%,#FF7A6A 90%,transparent 90%);padding-inline:2px}
.hero-b h1 em{display:block;font:italic 500 clamp(22px,4vw,36px)/1.2 var(--display);letter-spacing:0;color:#0B1D3F;margin-bottom:6px}
.hero-b .copy p{font-size:15px;color:#4A453E;max-width:28em}
.hero-b .ctas{display:flex;flex-wrap:wrap;gap:14px;margin-top:6px}
.hero-b .stack{position:relative;min-height:440px}
.hero-b .ph{position:absolute;inset:0 18% 12% 0;border:2px solid #0B1D3F;border-radius:14px;overflow:hidden;box-shadow:10px 10px 0 #0B1D3F;background:#FFFFFF}
.hero-b .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;clip-path:inset(0 0 0 100%);transition:clip-path .9s var(--ease)}
.hero-b .ph img.on{clip-path:inset(0 0 0 0)}
.hero-b .mini{position:absolute;right:0;bottom:0;width:46%;max-width:240px;background:#FFFFFF;border:2px solid #0B1D3F;border-radius:12px;box-shadow:6px 6px 0 #FF7A6A;text-decoration:none;color:#0B1D3F;overflow:hidden}
.hero-b .mini .im{aspect-ratio:1;background:#FFFFFF;position:relative}
.hero-b .mini .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s var(--ease)}
.hero-b .mini .im img.on{opacity:1}
.hero-b .mini .tx{padding:10px 12px 12px;border-top:2px solid #0B1D3F;display:grid;gap:2px}
.hero-b .mini .tx b{font:700 13px/1.3 var(--jp)}
.hero-b .mini .tx span{font:600 12.5px/1.2 var(--lat)}
.sticker{position:absolute;z-index:3;width:74px;height:74px;border-radius:50%;background:#FF7A6A;color:#0B1D3F;border:2px solid #0B1D3F;display:grid;place-items:center;text-align:center;font:700 11px/1.15 var(--lat);letter-spacing:.08em;transform:rotate(-10deg)}
.hero-b .sticker{left:-10px;top:-14px}
.hero-b .pager{position:absolute;left:0;bottom:-34px;display:flex;gap:6px}
.hero-b .pager button{width:28px;height:6px;border-radius:3px;border:1.5px solid #0B1D3F;background:#FFFFFF;padding:0;cursor:pointer}
.hero-b .pager button.on{background:#FF7A6A}
@media (min-width:900px){.hero-b .wrap{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:56px;padding-block:64px 80px}.hero-b .stack{min-height:560px}}

/* ---------- C hero: full bleed, slow light, video feel ---------- */
.hero-c{position:relative;min-height:min(calc(100vh - 60px),900px);display:grid;align-items:end;overflow:hidden;background:#000;color:#F3EEE6;--mx:30%;--my:40%}
.hero-c picture,.hero-c .bg{position:absolute;inset:0}
.hero-c img{width:100%;height:100%;object-fit:cover;filter:brightness(.62) contrast(1.05);animation:kb 22s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.02) translate(0,0)}to{transform:scale(1.12) translate(-2%,-1%)}}
html[data-fx="off"] .hero-c img{animation:none}
.hero-c::before{content:"";position:absolute;inset:0;z-index:1;background:radial-gradient(circle 420px at var(--mx) var(--my),rgba(255,236,205,.18),transparent 70%);transition:background .2s;pointer-events:none}
.hero-c::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.55),transparent 28%,transparent 55%,rgba(0,0,0,.85));pointer-events:none}
.hero-c .copy{position:relative;z-index:2;width:100%;padding-block:120px 56px;display:grid;gap:18px;justify-items:start}
.hero-c .copy .eyebrow{color:var(--gold);letter-spacing:.4em}
.hero-c h1{margin:0;font:300 clamp(26px,3.8vw,46px)/1.55 var(--jp-serif);letter-spacing:.14em;font-feature-settings:"palt";color:#F3EEE6;max-width:14em}
.hero-c .rule{width:64px;height:1px;background:var(--gold)}
.hero-c p{font:300 14px/2 var(--jp-serif);letter-spacing:.14em;color:#D8D0C3;max-width:26em}
@media (min-width:900px){
  .hero-c{min-height:min(calc(100vh - 80px),860px)}
  .hero-c .copy{padding-block:120px 44px;gap:16px}
  .hero-c .copy p{display:none}
  .hero-c h1{font-size:clamp(26px,2.5vw,36px)}
}
.hero-c .scroll{position:absolute;right:var(--gr);bottom:32px;z-index:2;font:500 10px/1 var(--lat);letter-spacing:.4em;color:var(--gold);writing-mode:vertical-rl}
.hero-c .scroll::after{content:"";display:block;width:1px;height:56px;background:var(--gold);margin:12px auto 0;animation:drop 2.4s var(--slow) infinite}
@keyframes drop{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* ---------- categories, three forms ---------- */
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cats a{position:relative;display:block;text-decoration:none;overflow:hidden;aspect-ratio:1;background:var(--img-bg)}
.cats img{width:100%;height:100%;object-fit:cover;transition:transform var(--t-zoom) var(--ease)}
.cats a:hover img{transform:scale(var(--z))}
.cats a::after{content:"";position:absolute;inset:55% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.42));pointer-events:none}
.cats .lb{z-index:1;position:absolute;left:14px;bottom:12px;display:grid;gap:2px;color:#FFFFFF;text-shadow:0 1px 12px rgba(0,0,0,.35)}
.cats .lb b{font:300 20px/1.2 var(--display);letter-spacing:.12em}
.cats .lb span{font:400 11px/1.3 var(--jp);letter-spacing:.2em}
@media (min-width:900px){.cats{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}}
.circles{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 6px 10px;scrollbar-width:none}
.circles::-webkit-scrollbar{display:none}
.circles a{flex:0 0 auto;width:92px;display:grid;gap:10px;justify-items:center;text-decoration:none;scroll-snap-align:start;color:var(--fg)}
.circles .c{width:92px;height:92px;border-radius:50%;overflow:hidden;background:#FFFFFF;transition:box-shadow var(--t-line) var(--ease),transform var(--t-line) var(--ease)}
.circles .c img{width:100%;height:100%;object-fit:cover;transform:scale(1.15)}
.circles span{font:600 10.5px/1.3 var(--lat);letter-spacing:.12em;text-align:center}
html[data-skin="b"] .circles .c{border:2px solid #0B1D3F;box-shadow:3px 3px 0 #0B1D3F}
html[data-skin="b"] .circles a:hover .c{box-shadow:5px 5px 0 #FF7A6A;transform:translate(-2px,-2px)}
html[data-skin="c"] .circles .c{box-shadow:0 0 0 1px #3A3328;background:#151515}
html[data-skin="c"] .circles a:hover .c{box-shadow:0 0 0 1px var(--gold),0 0 24px rgba(217,193,160,.25)}
html[data-skin="c"] .circles span{font:400 12px/1.3 var(--display);letter-spacing:.2em;color:var(--gold)}
@media (min-width:900px){.circles{justify-content:space-between;overflow:visible}.circles a{width:116px}.circles .c{width:116px;height:116px}}

/* ---------- product tiles, three forms ---------- */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px 12px}
@media (min-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:56px 28px}}
.tile{display:block;text-decoration:none;color:inherit;min-width:0;position:relative}
.tile .ph{position:relative;aspect-ratio:1;overflow:hidden;background:var(--img-bg)}
.tile .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity var(--t-img) var(--ease),transform var(--t-zoom) var(--ease),clip-path var(--t-img) var(--ease)}
.tile .ph .i2{opacity:0}
.tile .cap{display:grid;gap:6px;padding:16px 2px 4px}
.tile .nm{font:var(--name-weight) var(--name-size)/1.45 var(--name-font);letter-spacing:var(--name-track);color:var(--fg)}
.tile .pr{font:500 13px/1.4 var(--lat);color:var(--price);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.tile .pr small,.price small{font:400 10.5px/1 var(--jp);letter-spacing:.04em;color:var(--soft);margin-left:4px}
.tag{position:absolute;left:10px;top:10px;z-index:2;font:600 9.5px/1 var(--lat);letter-spacing:.2em;padding:6px 8px;background:var(--tag);color:var(--tag-fg)}
@media (hover:hover){
  .tile:hover .i2,.tile:focus-visible .i2{opacity:1}
  .tile:hover .ph img,.tile:focus-visible .ph img{transform:scale(var(--z))}
}
/* A: square on soft grey, centred caption in small caps */
html[data-skin="a"] .tile .cap{text-align:center;justify-items:center}
html[data-skin="a"] .tile .nm{text-transform:uppercase}
html[data-skin="a"] .tag{left:0;top:0;background:transparent;color:var(--fg);padding:12px}
/* B: card, hard shadow, wipe to the worn shot, round sticker */
html[data-skin="b"] .tile{background:#FFFFFF;border:2px solid #0B1D3F;border-radius:var(--radius);box-shadow:5px 5px 0 #0B1D3F;transition:box-shadow var(--t-line) var(--ease),transform var(--t-line) var(--ease)}
html[data-skin="b"] .tile .ph{aspect-ratio:4/5;border-radius:10px 10px 0 0;border-bottom:2px solid #0B1D3F}
html[data-skin="b"] .tile .ph .i2{opacity:1;clip-path:inset(0 0 0 100%)}
html[data-skin="b"] .tile .cap{padding:12px 14px 14px;gap:4px}
html[data-skin="b"] .tag{left:auto;right:8px;top:8px;width:46px;height:46px;border-radius:50%;padding:0;display:grid;place-items:center;border:2px solid #0B1D3F;transform:rotate(-12deg);letter-spacing:.08em}
@media (hover:hover){
  html[data-skin="b"] .tile:hover{box-shadow:9px 9px 0 #FF7A6A;transform:translate(-3px,-3px)}
  html[data-skin="b"] .tile:hover .i2,html[data-skin="b"] .tile:focus-visible .i2{clip-path:inset(0 0 0 0)}
}
/* C: tall frames, gold hairline on hover, slow */
html[data-skin="c"] .tile .ph{aspect-ratio:4/5}
html[data-skin="c"] .tile .ph::after{content:"";position:absolute;inset:10px;border:1px solid var(--gold);opacity:0;transition:opacity var(--t-img) var(--ease),inset var(--t-img) var(--ease);pointer-events:none;z-index:2}
html[data-skin="c"] .tile .cap{text-align:center;justify-items:center;padding-top:18px}
html[data-skin="c"] .tag{left:50%;top:14px;transform:translateX(-50%);background:transparent;letter-spacing:.4em;font-weight:500}
@media (hover:hover){html[data-skin="c"] .tile:hover .ph::after{opacity:1;inset:14px}}

/* reveal, three moods */
[data-reveal]{transition:opacity var(--t-in) var(--ease),transform var(--t-in) var(--ease),filter var(--t-in) var(--ease);transition-delay:calc(var(--d,0) * 90ms)}
[data-reveal].wait{opacity:0;transform:translateY(var(--rise));filter:blur(var(--blur))}

/* ---------- ranking ---------- */
.rank{display:grid;grid-auto-flow:column;grid-auto-columns:42%;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:4px 4px 12px}
.rank::-webkit-scrollbar{display:none}
.rank > *{scroll-snap-align:start}
.rk-n{display:block;font:300 28px/1 var(--display);color:var(--fg);margin-bottom:10px;font-variant-numeric:lining-nums}
html[data-skin="a"] .rk-n{font:400 11px/1 var(--lat);letter-spacing:.24em;text-align:center;border-bottom:1px solid var(--line);padding-bottom:10px}
html[data-skin="a"] .rk-n::before{content:"No."}
@media (min-width:900px){.rank{grid-auto-columns:calc((100% - 4 * 20px) / 5);gap:20px}}
/* B podium */
.podium{display:grid;grid-template-columns:minmax(0,1fr);gap:28px}
.podium .top{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.podium .top .tile .cap{padding:10px}
.podium .medal{position:absolute;left:-10px;top:-14px;z-index:3;width:48px;height:48px;border-radius:50%;background:#FF7A6A;border:2px solid #0B1D3F;display:grid;place-items:center;font:italic 500 26px/1 var(--display);color:#0B1D3F}
.podium .top > :first-child .medal{background:#0B1D3F;color:#FF7A6A}
.podium .list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.podium .list a{display:grid;grid-template-columns:36px 64px minmax(0,1fr) auto;gap:12px;align-items:center;text-decoration:none;color:#0B1D3F;background:#FFFFFF;border:2px solid #0B1D3F;border-radius:10px;padding:8px 14px 8px 8px;transition:box-shadow var(--t-line) var(--ease),transform var(--t-line) var(--ease)}
.podium .list a:hover{box-shadow:4px 4px 0 #0B1D3F;transform:translate(-2px,-2px)}
.podium .list i{font:italic 500 24px/1 var(--display);text-align:center}
.podium .list img{width:64px;height:64px;object-fit:cover;border-radius:6px}
.podium .list b{font:700 13px/1.4 var(--jp)}
.podium .list span{font:600 13px/1 var(--lat)}
@media (min-width:900px){.podium{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:48px;align-items:start}.podium .top{gap:24px}}
@media (max-width:899px){.podium .top .tile .nm{font-size:12px}.podium .medal{width:38px;height:38px;font-size:20px}}
/* C list */
.rank-c{display:grid;grid-template-columns:minmax(0,1fr);border-top:1px solid var(--line)}
.rank-c a{display:grid;grid-template-columns:56px 76px minmax(0,1fr) auto;gap:18px;align-items:center;padding:16px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg);transition:background-color var(--t-line) var(--ease)}
.rank-c a:hover{background:#121212}
.rank-c i{font:300 34px/1 var(--display);color:var(--gold);font-style:normal;text-align:center}
.rank-c img{width:76px;height:95px;object-fit:cover}
.rank-c b{font:400 19px/1.3 var(--display);letter-spacing:.04em;display:block}
.rank-c small{font-size:11px;letter-spacing:.2em;color:var(--soft)}
.rank-c span{font:500 13px/1 var(--lat);color:var(--gold)}
@media (min-width:900px){.rank-c{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:56px}}
.src{font-size:11.5px;color:var(--soft);margin-top:18px;letter-spacing:.06em}
html[data-skin="a"] .src,html[data-skin="c"] .src{text-align:center}

/* ---------- lookbook ---------- */
.look{display:grid;grid-auto-flow:column;grid-auto-columns:72%;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.look::-webkit-scrollbar{display:none}
.look a{scroll-snap-align:start;position:relative;display:block;text-decoration:none;color:#FFFFFF;overflow:hidden;aspect-ratio:4/5;background:#222}
.look img{width:100%;height:100%;object-fit:cover;transition:transform var(--t-zoom) var(--ease)}
.look a:hover img{transform:scale(var(--z))}
.look .lb{position:absolute;left:0;right:0;bottom:0;padding:40px 16px 14px;background:linear-gradient(transparent,rgba(0,0,0,.55));display:grid;gap:2px}
.look .lb small{font:500 10px/1.3 var(--lat);letter-spacing:.24em;opacity:.85}
.look .lb b{font:400 18px/1.3 var(--display);letter-spacing:.04em}
.look .lb span{font:500 12px/1 var(--lat)}
@media (min-width:900px){.look{grid-auto-columns:calc((100% - 3 * 16px) / 4);gap:16px}}
html[data-skin="b"] .lookband{background:var(--rose);border-block:2px solid #0B1D3F}
html[data-skin="b"] .look a{border:2px solid #0B1D3F;border-radius:14px}
html[data-skin="b"] .look .lb{background:#FFFFFF;color:#0B1D3F;border-top:2px solid #0B1D3F;padding:10px 12px}
html[data-skin="b"] .look .lb b{font:700 13px/1.3 var(--jp)}
html[data-skin="c"] .look a{aspect-ratio:3/4}
html[data-skin="c"] .look img{filter:grayscale(.35) brightness(.9);transition:transform var(--t-zoom) var(--ease),filter var(--t-img) var(--ease)}
html[data-skin="c"] .look a:hover img{filter:none}
html[data-skin="c"] .look .lb span{color:var(--gold)}

/* bands */
.band{position:relative;display:grid;grid-template-columns:minmax(0,1fr);background:#0A0A0A;color:#F3EEE6}
.band .ph{aspect-ratio:4/3;overflow:hidden}
.band .ph img{width:100%;height:100%;object-fit:cover;transition:transform var(--t-zoom) var(--ease)}
.band:hover .ph img{transform:scale(var(--z))}
.band .copy{padding:40px var(--gr) 48px var(--gl);display:grid;gap:18px;align-content:center;justify-items:start}
.band h2{font:300 clamp(40px,6vw,72px)/1 var(--display);letter-spacing:.12em;margin:0;color:#F3EEE6}
.band p{color:#CFC9BF;max-width:30em}
.band .eyebrow{color:#D9C1A0}
.band .btn{--btn:transparent;--btn-fg:#D9C1A0;--btn-line:#D9C1A0;--fill:#D9C1A0;--fill-fg:#0A0A0A}
html[data-skin="b"] .band{border-block:2px solid #0B1D3F}
html[data-skin="b"] .band .btn{--btn:#FF7A6A;--btn-fg:#0B1D3F;--btn-line:#0B1D3F;--fill:#FFFFFF;--fill-fg:#0B1D3F}
.band.wa{background:#2B2822}
@media (min-width:900px){.band{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}.band .ph{aspect-ratio:auto;min-height:520px}.band .copy{padding:64px max(48px,var(--gr)) 64px 64px}.band.flip .ph{order:2}.band.flip .copy{padding:64px 64px 64px max(48px,var(--gl))}}
.wa-list{display:grid;gap:14px;margin-top:4px}
.wa-list a{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;align-items:center;text-decoration:none;color:#F3EEE6}
.wa-list img{width:64px;height:80px;object-fit:cover;background:#FFFFFF}
.wa-list b{display:block;font:400 19px/1.2 var(--display);letter-spacing:.04em}
.wa-list span{font-size:12.5px;color:#CFC9BF;line-height:1.7}

/* how to wear */
.steps{display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
.step{display:grid;grid-template-columns:52px minmax(0,1fr);gap:16px;align-items:start}
.step .n{font:300 44px/.9 var(--display);color:var(--fg)}
.step h3{font:700 14.5px/1.7 var(--jp);color:var(--fg);margin:0;padding-top:8px;letter-spacing:.08em}
.feats{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;border-top:1px solid var(--line);padding-top:32px;margin-top:40px}
.feat h3{font:400 18px/1.6 var(--jp-serif);color:var(--fg);margin:0 0 8px;letter-spacing:.08em;font-feature-settings:"palt"}
.feat p{font-size:13.5px}
.feat .note{font-size:11.5px;color:var(--soft);margin-top:6px}
html[data-skin="a"] .steps,html[data-skin="a"] .feats{text-align:center}
html[data-skin="a"] .step{grid-template-columns:minmax(0,1fr);justify-items:center;gap:8px}
html[data-skin="a"] .step .n{font:400 11px/1 var(--lat);letter-spacing:.3em}
html[data-skin="a"] .step .n::before{content:"STEP "}
html[data-skin="b"] .step{background:#FFFFFF;border:2px solid #0B1D3F;border-radius:14px;padding:18px;box-shadow:5px 5px 0 #0B1D3F}
html[data-skin="b"] .step .n{font:italic 500 46px/.9 var(--display);color:#FF7A6A;-webkit-text-stroke:1px #0B1D3F}
html[data-skin="b"] .feat h3{font:900 19px/1.5 var(--jp);color:#0B1D3F;display:inline;background:linear-gradient(transparent 60%,var(--rose) 60%)}
html[data-skin="b"] .feat h3+p{margin-top:12px}
html[data-skin="c"] .step .n{color:var(--gold)}
html[data-skin="c"] .feat h3{color:var(--gold);font-weight:300}
@media (min-width:900px){.steps{grid-template-columns:repeat(3,minmax(0,1fr));gap:40px}.feats{grid-template-columns:repeat(3,minmax(0,1fr));gap:48px}}

/* stories */
.stories{display:grid;grid-auto-flow:column;grid-auto-columns:80%;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:4px}
.stories::-webkit-scrollbar{display:none}
.story-card{scroll-snap-align:start;text-decoration:none;color:inherit;display:grid;gap:12px;align-content:start;min-width:0}
.story-card .ph{aspect-ratio:3/2;overflow:hidden;background:var(--bg-alt)}
.story-card .ph img{width:100%;height:100%;object-fit:cover;transition:transform var(--t-zoom) var(--ease)}
.story-card:hover .ph img{transform:scale(var(--z))}
.story-card .dt{font:500 11px/1 var(--lat);letter-spacing:.16em;color:var(--soft)}
.story-card .tt{font:400 15px/1.8 var(--jp-serif);color:var(--fg);letter-spacing:.04em;font-feature-settings:"palt";line-break:strict;word-break:auto-phrase}
html[data-skin="b"] .story-card .ph{border:2px solid #0B1D3F;border-radius:14px}
html[data-skin="b"] .story-card .tt{font:700 14.5px/1.75 var(--jp)}
html[data-skin="c"] .story-card .dt{color:var(--gold)}
@media (min-width:900px){.stories{grid-auto-flow:row;grid-template-columns:repeat(4,minmax(0,1fr));overflow:visible;gap:28px}}
/* A: one story large */
.story-lead{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;text-decoration:none;color:inherit;margin-bottom:48px}
.story-lead .ph{aspect-ratio:3/2;overflow:hidden}
.story-lead img{width:100%;height:100%;object-fit:cover;transition:transform var(--t-zoom) var(--ease)}
.story-lead:hover img{transform:scale(var(--z))}
.story-lead .tx{display:grid;gap:14px;align-content:center}
.story-lead .tt{font:300 clamp(18px,2.4vw,24px)/1.9 var(--jp);letter-spacing:.1em;color:var(--fg);font-feature-settings:"palt";word-break:auto-phrase}
@media (min-width:900px){.story-lead{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:56px}}

/* instagram */
.ig{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.ig a{position:relative;display:block;aspect-ratio:1;overflow:hidden;background:var(--bg-alt)}
.ig img{width:100%;height:100%;object-fit:cover;transition:transform var(--t-zoom) var(--ease),filter var(--t-img) var(--ease)}
.ig a:hover img{transform:scale(var(--z))}
@media (min-width:900px){.ig{grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}}
html[data-skin="b"] .ig{gap:10px}
html[data-skin="b"] .ig a{border:2px solid #0B1D3F;border-radius:12px}
html[data-skin="b"] .ig a:nth-child(even){transform:translateY(14px)}
html[data-skin="c"] .ig img{filter:grayscale(1) brightness(.8)}
html[data-skin="c"] .ig a:hover img{filter:none}

/* gift, LINE, newsletter */
.duo{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.card{background:var(--surface);border:1px solid var(--line);padding:24px;display:grid;grid-template-columns:96px minmax(0,1fr);gap:20px;align-items:center}
.card img{width:96px;height:120px;object-fit:cover;background:#FFFFFF}
.card h3{font:400 18px/1.5 var(--jp-serif);color:var(--fg);margin:0 0 6px;letter-spacing:.06em}
.card p{font-size:13px}
.card .act{margin-top:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
html[data-skin="b"] .card{border:2px solid #0B1D3F;border-radius:14px;box-shadow:5px 5px 0 #0B1D3F}
html[data-skin="b"] .card h3{font:900 18px/1.5 var(--jp);color:#0B1D3F}
html[data-skin="c"] .card{border-color:#2A2A2A}
html[data-skin="c"] .card h3{color:var(--gold);font-weight:300}
.line-badge{display:inline-grid;place-items:center;width:96px;height:96px;border-radius:24px;background:#06C755;color:#FFFFFF;font:700 22px/1 var(--lat)}
.btn.line{--btn:#06C755;--btn-line:#06C755;--btn-fg:#FFFFFF;--fill:#04A246;--fill-fg:#FFFFFF;min-height:44px;padding:0 20px;font-size:13px}
html[data-skin="b"] .btn.line{--btn-line:#0B1D3F}
html[data-skin="c"] .btn.line{font-family:var(--jp)}
.btn.sm{min-height:44px;padding:0 20px;font-size:12.5px}
.news{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;align-items:center}
.news h2{margin:0;font:400 clamp(20px,3vw,26px)/1.6 var(--jp-serif);letter-spacing:.1em;color:var(--fg)}
.news form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.news input{height:52px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0 16px;min-width:0;font-size:14px}
html[data-skin="b"] .news input{border:2px solid #0B1D3F;border-radius:999px}
html[data-skin="c"] .news input{border-color:#3A3328}
@media (min-width:900px){.duo{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.news{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:56px}}

/* ---------- footer ---------- */
.foot{background:var(--foot);color:var(--foot-soft);font-size:12.5px}
.foot .wrap{padding-block:64px 28px;display:grid;gap:40px}
.foot .wm{width:120px;color:var(--foot-fg)}
.foot h4{font:600 10.5px/1 var(--lat);letter-spacing:.22em;color:var(--foot-accent);margin:0 0 16px;text-transform:uppercase}
.foot ul{list-style:none;margin:0;padding:0;display:grid;gap:11px}
.foot a{color:var(--foot-fg);text-decoration:none}
.foot a:hover{text-decoration:underline;text-underline-offset:4px}
.foot .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px 20px}
.foot .addr{line-height:1.9}
.foot .base{border-top:1px solid var(--foot-line);padding-top:20px;display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:center;font:400 11px/1.6 var(--lat);letter-spacing:.06em}
@media (min-width:900px){.foot .wrap{grid-template-columns:minmax(0,1fr) minmax(0,2.4fr)}.foot .cols{grid-template-columns:repeat(4,minmax(0,1fr))}.foot .base{grid-column:1/-1}}
.pays{display:flex;flex-wrap:wrap;gap:6px}
.pay{font:500 10.5px/1 var(--jp);letter-spacing:.04em;border:1px solid var(--line);padding:7px 8px;color:var(--fg);background:var(--surface);white-space:nowrap}
.pay.new{border-style:dashed}
.foot .pay{background:transparent;border-color:var(--foot-line);color:var(--foot-fg)}
html[data-skin="b"] .pay{border-radius:999px;border-width:1.5px}

/* ---------- collection ---------- */
.crumb{font:400 11.5px/1.6 var(--jp);color:var(--soft);padding-block:16px 0;display:flex;flex-wrap:wrap;gap:8px}
.crumb a{text-decoration:none}
.crumb a:hover{text-decoration:underline}
.ptitle{padding-block:28px 12px;display:grid;gap:10px}
.ptitle h1{margin:0;color:var(--fg);font:var(--h-weight) clamp(30px,6vw,64px)/1 var(--h-font);letter-spacing:var(--h-track);text-transform:var(--h-case)}
html[data-skin="a"] .ptitle{text-align:center;justify-items:center}
html[data-skin="a"] .ptitle h1{font:300 clamp(22px,3vw,30px)/1.3 var(--lat);letter-spacing:.3em}
html[data-skin="b"] .ptitle h1{font-style:italic}
html[data-skin="c"] .ptitle{text-align:center;justify-items:center}
.tools{position:sticky;top:calc(var(--bar) + 60px + env(safe-area-inset-top, 0px));z-index:30;background:var(--bg);border-bottom:1px solid var(--line);margin-bottom:28px}
.tools .wrap{display:flex;gap:12px;align-items:center;padding-block:10px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font:500 10.5px/1 var(--lat);letter-spacing:.14em;border:1px solid var(--line);background:var(--chip);color:var(--fg);padding:10px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-fg);border-color:var(--chip-on)}
html[data-skin="a"] .chip{border:0;background:none;padding:10px 8px;color:var(--soft)}
html[data-skin="a"] .chip[aria-pressed="true"]{background:none;color:var(--fg);box-shadow:inset 0 -1px 0 var(--fg)}
html[data-skin="b"] .chip{border:2px solid #0B1D3F;border-radius:999px;font-weight:600}
html[data-skin="c"] .chip{border-color:#2A2A2A}
.sel{font:500 12px/1 var(--jp);border:1px solid var(--line);background:var(--chip);color:var(--fg);height:40px;padding:0 10px;letter-spacing:.04em}
html[data-skin="b"] .sel{border:2px solid #0B1D3F;border-radius:999px}
.cnt{font:500 12px/1 var(--jp);color:var(--soft);white-space:nowrap}
@media (min-width:1080px){.tools{top:calc(var(--bar) + 72px + env(safe-area-inset-top, 0px))}html[data-skin="a"] .tools{top:calc(var(--bar) + 113px + env(safe-area-inset-top, 0px))}}
.cbanner{position:relative;overflow:hidden;min-height:300px;display:grid;align-items:end;color:#F3EEE6;background:#000}
.cbanner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.6);animation:kb 22s ease-in-out infinite alternate}
html[data-fx="off"] .cbanner img{animation:none}
.cbanner .copy{position:relative;z-index:2;padding-block:72px 40px;display:grid;gap:14px}
.cbanner h1{margin:0;font:300 clamp(56px,11vw,120px)/.9 var(--display);letter-spacing:.14em;color:#F3EEE6}
.cbanner p{font:300 14px/2 var(--jp-serif);letter-spacing:.14em;color:#D8D0C3}
.cbanner .eyebrow{color:var(--gold)}
@media (min-width:900px){.cbanner{min-height:520px}}

/* ---------- product page ---------- */
.pdp{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;padding-bottom:48px}
.gallery{position:relative;min-width:0}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-inline:calc(var(--gl) * -1) calc(var(--gr) * -1)}
.gal::-webkit-scrollbar{display:none}
.gal figure{flex:0 0 100%;margin:0;scroll-snap-align:start;aspect-ratio:4/5;overflow:hidden;background:var(--img-bg);position:relative;cursor:zoom-in}
.gal img{width:100%;height:100%;object-fit:cover}
.lens{position:absolute;inset:0;background-repeat:no-repeat;background-size:230%;opacity:0;transition:opacity .25s var(--ease);pointer-events:none}
.gal figure:hover .lens{opacity:1}
.gdots{display:flex;justify-content:center;gap:6px;margin-top:12px}
.gdots i{width:6px;height:6px;border-radius:50%;background:var(--line);transition:background-color .3s}
.gdots i.on{background:var(--fg)}
.thumbs{display:none}
.info{display:grid;gap:20px;align-content:start;min-width:0}
.info h1{margin:0;color:var(--fg);font:400 clamp(28px,5vw,38px)/1.15 var(--display);letter-spacing:.02em}
html[data-skin="a"] .info h1{font:400 clamp(18px,2.4vw,22px)/1.5 var(--lat);letter-spacing:.14em;text-transform:uppercase}
html[data-skin="b"] .info h1{font:900 clamp(26px,4.4vw,36px)/1.25 var(--jp);color:#0B1D3F}
.info .code{font:400 11px/1 var(--lat);color:var(--soft);letter-spacing:.1em}
.price{font:500 22px/1 var(--lat);color:var(--price);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.pts{font-size:12px;color:var(--soft)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{border:1px solid var(--line);background:var(--surface);padding:14px;text-align:left;cursor:pointer;display:grid;gap:4px;color:var(--fg)}
.opt b{font:500 13px/1.4 var(--jp)}
.opt span{font:500 12.5px/1 var(--lat);color:var(--soft);font-variant-numeric:tabular-nums}
.opt[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
html[data-skin="b"] .opt{border:2px solid #0B1D3F;border-radius:12px}
html[data-skin="b"] .opt[aria-pressed="true"]{background:var(--rose);box-shadow:3px 3px 0 #0B1D3F}
html[data-skin="c"] .opt[aria-pressed="true"]{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.lbl{font:700 12px/1.4 var(--jp);color:var(--fg);letter-spacing:.1em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--surface)}
.qty button{width:44px;height:44px;background:transparent;border:0;cursor:pointer;color:var(--fg);font:400 18px/1 var(--lat)}
.qty output{min-width:30px;text-align:center;font:500 14px/1 var(--lat);color:var(--fg)}
html[data-skin="b"] .qty{border:2px solid #0B1D3F;border-radius:999px}
.check{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start;font-size:13.5px;color:var(--fg);cursor:pointer;border:1px solid var(--line);padding:14px;background:var(--surface)}
.check input{width:18px;height:18px;margin:3px 0 0;accent-color:var(--fg)}
.check small{display:block;color:var(--soft);font-size:12px}
html[data-skin="b"] .check{border:2px solid #0B1D3F;border-radius:12px}
html[data-skin="c"] .check input{accent-color:#D9C1A0}
.dd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.dd select{width:100%}
.buyrow{display:grid;grid-template-columns:minmax(0,1fr) 52px;gap:8px}
.rows{display:grid;border-top:1px solid var(--line);margin:0}
.rows div{display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}
.rows dt{font-weight:700;color:var(--fg)}
.rows dd{margin:0}
.size{display:grid;gap:12px;border:1px solid var(--line);padding:16px;background:var(--surface)}
.size table{border-collapse:collapse;width:100%;font-size:13px}
.size th,.size td{text-align:left;vertical-align:top;padding:7px 0;border-bottom:1px solid var(--line)}
.size tr:last-child th,.size tr:last-child td{border-bottom:0}
.size th{width:8.5em;font-weight:700;color:var(--fg);padding-right:12px}
html[data-skin="b"] .size{border:2px solid #0B1D3F;border-radius:12px}
details.acc{border-bottom:1px solid var(--line)}
details.acc:first-of-type{border-top:1px solid var(--line)}
details.acc summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:16px 0;font:500 11.5px/1 var(--lat);letter-spacing:.22em;color:var(--fg)}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"+";font:300 20px/1 var(--lat)}
details.acc[open] summary::after{content:"−"}
details.acc .body{padding:0 0 18px;font-size:14px;display:grid;gap:10px}
details.acc ul{margin:0;padding-left:1.1em;display:grid;gap:4px}
.ask{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--soft);flex-wrap:wrap}
.ask a{color:var(--fg)}
.buybar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--bg);border-top:1px solid var(--line);padding:10px var(--gr) calc(10px + env(safe-area-inset-bottom, 0px)) var(--gl);display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:12px;transform:translateY(110%);transition:transform .35s var(--ease)}
.buybar.on{transform:none}
.buybar .nm{font-size:11px;color:var(--soft);display:block;line-height:1.3;max-width:9.5em;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.buybar .price{font-size:16px}
.buybar .btn{min-height:48px}
html[data-skin="b"] .buybar{border-top:2px solid #0B1D3F}
@media (min-width:900px){
  .pdp{grid-template-columns:76px minmax(0,1.2fr) minmax(0,1fr);gap:24px 48px;padding-bottom:80px}
  .thumbs{display:grid;gap:8px;align-content:start;position:sticky;top:calc(var(--bar) + 110px)}
  .thumbs button{border:1px solid var(--line);padding:0;background:var(--img-bg);cursor:pointer;aspect-ratio:4/5;overflow:hidden;opacity:.6;transition:opacity .3s}
  .thumbs button.on{opacity:1;border-color:var(--fg)}
  .thumbs img{width:100%;height:100%;object-fit:cover}
  .gal{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;overflow:visible;margin:0}
  .gdots{display:none}
  .info{position:sticky;top:calc(var(--bar) + 100px);gap:22px}
  .buybar{display:none}
}
html[data-skin="b"] .gal figure{border:2px solid #0B1D3F;border-radius:14px}
@media (min-width:900px){html[data-skin="b"] .gal{gap:16px}}
.rev{display:grid;gap:14px;border:1px solid var(--line);padding:28px;background:var(--surface)}
.stars{display:flex;gap:3px;color:var(--soft)}
.stars svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.3}
.rev .sum{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.rev .sum b{font:300 40px/1 var(--display);color:var(--fg)}
html[data-skin="b"] .rev{border:2px solid #0B1D3F;border-radius:14px;box-shadow:5px 5px 0 #0B1D3F}
.lb{min-width:0}
/* lightbox */
.lightbox{position:fixed;inset:0;z-index:130;background:rgba(8,8,8,.96);display:grid;grid-template-rows:auto minmax(0,1fr) auto;opacity:0;pointer-events:none;transition:opacity .3s var(--ease);padding:env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px)}
.lightbox.on{opacity:1;pointer-events:auto}
.lightbox .top{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;color:#EDE9E2;font:500 12px/1 var(--lat);letter-spacing:.14em}
.lightbox .track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.lightbox .track::-webkit-scrollbar{display:none}
.lightbox .track figure{flex:0 0 100%;margin:0;scroll-snap-align:start;display:grid;place-items:center;padding:8px}
.lightbox .track img{max-height:100%;max-width:100%;object-fit:contain}
.lightbox .icon{color:#EDE9E2}

/* ---------- story, guide, legal ---------- */
.art{max-width:760px;margin:0 auto;padding-left:var(--gl);padding-right:var(--gr)}
.art h1{font-size:clamp(22px,4.4vw,30px);line-height:1.75;margin:12px 0 18px}
.art .meta{font:500 11px/1 var(--lat);letter-spacing:.16em;color:var(--soft)}
.art p{font-size:15.5px;line-height:2.05;margin:0 0 1.2em}
.art h2{font:400 clamp(19px,3.4vw,22px)/1.7 var(--jp-serif);color:var(--fg);letter-spacing:.06em;margin:2.2em 0 1em;font-feature-settings:"palt"}
.art blockquote{margin:1.6em 0;padding:0 0 0 18px;border-left:1px solid var(--accent);font-family:var(--jp-serif);color:var(--fg)}
.art figure{margin:2em calc(var(--gl) * -1)}
.art figure img{width:100%;height:auto}
.art .prof{border-top:1px solid var(--line);padding-top:20px;margin-top:2.4em;font-size:13.5px}
.story-hero{aspect-ratio:3/2;overflow:hidden;max-height:78vh}
.story-hero img{width:100%;height:100%;object-fit:cover}
.mark{border:1px dashed var(--line);padding:16px 18px;font-size:13px;color:var(--soft);display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
@media (min-width:900px){.art figure{margin:2.4em -80px}}
.doc{max-width:860px}
html[data-skin="a"] .doc,html[data-skin="c"] .doc{margin:0 auto}
.doc h2{font:400 20px/1.6 var(--jp-serif);color:var(--fg);letter-spacing:.06em;margin:48px 0 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.doc p,.doc li{font-size:14.5px}
.doc ul{padding-left:1.1em;display:grid;gap:6px}
.tbl{overflow-x:auto;border-top:1px solid var(--line)}
.tbl table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
.tbl th,.tbl td{text-align:left;vertical-align:top;padding:14px 12px 14px 0;border-bottom:1px solid var(--line)}
.tbl th{width:13em;font-weight:700;color:var(--fg)}
.note-box{background:var(--bg-alt);border:1px solid var(--line);padding:18px 20px;font-size:13.5px;display:grid;gap:8px;margin-top:28px}

/* ---------- drawers, dialog, toast, C bottom pill ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,10,10,.45);z-index:95;opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;right:0;z-index:100;width:min(440px,100%);background:var(--bg);color:var(--text);display:flex;flex-direction:column;transform:translateX(102%);transition:transform .4s var(--ease);padding-top:env(safe-area-inset-top, 0px);padding-bottom:env(safe-area-inset-bottom, 0px);padding-right:env(safe-area-inset-right, 0px)}
.drawer.left{right:auto;left:0;transform:translateX(-102%);padding-right:0;padding-left:env(safe-area-inset-left, 0px)}
.drawer.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);color:var(--fg)}
.dh h2{font:500 12px/1 var(--lat);letter-spacing:.24em;margin:0}
.db{flex:1;overflow-y:auto;padding:20px;display:grid;gap:18px;align-content:start}
.df{border-top:1px solid var(--line);padding:18px 20px;display:grid;gap:12px}
.ship{display:grid;gap:8px;font-size:13px;color:var(--fg)}
.bar{height:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .5s var(--ease)}
.line-item{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:14px;align-items:start}
.line-item img{width:72px;height:90px;object-fit:cover;background:#FFFFFF}
.line-item .nm{font:400 16px/1.3 var(--display);color:var(--fg)}
.line-item .vr{font-size:12px;color:var(--soft)}
.line-item .rm{justify-self:start;background:none;border:0;color:var(--soft);font-size:12px;cursor:pointer;text-decoration:underline;padding:6px 0}
.line-item .qty button{width:34px;height:34px}
.sum{display:grid;gap:6px;font-size:13.5px}
.sum div{display:flex;justify-content:space-between;gap:12px}
.sum .tot{font-weight:700;color:var(--fg);font-size:15px}
.empty{padding:40px 0;text-align:center;display:grid;gap:16px;justify-items:center}
.mnav{display:grid}
.mnav a{display:flex;justify-content:space-between;padding:15px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg);font:500 12.5px/1 var(--lat);letter-spacing:.16em}
.mnav a span{font:400 12px/1 var(--jp);letter-spacing:.06em;color:var(--soft)}
.dlg{position:fixed;z-index:110;left:50%;top:50%;transform:translate(-50%,-48%);width:min(680px,calc(100% - 32px));max-height:calc(100% - 96px);overflow:auto;background:#FAF7F2;color:#4A453E;border-radius:10px;padding:28px;opacity:0;pointer-events:none;transition:opacity .25s var(--ease),transform .25s var(--ease);font:400 14px/1.8 var(--lat);letter-spacing:.01em}

  '<div><h4>Follow</h4><ul><li><a href="https://www.instagram.com/baqless_jp/" target="_blank" rel="noopener">Instagram ＠baqless_jp</a></li><li><a href="https://lin.ee/ByfAr8V" target="_blank" rel="noopener">LINE</a></li></ul></div></div>' +
  '<div class="base"><div class="pays">' + ["クレジットカード","Amazon Pay","代金引換","PayPay","楽天ペイ","コンビニ払い"].map(x => '<span class="pay">' + x + '</span>').join("") + '</div><span>© 株式会社木村商店</span></div></div>';
  $("#menu").innerHTML = '<div class="dh"><h2>MENU</h2><button type="button" class="icon" data-close aria-label="' + L("閉じる","Close") + '"><svg><use href="#i-x"/></svg></button></div><div class="db"><nav class="mnav">' + NAV.map(n => '<a href="#' + n[0] + '">' + n[1] + '<span>' + ({collection:"コレクション","new-arrival":"新着",black:"ブラック",wa:"和",about:"ブランドについて",shoplist:"取扱店舗","lifestyle-lisa":"ライフスタイル",guide:"ご利用ガイド"})[n[0]] + '</span></a>').join("") + '<a href="#legal">LEGAL<span>特定商取引法に基づく表記</span></a></nav><a class="btn line" href="https://lin.ee/ByfAr8V" target="_blank" rel="noopener">' + L("LINE 友だち追加","Add us on LINE") + '</a></div>';
  $("#pill-menu span").textContent = L("メニュー","Menu");
  $("#about").innerHTML = aboutHTML();
  renderCart();
}
function aboutHTML(){
  const x = '<button type="button" class="icon x" data-close aria-label="Close"><svg><use href="#i-x"/></svg></button>';
  if (S.lang === "en") return x + '<h2 id="about-h">About this prototype</h2><p>The new baqless.jp on Shopify. Three finished directions of the same shop. Products, prices, photos and texts from baqless.jp on 20.11.2026, regular prices without the Black Friday discount.</p>' +
    '<h3>A 静 Calm</h3><p>White, centred logo above the menu, slideshow with progress lines, square tiles on soft grey, small caps, slow fades. In the line of the Japanese jewellery houses.</p>' +
    '<h3>B 躍 Brand</h3><p>The Baqless CI at full strength: Navy, Coral and Rose, ticker, big italic serif and heavy Japanese type with marker lines, cards with hard offset shadows, the worn photo wipes in, ranking as a podium. Our recommendation.</p>' +
    '<h3>C 艶 Black</h3><p>Black and gold, Mincho headings, full-bleed hero with slow camera move and a light that follows the cursor, gold hairline frames, slow light sweep on buttons, floating menu pill on phones. In A and B the BLACK pages use this look.</p>' +
    '<h3>Marked as proposed</h3><p>Dashed labels are new and not in today\'s shop: delivery date and time, PayPay, Rakuten Pay, konbini, Apple Pay, reviews, LINE login. Checkout does not run. FX switches the motion off.</p>';
  return x + '<h2 id="about-h">このプロトタイプについて</h2><p>Shopifyで構築する新しいbaqless.jpの試作です。同じショップを3つの完成形で。商品・価格・写真・文章は2026年11月20日時点のbaqless.jpから、ブラックフライデー前の通常価格です。</p>' +
    '<h3>A 静 Calm</h3><p>白を基調に、ロゴを中央、その下にメニュー。進行ラインつきのスライドショー、淡いグレーの正方形カード、小さな英字、ゆっくりとしたフェード。日本のジュエリーブランドの文法で。</p>' +
    '<h3>B 躍 Brand</h3><p>Baqlessのブランドカラーを全面に。ネイビー、コーラル、ローズ、流れるティッカー、大きなイタリック体と太い和文にマーカー線、ずらし影のカード、着用写真がワイプで現れるホバー、表彰台のランキング。推奨。</p>' +
    '<h3>C 艶 Black</h3><p>黒とゴールド、明朝体の見出し、ゆっくり動く全面ヒーローとカーソルに寄り添う光、金のヘアラインフレーム、ボタンを横切る光、スマートフォンでは浮かぶメニュー。AとBでもBLACKのページはこの表情になります。</p>' +
    '<h3>「提案」の表示</h3><p>点線のラベルは現在のショップにない新機能です：お届け日時指定、PayPay・楽天ペイ・コンビニ払い・Apple Pay、レビュー、LINEログイン。決済画面には進みません。FXで動きをオフにできます。</p>';
}

/* ---------- cart ---------- */
function cartTotal(){ return S.cart.reduce((s, l) => s + (l.half ? by[l.id].h : by[l.id].p) * l.q, 0) + (S.gift && S.cart.length ? GIFT : 0); }
function renderCart(){
  const n = S.cart.reduce((s, l) => s + l.q, 0);
  const cc = $("#cart-count"); cc.textContent = n; cc.hidden = !n;
  const sub = cartTotal(), rest = Math.max(0, FREE - sub), ship = sub >= FREE || !sub ? 0 : SHIP;
  let h = '<div class="dh"><h2>CART</h2><button type="button" class="icon" data-close aria-label="' + L("閉じる","Close") + '"><svg><use href="#i-x"/></svg></button></div>';
  if (!S.cart.length) h += '<div class="db"><div class="empty"><p style="color:var(--fg)">' + L("カートに商品がありません。","Your cart is empty.") + '</p><a class="btn" href="#new-arrival">' + L("新作を見る","Shop new arrivals") + '</a></div></div>';
  else {
    h += '<div class="db"><div class="ship"><span>' + (rest ? L("あと<b class=\"num\">" + yen(rest) + "</b>で送料無料", "<b class=\"num\">" + yen(rest) + "</b> to free shipping") : L("送料無料でお届けします","Free shipping")) + '</span><div class="bar"><i style="width:' + Math.min(100, sub / FREE * 100) + '%"></i></div></div>' +
      S.cart.map((l, i) => { const p = by[l.id]; return '<div class="line-item"><img src="' + img(p.id, 0) + '" alt="" width="72" height="90"><div style="display:grid;gap:4px;min-width:0"><span class="nm">' + esc(p.n) + '</span><span class="vr">' + (p.h ? (l.half ? L("ハーフ（片耳用）","Single") : L("ペア（両耳用）","Pair")) : "") + '</span><span class="qty" style="justify-self:start"><button type="button" data-cq="' + i + '" data-d="-1" aria-label="-">−</button><output class="num">' + l.q + '</output><button type="button" data-cq="' + i + '" data-d="1" aria-label="+">+</button></span><button type="button" class="rm" data-rm="' + i + '">' + L("削除","Remove") + '</button></div><span class="num" style="color:var(--fg);font-size:13px">' + yen((l.half ? p.h : p.p) * l.q) + '</span></div>'; }).join("") +
      '<label class="check"><input type="checkbox" id="gift-cart"' + (S.gift ? " checked" : "") + '><span>' + L("ギフトラッピングを追加","Add gift wrapping") + ' <span class="num">+' + yen(GIFT) + '</span><small>' + L("オリジナルショッピングバッグ付き","With our shopping bag") + '</small></span></label>' +
      '<div style="display:grid;gap:10px"><span class="lbl">' + L("お届け日時","Delivery date and time") + PROP() + '</span><div class="dd"><select class="sel" aria-label="date"><option>' + L("指定なし","No preference") + '</option>' + deliveryDates().map(d => '<option>' + d + '</option>').join("") + '</select><select class="sel" aria-label="time"><option>' + L("指定なし","No preference") + '</option><option>' + L("午前中","Morning") + '</option><option>14:00〜16:00</option><option>16:00〜18:00</option><option>18:00〜20:00</option><option>19:00〜21:00</option></select></div></div>' +
      '</div><div class="df"><div class="sum"><div><span>' + L("小計","Subtotal") + '</span><span class="num">' + yen(sub) + '</span></div><div><span>' + L("送料","Shipping") + '</span><span class="num">' + (ship ? yen(ship) : L("無料","Free")) + '</span></div><div class="tot"><span>' + L("合計（税込）","Total incl. tax") + '</span><span class="num">' + yen(sub + ship) + '</span></div></div><button type="button" class="btn wide" id="checkout">' + L("ご購入手続きへ","Check out") + '</button>' + pays() + '</div>';
  }
  $("#cart").innerHTML = h;
}
function addToCart(id, half, q){
  const l = S.cart.find(x => x.id === id && !!x.half === !!half);
  if (l) l.q += q; else S.cart.push({id:id, half:!!half, q:q});
  save(); renderCart(); openPanel("cart");
}

/* ---------- panels ---------- */
let lastFocus = null;
function openPanel(id){
  lastFocus = document.activeElement;
  ["cart","menu","about"].forEach(x => { const el = $("#" + x), on = x === id; el.classList.toggle("on", on); el.setAttribute("aria-hidden", !on); });
  $("#scrim").classList.add("on");
  const f = $("#" + id + " [data-close]"); if (f) f.focus();
}
function closePanels(){
  ["cart","menu","about"].forEach(x => { $("#" + x).classList.remove("on"); $("#" + x).setAttribute("aria-hidden", "true"); });
  $("#scrim").classList.remove("on"); closeLightbox();
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}
let tt = null;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 2600); }
function openLightbox(start){
  if (!cur) return;
  const lb = $("#lightbox");
  lb.innerHTML = '<div class="top"><span class="num" id="lb-n">' + (start + 1) + ' / 3</span><button type="button" class="icon" id="lb-x" aria-label="' + L("閉じる","Close") + '"><svg><use href="#i-x"/></svg></button></div><div class="track" id="lb-t">' + [0,1,2].map(n => '<figure><img src="' + img(cur.id, n) + '" alt="' + esc(cur.n) + '" width="720" height="900"></figure>').join("") + '</div><div style="height:16px"></div>';
  lb.classList.add("on");
  const t = $("#lb-t"); t.scrollLeft = t.clientWidth * start;
  t.addEventListener("scroll", () => { $("#lb-n").textContent = (Math.round(t.scrollLeft / t.clientWidth) + 1) + " / 3"; }, {passive:true});
  $("#lb-x").addEventListener("click", closeLightbox); $("#lb-x").focus();
}
function closeLightbox(){ $("#lightbox").classList.remove("on"); }

/* ---------- motion ---------- */
let io = null, timers = [];
function reveal(){
  if (io) io.disconnect();
  const els = $$("[data-reveal]");
  if (!S.fx || !("IntersectionObserver" in window)) { els.forEach(e => e.classList.remove("wait")); return; }
  io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.remove("wait"); io.unobserve(e.target); } }), {rootMargin:"0px 0px -6% 0px"});
  els.forEach(e => { if (e.getBoundingClientRect().top > innerHeight * .95){ e.classList.add("wait"); io.observe(e); } });
}
function startMotion(){
  timers.forEach(clearInterval); timers = [];
  const still = !S.fx || matchMedia("(prefers-reduced-motion: reduce)").matches;
  const slides = $$(".hero-a .slide");
  if (slides.length){
    let i = 0; const s = SLIDES();
    const go = n => { i = n; slides.forEach((el, k) => { el.classList.toggle("on", k === i); el.setAttribute("aria-hidden", k !== i); el.tabIndex = k === i ? 0 : -1; }); $$(".hero-a .dots button").forEach((b, k) => { b.classList.remove("on"); void b.offsetWidth; b.classList.toggle("on", k === i); }); $("#cap-t").innerHTML = '<span>' + s[i].t + '</span><b>' + s[i].b + '</b>'; $("#cap-n").textContent = "0" + (i + 1) + " / 03"; };
    $$(".hero-a .dots button").forEach(b => b.addEventListener("click", () => go(+b.dataset.slide)));
    if (!still) timers.push(setInterval(() => go((i + 1) % slides.length), 6000));
  }
  const hb = $$(".hero-b .ph img");
  if (hb.length){
    let i = 0;
    const go = n => { i = n; hb.forEach((el, k) => el.classList.toggle("on", k === i)); $$(".hero-b .mini img").forEach((el, k) => el.classList.toggle("on", k === i)); $$(".hero-b .pager button").forEach((b, k) => b.classList.toggle("on", k === i)); const p = by[HB[i]]; $("#hb-mini").href = "#item-" + p.id; $("#hb-n").textContent = p.n; $("#hb-p").innerHTML = yen(p.p) + ' <small style="font:400 10.5px var(--jp)">(税込)</small>'; };
    $$(".hero-b .pager button").forEach(b => b.addEventListener("click", () => go(+b.dataset.hb)));
    if (!still) timers.push(setInterval(() => go((i + 1) % hb.length), 4200));
  }
  const hc = $("#hero-c");
  if (hc && !still) hc.addEventListener("pointermove", e => { const r = hc.getBoundingClientRect(); hc.style.setProperty("--mx", ((e.clientX - r.left) / r.width * 100) + "%"); hc.style.setProperty("--my", ((e.clientY - r.top) / r.height * 100) + "%"); });
}
function headerState(){
  const h = $("#head"), r = document.documentElement.dataset.route;
  h.classList.toggle("over", skin() === "c" && r === "home" && scrollY < 40);
}

/* ---------- router ---------- */
function route(){
  const r = (location.hash || "#home").slice(1);
  const root = document.documentElement;
  let scope = "";
  if (r.indexOf("item-") === 0){ const p = by[r.slice(5)]; if (p && p.k.indexOf("black") > -1) scope = "black"; }
  if (r === "black") scope = "black";
  root.dataset.scope = scope;
  root.dataset.skin = scope === "black" ? "c" : S.dir;
  root.dataset.route = (r === "" || r === "home" || !/^(collection|new-arrival|wa|zirconia|pearl|hoop|amity|charms|black|item-|lifestyle-|guide|legal|about|shoplist)/.test(r)) ? "home" : r.split("-")[0];
  let html;
  if (r === "collection") html = vCollection("all");
  else if (r === "new-arrival") html = vCollection("new");
  else if (["wa","zirconia","pearl","hoop","amity","charms"].indexOf(r) > -1) html = vCollection(r);
  else if (r === "black") html = vBlack();
  else if (r.indexOf("item-") === 0) html = vProduct(r.slice(5));
  else if (r.indexOf("lifestyle-") === 0) html = vStory(r.slice(10));
  else if (r === "guide") html = vGuide();
  else if (r === "legal") html = vLegal();
  else if (r === "about" || r === "shoplist") html = vAbout();
  else html = vHome();
  if (r.indexOf("item-") !== 0) cur = null;
  $("#main").innerHTML = html;
  if ($("#cgrid")) fillCollection();
  renderChrome(r);
  bindView();
  if (r === "shoplist"){ const s = $("#shoplist"); if (s) s.scrollIntoView(); } else window.scrollTo(0, 0);
  headerState(); reveal(); startMotion();
}

function bindView(){
  const bb = $("#buybar"), pill = $("#pill");
  pill.classList.remove("hide");
  if (cur && $("#add")){
    const p = cur;
    const price = () => opt === "half" ? p.h : p.p;
    const upd = () => { $("#pp").innerHTML = yen(price()) + '<small>(税込)</small>'; const pt = $("#ppts"); if (pt) pt.textContent = Math.floor(price() * .01) + L("ポイント還元（1ポイント＝1円）"," points (1 point = ¥1)"); bb.innerHTML = '<span><span class="nm">' + esc(p.n) + '</span><span class="price">' + yen(price()) + '<small>(税込)</small></span></span><button type="button" class="btn" id="add2">' + L("カートに入れる","Add to cart") + '</button>'; };
    upd();
    $$(".opt").forEach(b => b.addEventListener("click", () => { opt = b.dataset.o; $$(".opt").forEach(x => x.setAttribute("aria-pressed", x === b)); upd(); }));
    $$("[data-q]").forEach(b => b.addEventListener("click", () => { qty = Math.max(1, Math.min(9, qty + +b.dataset.q)); $("#qv").textContent = qty; }));
    const g = $("#gift-pdp"); if (g) g.addEventListener("change", () => { S.gift = g.checked; renderCart(); });
    const add = () => addToCart(p.id, opt === "half", qty);
    $("#add").addEventListener("click", add);
    bb.onclick = e => { if (e.target.closest("#add2")) add(); };
    $("#fav").addEventListener("click", () => toast(L("お気に入りに追加しました（会員登録で保存）","Added to wishlist")));
    const rv = $("#rv-btn"); if (rv) rv.addEventListener("click", () => toast(L("レビュー機能は移行時に導入する提案です","Reviews are a proposed feature")));
    const gal = $("#gal");
    gal.addEventListener("scroll", () => { const i = Math.round(gal.scrollLeft / gal.clientWidth); $$("#gdots i").forEach((d, k) => d.classList.toggle("on", k === i)); }, {passive:true});
    $$("#gal figure").forEach(f => {
      const lens = $(".lens", f); lens.style.backgroundImage = "url(" + $("img", f).getAttribute("src") + ")";
      f.addEventListener("mousemove", e => { const r = f.getBoundingClientRect(); lens.style.backgroundPosition = ((e.clientX - r.left) / r.width * 100) + "% " + ((e.clientY - r.top) / r.height * 100) + "%"; });
      f.addEventListener("click", () => openLightbox(+f.dataset.zoom));
    });
    $$("[data-th]").forEach(b => b.addEventListener("click", () => { const f = $$("#gal figure")[+b.dataset.th]; f.scrollIntoView({behavior:"smooth", block:"center"}); $$("[data-th]").forEach(x => x.classList.toggle("on", x === b)); }));
    const watch = new IntersectionObserver(es => es.forEach(e => { const on = !e.isIntersecting && e.boundingClientRect.top < 0; bb.classList.toggle("on", on); bb.setAttribute("aria-hidden", !on); pill.classList.toggle("hide", on); }));
    watch.observe($("#add"));
    bb.hidden = false;
  } else { bb.classList.remove("on"); bb.hidden = true; }
  $$(".chip").forEach(c => c.addEventListener("click", () => { filt = c.dataset.f; fillCollection(); }));
  const so = $("#sort"); if (so) so.addEventListener("change", () => { sort = so.value; fillCollection(); });
  const nl = $("#nl"); if (nl) nl.addEventListener("submit", e => { e.preventDefault(); toast(L("プロトタイプのため送信されません","The prototype sends nothing")); });
}

/* ---------- global ---------- */
function applyDir(){ $$(".pbar [data-dir]").forEach(b => b.setAttribute("aria-pressed", b.dataset.dir === S.dir)); }
function applyLang(){ document.documentElement.lang = S.lang; $$(".pbar [data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === S.lang)); }
$$(".pbar [data-dir]").forEach(b => b.addEventListener("click", () => { S.dir = b.dataset.dir; save(); applyDir(); route(); toast({a:"A 静 Calm", b:"B 躍 Brand", c:"C 艶 Black"}[S.dir]); }));
$$(".pbar [data-lang]").forEach(b => b.addEventListener("click", () => { S.lang = b.dataset.lang; save(); applyLang(); route(); }));
$(".pbar [data-fx]").addEventListener("click", e => { S.fx = !S.fx; document.documentElement.dataset.fx = S.fx ? "on" : "off"; e.currentTarget.setAttribute("aria-pressed", S.fx); reveal(); startMotion(); toast(S.fx ? L("エフェクト オン","Effects on") : L("エフェクト オフ","Effects off")); });
$("#about-btn").addEventListener("click", () => openPanel("about"));
["#cart-btn","#pill-cart"].forEach(s => $(s).addEventListener("click", () => openPanel("cart")));
["#menu-btn","#pill-menu"].forEach(s => $(s).addEventListener("click", () => openPanel("menu")));
["#search-btn","#pill-search"].forEach(s => $(s).addEventListener("click", () => toast(L("検索（キーワード：GRACE、EMBRACE、Honesty、Charisma、Gold）","Search"))));
$("#pill-fav").addEventListener("click", () => toast(L("お気に入り（会員登録で保存）","Wishlist")));
$("#acct-btn").addEventListener("click", () => toast(L("ログイン・新規会員登録（現行の会員とポイントは移行します）","Log in or register. Members and points move over.")));
$("#scrim").addEventListener("click", closePanels);
document.addEventListener("keydown", e => { if (e.key === "Escape") closePanels(); });
document.addEventListener("click", e => {
  if (e.target.closest("[data-close]")) { closePanels(); return; }
  const a = e.target.closest("a[href^='#']"); if (a && a.closest(".drawer")) closePanels();
  const rm = e.target.closest("[data-rm]"); if (rm){ S.cart.splice(+rm.dataset.rm, 1); save(); renderCart(); return; }
  const cq = e.target.closest("[data-cq]"); if (cq){ const l = S.cart[+cq.dataset.cq]; l.q = Math.max(1, Math.min(9, l.q + +cq.dataset.d)); save(); renderCart(); return; }
  if (e.target.closest("#checkout")) toast(L("プロトタイプのため、ここで決済画面には進みません","Checkout does not run in the prototype"));
});
document.addEventListener("change", e => { if (e.target.id === "gift-cart"){ S.gift = e.target.checked; renderCart(); const g = $("#gift-pdp"); if (g) g.checked = S.gift; } });
addEventListener("scroll", headerState, {passive:true});
addEventListener("hashchange", route);
applyDir(); applyLang(); document.documentElement.dataset.fx = "on";
route();
})();
</script>
