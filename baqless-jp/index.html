<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="../favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<title>baqless.jp Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex">
<meta name="description" content="Clickable prototype of the new baqless.jp on Shopify, Japanese first, with three colour directions and the five effects.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@400;500;600&family=Noto+Serif+JP:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: mobile-first Japanese shop. A thin prototype bar on top switches direction A/B/C, language and effects; below it the shop itself, one column on phones, editorial split on desktop. */
:root{
  /* Baqless brand, token names as in baqless-prototype/src/styles.css */
  --navy:#0B1D3F; --coral:#FF7A6A; --rose:#F5DADF; --gold:#D9C1A0; --ground:#FAF7F2; --paper:#FFFFFF;
  --charcoal:#222222; --ink:#5A554E; --ink-soft:#6B655C; --black:#0A0A0A; --tin:#4B4F54; --line-ground:#E8E3DA;

  /* Direction A, the default: white and Navy like today */
  --bg:#FFFFFF; --bg-alt:#FAF7F2; --surface:#FFFFFF; --fg:#222222; --text:#5A554E; --soft:#6B655C; --line:#E8E3DA;
  --head:#FFFFFF; --head-fg:#0B1D3F; --head-line:#E8E3DA; --wm:#0A0A0A; --under:#0B1D3F;
  --ann:#0B1D3F; --ann-fg:#FFFFFF;
  --btn:#0B1D3F; --btn-fg:#FFFFFF; --btn-line:#0B1D3F; --fill:#FAF7F2; --fill-fg:#0B1D3F;
  --btn2-fg:#0B1D3F; --btn2-line:#0B1D3F; --fill2:#0B1D3F; --fill2-fg:#FFFFFF;
  --tag:#FF7A6A; --tag-fg:#0B1D3F; --price:#222222; --tile:#FFFFFF; --tile-r:0px; --tile-shadow:none; --tile-shadow-h:none; --tile-pad:14px 2px 6px;
  --hero-panel:#FAF7F2; --hero-fg:#0B1D3F; --hero-text:#5A554E;
  --foot:#0B1D3F; --foot-fg:#FFFFFF; --foot-soft:#C9CFDB; --foot-line:#22365E; --foot-accent:#D9C1A0;
  --chip:#FFFFFF; --chip-on:#0B1D3F; --chip-on-fg:#FFFFFF;
  --focus:#0B1D3F; --frame:transparent;

  /* Type */
  --jp:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  --jp-serif:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  --display:"Cormorant Garamond","Cormorant",Georgia,"Times New Roman",serif;
  --lat:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;

  /* Space and motion */
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
  --bar:44px; --ease:cubic-bezier(.22,.61,.36,1);
  --t-img:.4s; --t-zoom:.9s; --t-btn:.25s; --t-line:.3s; --t-in:.6s;
  color-scheme:light;
}
/* Direction B: the brand applied in full */
html[data-dir="b"]{
  --bg:#FAF7F2; --bg-alt:#FFFFFF; --surface:#FFFFFF; --line:#E3DDD2;
  --head:#0B1D3F; --head-fg:#FFFFFF; --head-line:#0B1D3F; --wm:#FFFFFF; --under:#FF7A6A;
  --ann:#F5DADF; --ann-fg:#0B1D3F;
  --btn:#FF7A6A; --btn-fg:#0B1D3F; --btn-line:#FF7A6A; --fill:#0B1D3F; --fill-fg:#FFFFFF;
  --tag:#FFFFFF; --tag-fg:#0B1D3F; --tile-r:8px; --tile-shadow:4px 4px 0 #0B1D3F; --tile-shadow-h:7px 7px 0 #0B1D3F; --tile-pad:14px 14px 16px;
  --hero-panel:#0B1D3F; --hero-fg:#FFFFFF; --hero-text:#D3D8E2;
  --chip-on:#0B1D3F;
}
/* Direction C, and the BLACK collection in every direction */
html[data-dir="c"], html[data-scope="black"]{
  --bg:#0A0A0A; --bg-alt:#141414; --surface:#141414; --fg:#FAF7F2; --text:#CFC9BF; --soft:#A39C91; --line:#33363A;
  --head:#0A0A0A; --head-fg:#FAF7F2; --head-line:#33363A; --wm:#FFFFFF; --under:#D9C1A0;
  --ann:#141414; --ann-fg:#D9C1A0;
  --btn:transparent; --btn-fg:#D9C1A0; --btn-line:#D9C1A0; --fill:#D9C1A0; --fill-fg:#0A0A0A;
  --btn2-fg:#FAF7F2; --btn2-line:#4B4F54; --fill2:#FAF7F2; --fill2-fg:#0A0A0A;
  --tag:#0A0A0A; --tag-fg:#D9C1A0; --price:#D9C1A0; --tile:#0A0A0A; --tile-r:0px; --tile-shadow:none; --tile-shadow-h:none; --tile-pad:14px 2px 6px;
  --hero-panel:#0A0A0A; --hero-fg:#FAF7F2; --hero-text:#CFC9BF;
  --foot:#0A0A0A; --foot-fg:#FAF7F2; --foot-soft:#A39C91; --foot-line:#33363A; --foot-accent:#D9C1A0;
  --chip:#0A0A0A; --chip-on:#D9C1A0; --chip-on-fg:#0A0A0A;
  --focus:#D9C1A0; --frame:#D9C1A0;
  color-scheme:dark;
}
html[data-fx="off"]{--t-img:0s; --t-zoom:0s; --t-btn:0s; --t-line:0s; --t-in:0s}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.9 var(--jp);letter-spacing:.04em;-webkit-font-smoothing:antialiased;padding-top:calc(var(--bar) + env(safe-area-inset-top, 0px));overflow-x:hidden;transition:background-color .3s var(--ease),color .3s var(--ease)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:90;background:#121212}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.wrap{max-width:1320px;margin:0 auto;padding-left:var(--gl);padding-right:var(--gr)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.lat{font-family:var(--lat);letter-spacing:.14em}
.num{font-family:var(--lat);font-variant-numeric:tabular-nums;letter-spacing:.02em}
/* Japanese setting: phrase-aware breaks, strict kinsoku, proportional kana in headings */
.jh{font-family:var(--jp-serif);font-weight:400;color:var(--fg);line-height:1.6;letter-spacing:.08em;font-feature-settings:"palt";line-break:strict;word-break:auto-phrase;text-wrap:balance;margin:0}
p{margin:0;line-break:strict;word-break:auto-phrase;text-wrap:pretty}
.eyebrow{font:500 11px/1.4 var(--lat);letter-spacing:.24em;text-transform:uppercase;color:var(--soft)}

/* ---------- prototype bar (outside the shop, fixed look) ---------- */
.pbar{position:fixed;inset:0 0 auto;top:env(safe-area-inset-top, 0px);z-index:80;height:var(--bar);background:#121212;color:#EDE9E2;font:500 12px/1 var(--lat);letter-spacing:.06em;border-bottom:1px solid #2A2A2A}
.pbar .wrap{height:100%;display:flex;align-items:center;gap:10px}
.pbar .pname{display:flex;align-items:center;gap:8px;white-space:nowrap;color:#BDB7AD}
.pbar .pname b{color:#FFFFFF;font-weight:600;letter-spacing:.16em}
.pbar .dot{width:6px;height:6px;border-radius:50%;background:#FF7A6A}
.seg{display:inline-flex;border:1px solid #3A3A3A;border-radius:4px;overflow:hidden}
.seg button{background:transparent;border:0;color:#BDB7AD;padding:0 11px;height:30px;cursor:pointer;font:500 12px/1 var(--lat);letter-spacing:.06em;white-space:nowrap}
.seg button+button{border-left:1px solid #3A3A3A}
.seg button[aria-pressed="true"]{background:#EDE9E2;color:#121212}
.seg button:hover{color:#FFFFFF}
.seg button[aria-pressed="true"]:hover{color:#121212}
.pbar .grow{flex:1}
.pbar .ibtn{background:transparent;border:1px solid #3A3A3A;border-radius:4px;height:30px;padding:0 10px;cursor:pointer;color:#EDE9E2}
.pbar .long{display:none}
@media (min-width:900px){.pbar .long{display:inline}}
@media (max-width:520px){.pbar .pname span{display:none}.seg button{padding:0 9px}.pbar .wrap{gap:6px}}

/* ---------- announcement + header ---------- */
.ann{background:var(--ann);color:var(--ann-fg);font:500 12px/1.5 var(--jp);letter-spacing:.08em;text-align:center}
.ann .wrap{padding-block:9px;display:flex;justify-content:center;gap:28px}
.ann .two{display:none}
@media (min-width:900px){.ann .two{display:inline}}
.head{position:sticky;top:calc(var(--bar) + env(safe-area-inset-top, 0px));z-index:60;background:var(--head);color:var(--head-fg);border-bottom:1px solid var(--head-line);transition:background-color .3s var(--ease)}
.head .wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:60px;gap:16px}
.head .wm{width:112px;height:auto;color:var(--wm);display:block}
.head .logo{justify-self:center;display:block;padding:6px 0}
.head .left,.head .right{display:flex;align-items:center;gap:6px}
.head .right{justify-self:end}
.icon{width:40px;height:40px;display:inline-grid;place-items:center;background:transparent;border:0;cursor:pointer;color:inherit;position:relative;text-decoration:none}
.icon svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.4}
.count{position:absolute;right:2px;top:3px;min-width:17px;height:17px;border-radius:9px;background:var(--under);color:var(--head);font:600 10px/17px var(--lat);text-align:center;padding:0 4px;letter-spacing:0}
.nav{display:none}
.nav a,.ul{position:relative;text-decoration:none;padding-block:8px}
.nav a::after,.ul::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:1px;background:var(--under);transform:scaleX(0);transform-origin:left;transition:transform var(--t-line) var(--ease)}
.nav a:hover::after,.nav a:focus-visible::after,.nav a[aria-current="page"]::after,.ul:hover::after,.ul:focus-visible::after{transform:scaleX(1)}
@media (min-width:1080px){
  .head .wrap{grid-template-columns:auto 1fr auto;height:72px}
  .head .logo{justify-self:start;order:-1}
  .head .left{display:none}
  .nav{display:flex;justify-content:center;gap:26px;font:500 11.5px/1 var(--lat);letter-spacing:.16em}
}

/* ---------- buttons: colour sweeps in from the left (effect 3) ---------- */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;overflow:hidden;isolation:isolate;min-height:52px;padding:0 28px;border-radius:4px;border:1px solid var(--btn-line);background:var(--btn);color:var(--btn-fg);font:700 14px/1.3 var(--jp);letter-spacing:.12em;text-decoration:none;cursor:pointer;transition:color var(--t-btn) var(--ease)}
.btn::before{content:"";position:absolute;inset:0;background:var(--fill);transform:scaleX(0);transform-origin:left;transition:transform var(--t-btn) var(--ease);z-index:-1}
.btn:hover,.btn:focus-visible{color:var(--fill-fg)}
.btn:hover::before,.btn:focus-visible::before{transform:scaleX(1)}
.btn.ghost{background:transparent;color:var(--btn2-fg);border-color:var(--btn2-line)}
.btn.ghost::before{background:var(--fill2)}
.btn.ghost:hover,.btn.ghost:focus-visible{color:var(--fill2-fg)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* Proposed features carry this mark, so nothing new passes as today's shop */
.prop{display:inline-flex;align-items:center;gap:6px;font:600 10px/1 var(--lat);letter-spacing:.14em;text-transform:uppercase;color:var(--soft);border:1px dashed currentColor;border-radius:3px;padding:4px 6px;vertical-align:middle;white-space:nowrap}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr);background:var(--hero-panel)}
.hero .ph{overflow:hidden;aspect-ratio:4/5;max-height:72vh}
.hero .ph img{width:100%;height:100%;object-fit:cover;transition:transform var(--t-zoom) var(--ease)}
.hero:hover .ph img{transform:scale(1.03)}
.hero .copy{padding:36px var(--gr) 44px var(--gl);display:grid;gap:18px;align-content:center;color:var(--hero-text)}
.hero .eyebrow{color:var(--hero-text)}
.hero h1{font-size:clamp(26px,6.6vw,40px);color:var(--hero-fg)}
.hero .sub{font-size:15px;color:var(--hero-text)}
.hero .ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px}
html[data-dir="b"] .hero .btn.ghost{--btn2-fg:#FFFFFF;--btn2-line:#5A6A88;--fill2:#FFFFFF;--fill2-fg:#0B1D3F}
@media (min-width:900px){
  .hero{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
  .hero .ph{aspect-ratio:16/10;max-height:none}
  .hero .copy{padding:56px max(48px,var(--gr)) 56px 56px}
  .hero.flip .ph{order:2}
  .hero.flip .copy{padding:56px 56px 56px max(48px,var(--gl))}
}

/* ---------- sections ---------- */
.sec{padding-block:56px}
.sec.alt{background:var(--bg-alt)}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.sec-h .ttl{display:grid;gap:6px}
.sec-h h2{font:300 clamp(30px,5vw,44px)/1 var(--display);color:var(--fg);letter-spacing:.04em;margin:0}
.sec-h .ja{font-size:13px;color:var(--soft)}
.more{font:500 13px/1 var(--jp);letter-spacing:.08em;color:var(--fg)}
@media (min-width:900px){.sec{padding-block:88px}}

/* collection circles, swipe on phones */
.circles{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:none}
.circles::-webkit-scrollbar{display:none}
.circles a{flex:0 0 auto;width:88px;display:grid;gap:10px;justify-items:center;text-decoration:none;scroll-snap-align:start;color:var(--fg)}
.circles .c{width:88px;height:88px;border-radius:50%;overflow:hidden;background:#FFFFFF;border:1px solid var(--line)}
.circles .c img{width:100%;height:100%;object-fit:cover;transform:scale(1.15);transition:transform var(--t-zoom) var(--ease)}
.circles a:hover .c img{transform:scale(1.25)}
.circles span{font:500 10.5px/1.3 var(--lat);letter-spacing:.12em;text-align:center}
@media (min-width:900px){.circles{justify-content:space-between;overflow:visible}.circles a{width:112px}.circles .c{width:112px;height:112px}}

/* ---------- product tiles: image change (1) and zoom (2) ---------- */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 12px}
@media (min-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:40px 24px}}
.tile{display:block;text-decoration:none;color:inherit;background:var(--tile);border-radius:var(--tile-r);box-shadow:var(--tile-shadow);transition:box-shadow var(--t-line) var(--ease),transform var(--t-line) var(--ease);min-width:0}
.tile .ph{position:relative;aspect-ratio:4/5;overflow:hidden;background:#FFFFFF;border-radius:var(--tile-r) var(--tile-r) 0 0}
.tile .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity var(--t-img) var(--ease),transform var(--t-zoom) var(--ease)}
.tile .ph .i2{opacity:0}
.tile .ph::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px var(--frame);opacity:0;transition:opacity var(--t-img) var(--ease);pointer-events:none}
@media (hover:hover){
  .tile:hover .i2,.tile:focus-visible .i2{opacity:1}
  .tile:hover .ph img,.tile:focus-visible .ph img{transform:scale(1.05)}
  .tile:hover .ph::after{opacity:1}
  .tile:hover{box-shadow:var(--tile-shadow-h);transform:translate(calc(var(--tile-r) * -.375),calc(var(--tile-r) * -.375))}
}
.tile .cap{display:grid;gap:4px;padding:var(--tile-pad)}
.tile .nm{font:400 18px/1.25 var(--display);color:var(--fg);letter-spacing:.01em}
.tile .pr{font:500 13px/1.4 var(--lat);color:var(--price);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.tile .pr small,.price small{font:400 11px/1 var(--jp);letter-spacing:.04em;color:var(--soft);margin-left:3px}
.tag{position:absolute;left:8px;top:8px;z-index:2;font:600 9.5px/1 var(--lat);letter-spacing:.18em;padding:6px 7px;border-radius:3px;background:var(--tag);color:var(--tag-fg)}
html[data-dir="b"] .tag{box-shadow:inset 0 0 0 1px #0B1D3F}
html[data-dir="c"] .tag,html[data-scope="black"] .tag{left:0;top:0;padding:9px 10px;border-radius:0}
@media (min-width:900px){.tile .nm{font-size:20px}}
/* ranking numbers, as on today's baqless.jp */
.rank .tag{display:none}
.rk{position:absolute;left:0;top:0;z-index:2;width:34px;height:34px;display:grid;place-items:center;background:var(--fg);color:var(--bg);font-size:14px;font-weight:600}

/* ---------- reveal on scroll (5): only what starts below the fold waits ---------- */
[data-reveal]{transition:opacity var(--t-in) var(--ease),transform var(--t-in) var(--ease);transition-delay:calc(var(--d,0) * 80ms)}
[data-reveal].wait{opacity:0;transform:translateY(24px)}

/* ---------- bands ---------- */
.band{position:relative;display:grid;grid-template-columns:minmax(0,1fr);background:#0A0A0A;color:#FAF7F2}
.band .ph{aspect-ratio:16/10;overflow:hidden}
.band .ph img{width:100%;height:100%;object-fit:cover;transition:transform var(--t-zoom) var(--ease)}
.band:hover .ph img{transform:scale(1.03)}
.band .copy{padding:36px var(--gr) 44px var(--gl);display:grid;gap:16px;align-content:center}
.band h2{font:300 clamp(36px,6vw,64px)/1 var(--display);letter-spacing:.06em;margin:0;color:#FAF7F2}
.band p{color:#CFC9BF;max-width:30em}
.band .eyebrow{color:#D9C1A0}
.band .btn{--btn:transparent;--btn-fg:#D9C1A0;--btn-line:#D9C1A0;--fill:#D9C1A0;--fill-fg:#0A0A0A;justify-self:start}
.band.wa{background:#2E2B24}
.band.wa .eyebrow{color:#D9C1A0}
@media (min-width:900px){.band{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}.band .copy{padding:56px max(48px,var(--gr)) 56px 56px}.band.flip .ph{order:2}.band.flip .copy{padding:56px 56px 56px max(48px,var(--gl))}}

.wa-list{display:grid;gap:14px;margin-top:6px}
.wa-list a{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;align-items:center;text-decoration:none;color:#FAF7F2}
.wa-list img{width:64px;height:80px;object-fit:cover;background:#FFFFFF}
.wa-list b{display:block;font:400 19px/1.2 var(--display);letter-spacing:.04em}
.wa-list span{font-size:12.5px;color:#CFC9BF;line-height:1.7}

/* how to wear, features */
.steps{display:grid;grid-template-columns:minmax(0,1fr);gap:28px;counter-reset:s}
.step{display:grid;grid-template-columns:56px minmax(0,1fr);gap:16px;align-items:start}
.step .n{font:300 46px/.9 var(--display);color:var(--fg)}
.step h3{font:700 15px/1.6 var(--jp);color:var(--fg);margin:0;padding-top:12px;letter-spacing:.08em}
.step p{font-size:14px}
.feats{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;border-top:1px solid var(--line);padding-top:28px;margin-top:40px}
.feat h3{font:400 19px/1.5 var(--jp-serif);color:var(--fg);margin:0 0 6px;letter-spacing:.06em;font-feature-settings:"palt"}
.feat p{font-size:14px}
.feat .note{font-size:12px;color:var(--soft);margin-top:6px}
@media (min-width:900px){.steps{grid-template-columns:repeat(3,minmax(0,1fr));gap:40px}.feats{grid-template-columns:repeat(3,minmax(0,1fr));gap:40px}}

/* stories */
.stories{display:grid;grid-auto-flow:column;grid-auto-columns:78%;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:4px}
.stories::-webkit-scrollbar{display:none}
.story-card{scroll-snap-align:start;text-decoration:none;color:inherit;display:grid;gap:12px;min-width:0;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.story-card .ph{aspect-ratio:3/2;overflow:hidden;background:var(--bg-alt)}
.story-card .ph img{width:100%;height:100%;object-fit:cover;transition:transform var(--t-zoom) var(--ease)}
.story-card:hover .ph img{transform:scale(1.05)}
.story-card .dt{font:500 11px/1 var(--lat);letter-spacing:.16em;color:var(--soft)}
.story-card .tt{font:400 15px/1.75 var(--jp-serif);color:var(--fg);letter-spacing:.04em;font-feature-settings:"palt";line-break:strict;word-break:auto-phrase}
@media (min-width:900px){.stories{grid-auto-flow:row;grid-template-columns:repeat(4,minmax(0,1fr));overflow:visible}}

/* gift + LINE */
.duo{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:24px;display:grid;grid-template-columns:96px minmax(0,1fr);gap:18px;align-items:center}
.card img{width:96px;height:120px;object-fit:cover;background:#FFFFFF}
.card h3{font:400 19px/1.5 var(--jp-serif);color:var(--fg);margin:0 0 6px;letter-spacing:.06em}
.card p{font-size:13.5px}
.card .act{margin-top:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.line-badge{display:inline-grid;place-items:center;width:96px;height:96px;border-radius:22px;background:#06C755;color:#FFFFFF;font:700 22px/1 var(--lat);letter-spacing:.02em}
.btn.line{--btn:#06C755;--btn-line:#06C755;--btn-fg:#FFFFFF;--fill:#04A246;--fill-fg:#FFFFFF;min-height:44px;padding:0 18px;font-size:13px}
.btn.sm{min-height:44px;padding:0 18px;font-size:13px}
@media (min-width:900px){.duo{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}}

/* ---------- footer ---------- */
.foot{background:var(--foot);color:var(--foot-soft);font-size:13px;margin-top:0}
.foot .wrap{padding-block:56px 28px;display:grid;gap:36px}
.foot .wm{width:120px;color:#FFFFFF}
.foot h4{font:600 11px/1 var(--lat);letter-spacing:.2em;color:var(--foot-accent);margin:0 0 14px;text-transform:uppercase}
.foot ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.foot a{color:var(--foot-fg);text-decoration:none}
.foot a:hover{text-decoration:underline;text-underline-offset:4px}
.foot .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px 20px}
.foot .addr{line-height:1.9}
.foot .base{border-top:1px solid var(--foot-line);padding-top:20px;display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;font:400 11.5px/1.6 var(--lat);letter-spacing:.06em}
@media (min-width:900px){.foot .wrap{grid-template-columns:minmax(0,1fr) minmax(0,2.4fr)}.foot .cols{grid-template-columns:repeat(4,minmax(0,1fr))}.foot .base{grid-column:1/-1}}

.pays{display:flex;flex-wrap:wrap;gap:6px}
.pay{font:500 11px/1 var(--jp);letter-spacing:.04em;border:1px solid var(--line);border-radius:3px;padding:7px 8px;color:var(--fg);background:var(--surface);white-space:nowrap}
.pay.new{border-style:dashed}
.foot .pay{background:transparent;border-color:var(--foot-line);color:var(--foot-fg)}

/* ---------- collection page ---------- */
.crumb{font:400 12px/1.6 var(--jp);color:var(--soft);padding-block:16px 0;display:flex;flex-wrap:wrap;gap:8px}
.crumb a{text-decoration:none}
.crumb a:hover{text-decoration:underline}
.ptitle{padding-block:20px 8px;display:grid;gap:8px}
.ptitle h1{font:300 clamp(40px,8vw,72px)/1 var(--display);color:var(--fg);letter-spacing:.04em;margin:0}
.ptitle p{max-width:40em}
.tools{position:sticky;top:calc(var(--bar) + 60px + env(safe-area-inset-top, 0px));z-index:30;background:var(--bg);border-bottom:1px solid var(--line);margin-bottom:24px}
.tools .wrap{display:flex;gap:12px;align-items:center;padding-block:10px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font:500 11px/1 var(--lat);letter-spacing:.12em;border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:999px;padding:10px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-fg);border-color:var(--chip-on)}
.sel{font:500 12px/1 var(--jp);border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:4px;height:38px;padding:0 10px;letter-spacing:.04em}
.cnt{font:500 12px/1 var(--jp);color:var(--soft);white-space:nowrap}
@media (min-width:1080px){.tools{top:calc(var(--bar) + 72px + env(safe-area-inset-top, 0px))}}

/* ---------- product page ---------- */
.pdp{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;padding-bottom:40px}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-inline:calc(var(--gl) * -1) calc(var(--gr) * -1)}
.gal::-webkit-scrollbar{display:none}
.gal figure{flex:0 0 100%;margin:0;scroll-snap-align:start;aspect-ratio:4/5;overflow:hidden;background:#FFFFFF;position:relative}
.gal img{width:100%;height:100%;object-fit:cover;transition:transform var(--t-zoom) var(--ease)}
.gal-n{font:500 11px/1 var(--lat);letter-spacing:.14em;color:var(--soft);text-align:center;margin-top:10px}
.info{display:grid;gap:18px;align-content:start;min-width:0}
.info h1{font:400 clamp(30px,6vw,40px)/1.1 var(--display);color:var(--fg);letter-spacing:.02em;margin:0}
.info .code{font:400 11.5px/1 var(--lat);color:var(--soft);letter-spacing:.08em}
.price{font:500 22px/1 var(--lat);color:var(--price);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.pts{font-size:12px;color:var(--soft)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:12px;text-align:left;cursor:pointer;display:grid;gap:4px;color:var(--fg)}
.opt b{font:500 13px/1.4 var(--jp)}
.opt span{font:500 12.5px/1 var(--lat);color:var(--soft);font-variant-numeric:tabular-nums}
.opt[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.lbl{font:700 12px/1.4 var(--jp);color:var(--fg);letter-spacing:.08em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
.qty button{width:44px;height:44px;background:transparent;border:0;cursor:pointer;color:var(--fg);font:500 18px/1 var(--lat)}
.qty output{min-width:32px;text-align:center;font:500 14px/1 var(--lat);color:var(--fg)}
.check{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start;font-size:13.5px;color:var(--fg);cursor:pointer;border:1px solid var(--line);border-radius:4px;padding:12px;background:var(--surface)}
.check input{width:18px;height:18px;margin:3px 0 0;accent-color:var(--navy)}
html[data-dir="c"] .check input,html[data-scope="black"] .check input{accent-color:#D9C1A0}
.check small{display:block;color:var(--soft);font-size:12px}
.dd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.dd select{width:100%}
.rows{display:grid;border-top:1px solid var(--line)}
.rows div{display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}
.rows dt,.rows b{font-weight:700;color:var(--fg)}
details.acc{border-bottom:1px solid var(--line)}
details.acc:first-of-type{border-top:1px solid var(--line)}
details.acc summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:16px 0;font:500 12px/1 var(--lat);letter-spacing:.2em;color:var(--fg)}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"+";font:300 20px/1 var(--lat)}
details.acc[open] summary::after{content:"−"}
details.acc .body{padding:0 0 18px;font-size:14px;display:grid;gap:10px}
details.acc ul{margin:0;padding-left:1.1em;display:grid;gap:4px}
.buybar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--bg);border-top:1px solid var(--line);padding:10px var(--gr) calc(10px + env(safe-area-inset-bottom, 0px)) var(--gl);display:flex;align-items:center;gap:12px;transform:translateY(110%);transition:transform .3s var(--ease)}
.buybar.on{transform:none}
.buybar .price{font-size:17px}
.buybar .btn{flex:1;min-height:48px}
@media (min-width:900px){
  .pdp{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:56px;padding-bottom:72px}
  .gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;overflow:visible;margin:0}
  .gal figure:first-child{grid-column:1/-1}
  .gal figure:hover img{transform:scale(1.04)}
  .gal-n{display:none}
  .info{position:sticky;top:calc(var(--bar) + 96px);gap:20px}
  .buybar{display:none}
}

/* reviews (proposed) */
.rev{display:grid;gap:14px;border:1px solid var(--line);border-radius:6px;padding:24px;background:var(--surface)}
.stars{display:flex;gap:3px;color:var(--soft)}
.stars svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.3}
.rev .act{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* ---------- story ---------- */
.art{max-width:760px;margin:0 auto;padding-left:var(--gl);padding-right:var(--gr)}
.art h1{font-size:clamp(22px,4.6vw,32px);line-height:1.7;margin:12px 0 18px}
.art .meta{font:500 11px/1 var(--lat);letter-spacing:.16em;color:var(--soft)}
.art p{font-size:15.5px;line-height:2.05;margin:0 0 1.2em}
.art h2{font:400 clamp(19px,3.6vw,23px)/1.7 var(--jp-serif);color:var(--fg);letter-spacing:.06em;margin:2.2em 0 1em;font-feature-settings:"palt"}
.art blockquote{margin:1.6em 0;padding:0 0 0 18px;border-left:1px solid var(--under);font-family:var(--jp-serif);color:var(--fg)}
.art figure{margin:2em calc(var(--gl) * -1)}
.art figure img{width:100%;height:auto}
.art .prof{border-top:1px solid var(--line);padding-top:20px;margin-top:2.4em;font-size:13.5px}
.story-hero{aspect-ratio:3/2;overflow:hidden;max-height:78vh}
.story-hero img{width:100%;height:100%;object-fit:cover}
.mark{border:1px dashed var(--line);border-radius:6px;padding:16px 18px;font-size:13px;color:var(--soft);display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
@media (min-width:900px){.art figure{margin:2.4em -80px}}

/* ---------- guide, legal ---------- */
.doc{max-width:860px}
.doc h2{font:400 21px/1.6 var(--jp-serif);color:var(--fg);letter-spacing:.06em;margin:48px 0 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.doc p,.doc li{font-size:14.5px}
.doc ul{padding-left:1.1em;display:grid;gap:6px}
.tbl{overflow-x:auto;border-top:1px solid var(--line)}
.tbl table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
.tbl th,.tbl td{text-align:left;vertical-align:top;padding:14px 12px 14px 0;border-bottom:1px solid var(--line)}
.tbl th{width:13em;font-weight:700;color:var(--fg)}
.note-box{background:var(--bg-alt);border:1px solid var(--line);border-radius:6px;padding:18px 20px;font-size:13.5px;display:grid;gap:8px;margin-top:28px}

/* ---------- drawers, dialog, toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,10,10,.45);z-index:95;opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;right:0;z-index:100;width:min(440px,100%);background:var(--bg);color:var(--text);display:flex;flex-direction:column;transform:translateX(102%);transition:transform .35s var(--ease);padding-top:env(safe-area-inset-top, 0px);padding-bottom:env(safe-area-inset-bottom, 0px);padding-right:env(safe-area-inset-right, 0px)}
.drawer.left{right:auto;left:0;transform:translateX(-102%);padding-right:0;padding-left:env(safe-area-inset-left, 0px)}
.drawer.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);color:var(--fg)}
.dh h2{font:500 12px/1 var(--lat);letter-spacing:.24em;margin:0}
.db{flex:1;overflow-y:auto;padding:20px;display:grid;gap:18px;align-content:start}
.df{border-top:1px solid var(--line);padding:18px 20px;display:grid;gap:12px}
.ship{display:grid;gap:8px;font-size:13px;color:var(--fg)}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--under);transition:width .4s var(--ease)}
.line-item{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:14px;align-items:start}
.line-item img{width:72px;height:90px;object-fit:cover;background:#FFFFFF}
.line-item .nm{font:400 17px/1.25 var(--display);color:var(--fg)}
.line-item .vr{font-size:12px;color:var(--soft)}
.line-item .rm{justify-self:start;background:none;border:0;color:var(--soft);font-size:12px;cursor:pointer;text-decoration:underline;padding:6px 0}
.line-item .qty button{width:34px;height:34px}
.sum{display:grid;gap:6px;font-size:13.5px}
.sum div{display:flex;justify-content:space-between;gap:12px}
.sum .tot{font-weight:700;color:var(--fg);font-size:15px}
.empty{padding:40px 0;text-align:center;display:grid;gap:16px;justify-items:center}
.mnav{display:grid;gap:0}
.mnav a{display:flex;justify-content:space-between;padding:15px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg);font:500 13px/1 var(--lat);letter-spacing:.16em}
.mnav a span{font:400 12px/1 var(--jp);letter-spacing:.06em;color:var(--soft)}
.mnav .sub a{padding-left:16px;font-size:12px}
.dlg{position:fixed;z-index:110;left:50%;top:50%;transform:translate(-50%,-48%);width:min(640px,calc(100% - 32px));max-height:calc(100% - 96px);overflow:auto;background:#FAF7F2;color:#4A453E;border-radius:10px;padding:28px;opacity:0;pointer-events:none;transition:opacity .25s var(--ease),transform .25s var(--ease);font:400 14px/1.8 var(--lat);letter-spacing:.01em}
.dlg.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.dlg h2{font:400 30px/1.1 var(--display);color:#0B1D3F;margin:0 0 12px}
.dlg h3{font:600 11px/1.4 var(--lat);letter-spacing:.2em;text-transform:uppercase;color:#6B655C;margin:22px 0 8px}
.dlg ul{margin:0;padding-left:1.1em;display:grid;gap:4px}
.dlg .x{position:absolute;right:12px;top:12px;color:#0B1D3F}
.dlg a{color:#C93B27}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom, 0px));transform:translate(-50%,20px);z-index:120;background:#121212;color:#EDE9E2;font:400 13px/1.6 var(--jp);padding:12px 18px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .25s var(--ease),transform .25s var(--ease);max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
main{min-height:60vh}
main:focus{outline:none}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-duration:.01ms!important;transition-delay:0s!important;animation:none!important}
  [data-reveal].wait{opacity:1;transform:none}
}
</style>
</head>

/* ---------- reveal (effect 5) ---------- */
let io = null;
function reveal(){
  if (io) io.disconnect();
  const els = $$("[data-reveal]");
  if (!S.fx || !("IntersectionObserver" in window)) { els.forEach(e => e.classList.remove("wait")); return; }
  io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.remove("wait"); io.unobserve(e.target); } }), {rootMargin:"0px 0px -6% 0px"});
  els.forEach(e => { if (e.getBoundingClientRect().top > innerHeight * .95){ e.classList.add("wait"); io.observe(e); } });
}

/* ---------- router ---------- */
function route(){
  const r = (location.hash || "#home").slice(1);
  const root = document.documentElement;
  let html, scope = "";
  if (r.indexOf("item-") === 0){ const p = by[r.slice(5)]; if (p && p.k.indexOf("black") > -1) scope = "black"; }
  if (r === "black") scope = "black";
  root.dataset.scope = scope;
  if (r === "collection") html = vCollection("all");
  else if (r === "new-arrival") html = vCollection("new");
  else if (r === "wa") html = vCollection("wa");
  else if (["zirconia","pearl","hoop","amity","charms"].indexOf(r) > -1) html = vCollection(r);
  else if (r === "black") html = vBlack();
  else if (r.indexOf("item-") === 0) html = vProduct(r.slice(5));
  else if (r.indexOf("lifestyle-") === 0) html = vStory(r.slice(10));
  else if (r === "guide") html = vGuide();
  else if (r === "legal") html = vLegal();
  else if (r === "about" || r === "shoplist") html = vAbout();
  else html = vHome();
  const m = $("#main"); m.innerHTML = html;
  if ($("#cgrid")) fillCollection();
  renderChrome();
  bindView();
  if (r === "shoplist"){ const s = $("#shoplist"); if (s) s.scrollIntoView(); } else window.scrollTo(0, 0);
  reveal();
  document.title = "baqless.jp Prototype";
}

    const p = cur;
    const price = () => opt === "half" ? p.h : p.p;
    const upd = () => { $("#pp").innerHTML = yen(price()) + '<small>(税込)</small>'; const pt = $("#ppts"); if (pt) pt.textContent = Math.floor(price() * .01) + L("ポイント還元（1ポイント＝1円）"," points (1 point = ¥1)"); bb.innerHTML = '<span class="price">' + yen(price()) + '<small>(税込)</small></span><button type="button" class="btn" id="add2">' + L("カートに入れる","Add to cart") + '</button>'; };
    upd();
    $$(".opt").forEach(b => b.addEventListener("click", () => { opt = b.dataset.o; $$(".opt").forEach(x => x.setAttribute("aria-pressed", x === b)); upd(); }));
    $$("[data-q]").forEach(b => b.addEventListener("click", () => { qty = Math.max(1, Math.min(9, qty + +b.dataset.q)); $("#qv").textContent = qty; }));
    const g = $("#gift-pdp"); if (g) g.addEventListener("change", () => { S.gift = g.checked; renderCart(); });
    const add = () => addToCart(p.id, opt === "half", qty);
    $("#add").addEventListener("click", add);
    bb.onclick = e => { if (e.target.closest("#add2")) add(); };
    $("#fav").addEventListener("click", () => toast(L("お気に入りに追加しました（会員登録で保存）","Added to wishlist")));
    const rv = $("#rv-btn"); if (rv) rv.addEventListener("click", () => toast(L("レビュー機能は移行時に導入する提案です","Reviews are a proposed feature")));
    const gal = $("#gal");
    gal.addEventListener("scroll", () => { const i = Math.round(gal.scrollLeft / gal.clientWidth) + 1; $("#gal-n").textContent = i + " / 3"; }, {passive:true});
    const watch = new IntersectionObserver(es => es.forEach(e => { const on = !e.isIntersecting && e.boundingClientRect.top < 0; bb.classList.toggle("on", on); bb.setAttribute("aria-hidden", !on); }));
    watch.observe($("#add"));
    bb.hidden = false;
  } else { bb.classList.remove("on"); bb.hidden = true; cur = null; }
  $$(".chip").forEach(c => c.addEventListener("click", () => { filt = c.dataset.f; fillCollection(); }));
  const so = $("#sort"); if (so) so.addEventListener("change", () => { sort = so.value; fillCollection(); });
}

/* ---------- global events ---------- */
function applyDir(){ document.documentElement.dataset.dir = S.dir; $$("[data-dir]").forEach(b => b.getAttribute("aria-pressed") !== null && b.setAttribute("aria-pressed", b.dataset.dir === S.dir)); }
function applyLang(){ document.documentElement.lang = S.lang; $$("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === S.lang)); }
$$(".pbar [data-dir]").forEach(b => b.addEventListener("click", () => { S.dir = b.dataset.dir; save(); applyDir(); route(); toast({a:"A Familiar", b:"B Brand", c:"C Black"}[S.dir]); }));
$$(".pbar [data-lang]").forEach(b => b.addEventListener("click", () => { S.lang = b.dataset.lang; save(); applyLang(); route(); }));
$(".pbar [data-fx]").addEventListener("click", e => { S.fx = !S.fx; document.documentElement.dataset.fx = S.fx ? "on" : "off"; e.currentTarget.setAttribute("aria-pressed", S.fx); reveal(); toast(S.fx ? L("エフェクト オン","Effects on") : L("エフェクト オフ","Effects off")); });
$("#about-btn").addEventListener("click", () => openPanel("about"));
$("#cart-btn").addEventListener("click", () => openPanel("cart"));
$("#menu-btn").addEventListener("click", () => openPanel("menu"));
$("#acct-btn").addEventListener("click", () => toast(L("ログイン・新規会員登録（現行の会員とポイントは移行します）","Log in or register. Members and points move over.")));
$("#scrim").addEventListener("click", closePanels);
document.addEventListener("keydown", e => { if (e.key === "Escape") closePanels(); });
document.addEventListener("click", e => {
  if (e.target.closest("[data-close]")) { closePanels(); return; }
  const a = e.target.closest("a[href^='#']");
  if (a && a.closest(".drawer")) closePanels();
  const rm = e.target.closest("[data-rm]"); if (rm){ S.cart.splice(+rm.dataset.rm, 1); save(); renderCart(); return; }
  const cq = e.target.closest("[data-cq]"); if (cq){ const l = S.cart[+cq.dataset.cq]; l.q = Math.max(1, Math.min(9, l.q + +cq.dataset.d)); save(); renderCart(); return; }
  if (e.target.closest("#checkout")) toast(L("プロトタイプのため、ここで決済画面には進みません","Checkout does not run in the prototype"));
});
document.addEventListener("change", e => { if (e.target.id === "gift-cart"){ S.gift = e.target.checked; renderCart(); const g = $("#gift-pdp"); if (g) g.checked = S.gift; } });
window.addEventListener("hashchange", route);

applyDir(); applyLang(); document.documentElement.dataset.fx = "on";
route();
})();
</script>

</body>
