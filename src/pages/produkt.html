<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{t:seite.produkt.beschreibung}}">
<link rel="canonical" href="{{CANONICAL}}">
{{HREFLANG}}
<link rel="icon" href="{{BASE}}favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="{{BASE}}icon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="{{BASE}}icon-512.png">
<link rel="apple-touch-icon" href="{{BASE}}apple-touch-icon.png">
<title>{{t:seite.produkt.titel}}</title>
<style>
{{CSS}}

/* ===== PDP ===== */
.pdp{padding:118px var(--pad) 40px; max-width:1180px; margin:0 auto}
.pdp-grid{display:grid; grid-template-columns:1.05fr .95fr; gap:56px; align-items:start}
@media(max-width:920px){.pdp-grid{grid-template-columns:1fr; gap:30px}
  /* Grid-Elemente duerfen nicht breiter werden als ihre Spalte */
  .pdp-grid > *{min-width:0}}

.gal{position:sticky; top:96px}
@media(max-width:920px){.gal{position:static}}
/* Radius nach Handbuch: 12 fuer Bild. Hier standen 26, das war der weichste
   Radius im ganzen Shop und stand neben Karten mit 8 und Knoepfen mit 4. */
.gal-main{position:relative; border-radius:12px; overflow:hidden; background:#fff; isolation:isolate;
  box-shadow:12px 12px 0 var(--coral-tint); aspect-ratio:1/1}
.gal-main img{width:100%; height:100%; object-fit:cover; display:block; transition:opacity .3s}
/* Kein Blend-Modus auf dem Packshot: er faerbte das Metall in die Kollektionsfarbe */
.gal-main.packshot img{mix-blend-mode:normal}
.gal-main::after{content:''; position:absolute; width:46%; height:46%; border:2.5px solid rgba(255,255,255,.55);
  border-radius:50%; right:-12%; bottom:-12%; pointer-events:none}
.gal-wrap{position:relative}
.gal-wrap::before{content:''; position:absolute; width:120px; height:120px; border-radius:50%;
  background:var(--lav-tint); top:-34px; left:-40px; z-index:-1}
.gal-main .tag{position:absolute; top:16px; left:16px; z-index:2}
.gal-thumbs{display:flex; gap:12px; margin-top:16px}
/* display aus der eigenen Regel schlaegt [hidden], darum hier ausdruecklich */
.gal-thumbs[hidden]{display:none}
.gal-thumbs button{width:76px; height:76px; border-radius:8px; overflow:hidden; border:2px solid transparent;
  padding:0; cursor:pointer; background:#fff; transition:border-color .12s, transform .12s}
.gal-thumbs button img{width:100%; height:100%; object-fit:cover; display:block}
.gal-thumbs button.active{border-color:var(--coral)}
.gal-thumbs button:hover{transform:translateY(-2px)}
/* Sieben Fassungen haben keine Trageaufnahme. Statt einer halben Galerie steht dort
   die Schnittzeichnung: eine zweite Ansicht, die etwas erklaert, das kein Foto zeigt. */
.gal-main.isschema{cursor:default; display:grid; place-items:center; padding:6%}
.gal-main.isschema svg{width:100%; height:auto}
.gal-thumbs .tsch{display:grid; place-items:center; width:100%; height:100%; background:#fff; padding:9%}
.gal-thumbs .tsch svg{width:100%; height:auto}
.gal-legende{font-size:12.5px; line-height:1.55; color:var(--ink-soft); margin-top:12px; max-width:44ch}
.gal-legende[hidden]{display:none}

.buy .eyebrow{margin-bottom:10px}
.buy h1{font-family:var(--serif); font-weight:300; font-size:clamp(34px,4.6vw,52px); line-height:1.05; color:var(--charcoal)}
/* Der erste Satz unter dem Namen beantwortet die erste Frage: wofuer ist das da.
   Variante und SKU sind Verwaltung, sie ruecken darunter und werden kleiner. */
.buy .zweck{font-size:17px; line-height:1.55; color:#4a453e; margin-top:12px; max-width:46ch}
.buy .variant-line{font-size:13px; color:var(--ink-soft); margin-top:12px; letter-spacing:.04em}
/* Platzhalter sollen als Platzhalter lesbar sein, nicht als fehlender Text */
.pdp .ph{background:var(--lav-tint); border-radius:4px; padding:1px 6px; font-size:13px}
.buy .price-row{display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 14px; margin:22px 0 4px}
.buy .price-big{font-family:var(--serif); font-size:42px; color:var(--charcoal); position:relative; display:inline-block; z-index:0; white-space:nowrap; flex:none}
.buy .price-big::after{content:''; position:absolute; left:0; bottom:4px; width:100%; height:10px;
  background:var(--coral-tint); z-index:-1; border-radius:3px}
.buy .price-note{font-size:12.5px; color:var(--ink-soft)}
.pills{display:flex; flex-wrap:wrap; gap:10px; margin:20px 0 6px}
.pills a{display:inline-flex; align-items:center; gap:8px; padding:10px 18px; border-radius:99px;
  border:1.5px solid var(--warmgrey); font-size:13.5px; font-weight:500; color:var(--charcoal);
  transition:border-color .12s, background .12s}
.pills a.active{border-color:var(--coral); background:var(--coral-tint)}
.pills a:hover{border-color:var(--coral)}
.pills .dot{width:9px; height:9px; border-radius:50%}
.buy-ctas{display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin:26px 0 8px}
.buy-ctas .btn{justify-content:center; font-size:15px; padding:16px 20px; letter-spacing:.04em}
#mainAdd{flex:2 1 240px}
#saveBtn{flex:1 0 100%}
@media(max-width:520px){.buy-ctas{flex-direction:column}}
/* Frueher stand hier eine Hakenliste. Eine Aufzaehlung nimmt keine Sorge weg,
   eine Antwort schon. Darum jetzt Frage und Antwort, mit der Passgrenze mittendrin.
   Die Frage nach dem Halt steht bewusst NICHT hier: das Erklaermodul direkt darueber
   beantwortet sie mit drei Zeichnungen, eine zweite Fassung waere nur Flaeche. */
.sorgen{margin:26px 0 4px; padding-top:20px; border-top:1px dashed var(--warmgrey)}
.sorgen > h3{font-family:var(--sans); font-size:12px; font-weight:600; letter-spacing:.16em;
  text-transform:uppercase; color:var(--navy); margin-bottom:16px}
.sorge{padding:0 0 0 16px; border-left:3px solid var(--coral-tint); margin-bottom:15px}
.sorge:last-child{margin-bottom:0}
.sorge b{display:block; font-family:var(--sans); font-size:15px; font-weight:600;
  color:var(--charcoal); margin-bottom:3px; line-height:1.4}
.sorge span{display:block; font-size:14.5px; line-height:1.6; color:#5a554e}

.pay-row{display:flex; flex-wrap:wrap; gap:7px; margin-top:14px}
.pay-row .pp{border:1px solid #e3ddd2; border-radius:6px; padding:4px 10px; font-size:11px;
  letter-spacing:.05em; font-weight:500; color:var(--ink-soft); background:#fff}
.liefer-row{font-size:13px; line-height:1.6; color:#5a554e; margin-top:12px}
.trust-row{font-size:12px; color:var(--ink-soft); margin-top:10px; letter-spacing:.02em}

/* Paar oder Einzelohr: im echten japanischen Shop Standard, hier als Variantenachse */
.halb{display:flex; gap:0; border:1.5px solid var(--warmgrey); border-radius:4px; overflow:hidden; margin:18px 0 4px}
.halb button{
  flex:1; background:none; border:none; cursor:pointer; font:inherit; font-size:13px; font-weight:600;
  letter-spacing:.04em; color:var(--ink-soft); padding:11px 10px; display:flex; flex-direction:column; gap:2px;
  transition:background .12s, color .12s;
}
.halb button + button{border-left:1.5px solid var(--warmgrey)}
.halb button span{font-size:12px; font-weight:400; letter-spacing:0}
.halb button.active{background:var(--navy); color:#fff}
.halb button .unit{font-size:11px; font-weight:400; letter-spacing:.06em; text-transform:uppercase; opacity:.7}
/* Der Einzelohrpreis ist der Anker: zwei einzelne Ohren neben dem Paarpreis
   machen den Paarpreis lesbar, ohne dass wir etwas behaupten muessen. */
.halb-note{font-size:13.5px; line-height:1.55; color:#5a554e; margin-top:8px; max-width:46ch}
.halb-anker{display:block; margin-top:5px; color:var(--charcoal); font-weight:500}

/* Verschluss-Erklaermodul: erklaert die Mechanik, die auf keiner echten Produktseite steht */
.mech{margin:22px 0 4px; padding:18px 20px; background:var(--paper); border:1px solid #efe8dc; border-radius:8px}
.mech h3{font-family:var(--sans); font-size:12px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--navy); margin-bottom:14px}
.mech-steps{display:grid; grid-template-columns:repeat(3,1fr); gap:14px}
.mech-step{display:flex; flex-direction:column; gap:8px}
.mech-step svg{display:block; width:100%; max-width:120px; height:auto}
.mech-step b{font-family:var(--sans); font-size:13px; font-weight:600; color:var(--charcoal)}
.mech-step span{font-size:13px; line-height:1.45; color:#5a554e}
/* Die drei Schritte erklaeren die Mechanik. Sie sagen nicht, was daraus folgt.
   Der Nutzen gehoert daneben, sonst bleibt es Technik. */
.mech-folge{margin-top:16px; padding-top:14px; border-top:1px solid #efe8dc}
.mech-folge b{display:block; font-family:var(--sans); font-size:13px; font-weight:600;
  color:var(--charcoal); margin-bottom:4px}
.mech-folge p{font-size:14px; line-height:1.6; color:#5a554e}
.mech-note{margin-top:14px; font-size:13px; color:#5a554e}
.mech-note a{color:var(--coral-deep); font-weight:600}
@media(max-width:560px){.mech-steps{grid-template-columns:1fr; gap:16px}}

/* Spec-Tabelle: die echten Shops liefern Masse auf 0.01mm, aber nie den Verschluss */
table.spec{width:100%; border-collapse:collapse; margin:2px 0 14px; font-size:14px}
table.spec th, table.spec td{text-align:left; padding:8px 0; border-bottom:1px solid #efe8dc; vertical-align:top}
table.spec th{font-weight:500; color:var(--ink-soft); width:42%; font-size:13px}
table.spec td{color:#4a453e; font-variant-numeric:tabular-nums}

.notify-form{margin-top:14px; display:flex; flex-direction:column; gap:7px}
.notify-form[hidden]{display:none}
.notify-form label{font-size:12px; font-weight:500; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft)}
.notify-row{display:flex; flex-wrap:wrap; gap:8px}
.notify-row .btn{flex:1 1 auto; justify-content:center}
/* Gleicher Feldrahmen wie an der Kasse und im Kontaktformular */
.notify-row input{flex:1; min-width:0; border:1.5px solid var(--grey-deep); border-radius:4px; padding:11px 12px; font:inherit; font-size:15px; background:#fff}
.notify-row input:focus{border-color:var(--navy)}
.notify-note{font-size:12.5px; color:var(--ink-soft)}

/* Groessenvergleich in Millimetern statt Raterei */
.sizeviz{margin:4px 0 12px}
.sizeviz svg{max-width:100%; height:auto}
.sizeviz figcaption{font-size:12.5px; color:var(--ink-soft); margin-top:8px}
.acc{margin-top:30px; border-top:1px solid #e8e2d8}
.acc-item{border-bottom:1px solid #e8e2d8}
/* Ein geschlossenes Akkordeon ist unsichtbarer Inhalt. Jede Zeile sagt darum
   im geschlossenen Zustand, was dahinter steht. */
.acc-item button{width:100%; display:flex; justify-content:space-between; align-items:flex-start; gap:16px;
  background:none; border:none; cursor:pointer; font:inherit; text-align:left;
  padding:15px 2px; font-size:14.5px; font-weight:500; color:var(--charcoal)}
.acc-t{display:flex; flex-direction:column; gap:2px}
.acc-t .acc-h{font-size:15px; font-weight:500; line-height:1.35}
.acc-t .acc-teaser{font-size:13px; font-weight:400; color:var(--ink-soft); line-height:1.4}
.acc-item button .plus{font-size:20px; color:var(--coral-deep); transition:transform .3s; line-height:1.2}
.acc-item.open button .plus{transform:rotate(45deg)}
.acc-body{max-height:0; overflow:hidden; transition:max-height .3s cubic-bezier(.19,1,.22,1)}
.acc-body p{font-size:15px; line-height:1.7; color:#5a554e; padding:0 2px 18px}
.acc-body ol{padding:0 2px 18px 20px; font-size:15px; line-height:1.85; color:#5a554e}

/* Was nach dem Kauf passiert, stand bisher erst auf der Bestaetigungsseite.
   Da ist es zu spaet: es nimmt genau vor dem Kauf die Unsicherheit weg. */
.nachkauf{max-width:1180px; margin:0 auto; padding:72px var(--pad) 0}
.nk-kopf{max-width:54ch; margin-bottom:30px}
.nk-kopf h2{font-family:var(--serif); font-weight:300; font-size:clamp(26px,3.4vw,40px); color:var(--charcoal)}
.nk-kopf p{font-size:16px; color:#5a554e; margin-top:8px}
.nk-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:22px}
@media(max-width:900px){.nk-grid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.nk-grid{grid-template-columns:1fr}}
.nk-schritt{background:var(--paper); border:1px solid #efe8dc; border-radius:8px; padding:22px 20px}
.nk-schritt:nth-child(1){box-shadow:8px 8px 0 var(--coral-tint)}
.nk-schritt:nth-child(2){box-shadow:8px 8px 0 var(--sage-tint)}
.nk-schritt:nth-child(3){box-shadow:8px 8px 0 var(--lav-tint)}
.nk-schritt:nth-child(4){box-shadow:8px 8px 0 #F0E4D3}
/* Nummer in Warmgrau, wie die Schrittkarten der Story. Vier Coral-Ziffern nebeneinander
   waeren vier Blickfaenge auf einer Bildschirmhoehe, die Toenung der Schatten reicht. */
.nk-schritt em{display:block; font-style:normal; font-family:var(--serif); font-size:28px;
  color:var(--warmgrey); line-height:1; margin-bottom:12px; font-variant-numeric:tabular-nums}
.nk-schritt b{display:block; font-family:var(--sans); font-size:14px; font-weight:600;
  color:var(--charcoal); margin-bottom:6px; line-height:1.35}
.nk-schritt p{font-size:14px; line-height:1.6; color:#5a554e}
.nk-schritt .ph{background:var(--lav-tint); border-radius:4px; padding:1px 6px}

/* Das Band trug drei Spalten mit den drei Handgriffen. Die stehen jetzt nur noch
   einmal, oben in der Kaufspalte. Uebrig bleibt die dunkle Flaeche mit dem
   Anspruch und dem Weg zur Demo, in einer Zeile. */
.cl-band{background:var(--navy); color:#fff; margin-top:70px; --focus-ring:#FAF7F2}
.cl-band .wrap{padding:48px var(--pad)}
@media(max-width:820px){.cl-band .wrap{padding:36px var(--pad)}}
.cl-band .clb-head{display:flex; align-items:baseline; justify-content:space-between; gap:14px 20px; flex-wrap:wrap}
/* Der Link ist der naechste Schritt aus diesem Band heraus und darf kein Ziel
   von 17 Pixeln Hoehe sein. */
.cl-band .clb-head a{display:inline-flex; align-items:center; min-height:44px}
.cl-band .clb-head h2{font-family:var(--serif); font-weight:300; font-size:clamp(26px,3.4vw,40px)}
.cl-band .clb-head a{font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--coral); font-weight:500}

/* Karten ohne zweites Bild: der Wechsel beim Ueberfahren blendet sonst dasselbe
   Foto gegen sich selbst, das Motiv wuerde nur springen */
.card-img.single img.thumb{opacity:1}

.xsell{padding:70px var(--pad) 90px; max-width:1180px; margin:0 auto; position:relative; overflow:hidden}
.xsell > *{position:relative; z-index:2}
.xsell h2{font-family:var(--serif); font-weight:300; font-size:clamp(26px,3.4vw,40px); color:var(--charcoal); margin-bottom:26px}

/* ---------- Die drei Einwaende, einmal statt zweimal ----------
   Der Fussblock fuehrt Passform, Klick und Retoure als Teaser. Auf dieser Seite
   sind alle drei schon beantwortet: Passform und Retoure im Sorgen-Block direkt
   neben dem Kaufknopf, der Klick im Mechanik-Block darueber. Ein Teaser, der
   eine Frage zum dritten Mal stellt, nachdem sie beantwortet ist, nimmt der
   Antwort ihr Gewicht. */
.foot-halt{display:none}
</style>
</head>
<body class="page-light">

{{HEADER}}

<main id="inhalt" class="pdp">
  <div class="crumbs" role="navigation" aria-label="{{t:pdp.krume.aria}}" id="crumbs"></div>
  <div class="pdp-grid">
    <div class="gal">
      <div class="gal-wrap">
      <div class="gal-main" id="galMain"></div>
      </div>
      <div class="gal-thumbs" id="galThumbs"></div>
      <p class="gal-legende" id="galLeg" hidden>{{t:pdp.schema.legende}}</p>
    </div>
    <div class="buy" id="buy"></div>
  </div>
</main>

<section class="nachkauf" id="nachkauf" aria-labelledby="nkTitel">
  <div class="nk-kopf">
    <h2 id="nkTitel">{{t:pdp.nachkauf.titel}}</h2>
    <p>{{t:pdp.nachkauf.lead}}</p>
  </div>
  <div class="nk-grid" id="nkGrid"></div>
</section>

<!-- Das Band fuehrte dieselben drei Handgriffe wie der Mechanik-Block in der
     Kaufspalte, Wort fuer Wort dieselbe Reihenfolge, eine Bildschirmhoehe
     darunter. Beim dritten Mal auf einer Seite ueberzeugt «einstecken, drehen,
     klick» niemanden mehr, es liest sich wie Fuellmaterial. Die dunkle Flaeche
     bleibt als Atempause und als sichtbarer naechster Schritt zur Demo, die
     Wiederholung faellt weg. -->
<section class="cl-band">
  <div class="wrap">
    <div class="clb-head">
      <h2>Click-Lock. <em style="font-style:italic; color:var(--coral)">{{t:pdp.band.titel_kursiv}}</em></h2>
      <a href="index.html#clicklock">{{t:pdp.band.link}}</a>
    </div>
  </div>
</section>

<section class="xsell">
  <h2>{{t:pdp.xsell.titel}}</h2>
  <div class="rail" id="xsellRail"></div>
</section>

<div class="stickybar" id="stickybar"></div>

{{FOOTER}}
{{DRAWER}}

<script>
{{SHARED_JS}}

// ---------- PDP ----------
const byId = Object.fromEntries(PRODUCTS.map(p => [p.id, p]));
const param = new URLSearchParams(location.search).get('p');
const P = byId[param] || (param ? null : PRODUCTS[0]);
if (!P){
  document.querySelector('.pdp').innerHTML = `
    <div class="crumbs"><a href="index.html">${txt('pdp.krume.start')}</a><span class="sep">/</span><span>${txt('pdp.fehler.krume')}</span></div>
    <h1 style="font-family:var(--serif);font-weight:300;font-size:clamp(32px,4.4vw,52px);margin:14px 0 12px">${txt('pdp.fehler.titel')}</h1>
    <p style="font-size:17px;line-height:1.65;color:#5a554e;max-width:48ch">${txt('pdp.fehler.text')}</p>
    <div style="margin-top:26px;display:flex;gap:12px;flex-wrap:wrap">
      <a class="btn btn-coral" href="kollektion.html">${txt('pdp.fehler.knopf_kollektion')}</a>
      <a class="btn btn-ghost" href="index.html">${txt('pdp.fehler.knopf_start')}</a>
    </div>`;
  document.title = 'Baqless · ' + txt('pdp.fehler.krume');
  document.getElementById('stickybar')?.remove();
  // Ohne Produkt gibt es nichts zu ergaenzen und nichts zu bestellen. Leere Abschnitte
  // mit Ueberschrift sehen aus wie ein Fehler im Fehler.
  document.querySelector('.xsell')?.remove();
  document.getElementById('nachkauf')?.remove();
  throw new Error('Produkt nicht gefunden');
}
document.title = `Baqless · ${P.name} ${P.variant}`;
track('view_item', { currency: 'CHF', value: P.price, items: [{ item_id: P.sku, item_name: `${P.name} ${P.variant}`, price: P.price }] });

// Breadcrumbs
document.getElementById('crumbs').innerHTML =
  `<a href="index.html">${txt('pdp.krume.start')}</a><span class="sep">/</span>` +
  `<a href="kollektion.html?c=${P.collection}">${P.collection}</a><span class="sep">/</span>` +
  `<span>${P.name} ${P.variant}</span>`;

// Galerie
const galMain = document.getElementById('galMain');
const galThumbs = document.getElementById('galThumbs');
// Eine zweite Ansicht gibt es nur, wenn es wirklich ein zweites Bild gibt.
// Wo thumb und detail dieselbe Datei sind, waere «Getragen» eine Beschriftung
// ohne Aufnahme dahinter.
const zweiteAnsicht = !!P.detail && P.detail !== P.thumb;
const views = [{typ: 'bild', src: P.thumb, label: txt('pdp.galerie.ansicht_produkt')}];
// Fehlt die Trageaufnahme, tritt der Schnitt an ihre Stelle. Er zeigt den Zustand,
// den kein Foto zeigen kann: den Anker quer hinter dem Ohr. So bleibt die Galerie
// zweiteilig, ohne dass wir ein fremdes Bild einsetzen.
views.push(zweiteAnsicht
  ? {typ: 'bild', src: P.detail, label: txt('pdp.galerie.ansicht_getragen')}
  : {typ: 'schema', label: txt('pdp.schema.label')});

// Schnittzeichnung durchs Ohrlaeppchen. Beschriftet nur in der grossen Fassung:
// im Vorschaubild von 76 Pixeln waere jede Schrift unlesbar.
function schemaSvg(gross){
  const t = s => txt('pdp.schema.' + s);
  const schraffur = gross
    ? '<g clip-path="url(#bqSchnitt)" stroke="#EBDFD4" stroke-width="1">' +
      Array.from({length: 12}, (_, i) => `<line x1="${100 + i * 17}" y1="344" x2="${146 + i * 17}" y2="84"/>`).join('') +
      '</g>'
    : '';
  const beschriftung = gross ? `
      <g stroke="#CFC6BB" stroke-width="1">
        <line x1="209" y1="82" x2="209" y2="94"/>
        <line x1="292" y1="144" x2="292" y2="154"/>
        <line x1="96" y1="262" x2="96" y2="282"/>
      </g>
      <g font-family="Inter, -apple-system, sans-serif" font-size="16" fill="#6b655c">
        <text x="209" y="76" text-anchor="middle">${t('teil_lappen')}</text>
        <text x="292" y="138" text-anchor="middle">${t('teil_anker')}</text>
        <text x="96" y="298" text-anchor="middle">${t('teil_ohrring')}</text>
        <text x="64" y="128" text-anchor="middle" fill="#C93B27">${t('teil_drehung')}</text>
      </g>` : '';
  return `<svg viewBox="0 0 400 400" ${gross ? `role="img" aria-label="${t('aria')}"` : 'aria-hidden="true" focusable="false"'}>

// Groessenvergleich: echte Masse gegen einen Millimeter-Massstab, statt Raterei am Foto
(function sizeViz(){
  const box = document.getElementById('accSize');
  if (!box) return;
  const m = P.masseMm;
  const hinweis = `<p>${txt('pdp.passform.hinweis', {link: `<a href="kontakt.html">${txt('pdp.passform.hinweis_link')}</a>`})}</p>`;
  if (!m){
    box.innerHTML = `<p><span class="ph">${txt('pdp.passform.grafik_folgt')}</span></p>` + hinweis;
    return;
  }
  const b = m.b, h = m.h;
  // Eine Einheit im viewBox ist genau ein Millimeter, und die Breite wird in
  // Millimetern gesetzt. Damit zeichnet der Browser massstabsgetreu, statt dass
  // wir Pixel je Millimeter raten. Bildschirme weichen davon leicht ab, das steht
  // in der Bildunterschrift, deshalb behaupten wir keine Originalgrösse.
  const skala = Math.max(20, Math.ceil(Math.max(b, h) + 3));
  const padL = 2, padT = 3, achse = padT + Math.max(h, 10) + 5;
  const hoehe = achse + 6;
  const ticks = Array.from({length: skala + 1}, (_, i) => {
    const lang = i % 5 === 0;
    const x = padL + i;
    return `<line x1="${x}" y1="${achse}" x2="${x}" y2="${achse - (lang ? 2.4 : 1.2)}" stroke="#BFB8B0" stroke-width=".25"/>` +
      (lang ? `<text x="${x}" y="${achse + 4}" font-size="2.6" fill="#6b655c" text-anchor="middle">${i}</text>` : '');
  }).join('');
  box.innerHTML = `
    <figure class="sizeviz">
      <svg width="${padL * 2 + skala}mm" viewBox="0 0 ${padL * 2 + skala} ${hoehe}" role="img"
           aria-label="${txt('pdp.groesse.aria', {name: `${P.name} ${P.variant}`, b, h})}">
        <rect x="${padL}" y="${padT}" width="${b}" height="${h}" rx="${Math.min(b, h) * .28}"
              fill="#FFE3DE" stroke="#C93B27" stroke-width=".3"/>
        <text x="${padL + b + 3}" y="${padT + 3}" font-size="3" fill="#4a453e">${b} × ${h} mm</text>
        <line x1="${padL}" y1="${achse}" x2="${padL + skala}" y2="${achse}" stroke="#BFB8B0" stroke-width=".3"/>
        ${ticks}
        <text x="${padL + skala}" y="${achse - 3.4}" font-size="2.6" fill="#6b655c" text-anchor="end">${txt('pdp.groesse.achse')}</text>
      </svg>
      <figcaption>${txt('pdp.groesse.bildlegende', {name: `${P.name} ${P.variant}`})}</figcaption>
    </figure>` + hinweis;
})();

    }
    track('generate_lead', { method: 'back_in_stock', item_id: P.sku });
    notifyForm.innerHTML = `<span class="notify-note"><b>${txt('pdp.notify.titel')}</b> ${txt('pdp.notify.text', {mail: mail.value.trim(), name: P.name})} <span class="ph">${txt('pdp.notify.prototyp')}</span></span>`;
  });
}

// ---------- V3: Sticky-Kaufleiste (mobil) ----------
const sb = document.getElementById('stickybar');
sb.innerHTML = `
  <img src="${P.thumb}" alt="">
  <div class="sb-meta"><h4>${P.name} · ${P.variant}</h4><span>${P.lager === 'ausverkauft' ? txt('pdp.leiste.ausverkauft') : 'CHF ' + P.price}</span></div>
  ${P.lager === 'ausverkauft'
    ? `<button class="btn btn-navy" data-notify="${P.id}">${txt('pdp.leiste.knopf_benachrichtigen')}</button>`
    : `<button class="btn btn-coral" data-add="${P.id}" data-uses-qty="1" data-einzel="0">${txt('pdp.knopf.in_den_warenkorb')}</button>`}`;
const ctasEl = document.querySelector('.buy-ctas');
function updateSticky(){
  const show = ctasEl.getBoundingClientRect().bottom < 0;
  sb.classList.toggle('show', show);
  document.body.style.paddingBottom = show ? 'calc(70px + env(safe-area-inset-bottom))' : '';
}
addEventListener('scroll', updateSticky, {passive:true});
updateSticky();

// Beim Laden die Variante aus der Adresse uebernehmen. Das steht bewusst hier
// unten: der Umschalter setzt auch die Kaufleiste, und die gibt es erst jetzt.
// Weiter oben liefen Preis und Variante der Leiste ins Leere, sie zeigte
// danach das Paar zum vollen Preis.
if (new URLSearchParams(location.search).get('v') === 'einzel' && P.halb){
  document.querySelector('#halbToggle button[data-einzelset="1"]')?.click();
}

// ---------- V3: Strukturierte Daten (SEO/GEO-Blaupause) ----------
const ld = document.createElement('script');
ld.type = 'application/ld+json';
ld.textContent = JSON.stringify({
  '@context': 'https://schema.org', '@type': 'Product',
  name: `${P.name} ${P.variant}`, sku: P.sku, brand: {'@type': 'Brand', name: 'Baqless'},
  description: P.desc, category: txt('pdp.ld.kategorie', {kollektion: P.collection}),
  offers: {'@type': 'Offer', price: P.price, priceCurrency: 'CHF', availability: P.lager === 'ausverkauft' ? 'https://schema.org/OutOfStock' : 'https://schema.org/InStock',
    shippingDetails: {'@type': 'OfferShippingDetails', freeShippingThreshold: {'@type': 'MonetaryAmount', value: 99, currency: 'CHF'}}}
});
document.head.appendChild(ld);
const ldBc = document.createElement('script');
ldBc.type = 'application/ld+json';
ldBc.textContent = JSON.stringify({
  '@context': 'https://schema.org', '@type': 'BreadcrumbList',
  itemListElement: [
    {'@type': 'ListItem', position: 1, name: txt('pdp.krume.start'), item: 'index.html'},
    {'@type': 'ListItem', position: 2, name: P.collection, item: `kollektion.html?c=${P.collection}`},
    {'@type': 'ListItem', position: 3, name: `${P.name} ${P.variant}`}
  ]
});
document.head.appendChild(ldBc);

// ---------- V3: Zuletzt angesehen ----------
let seen = [];
try { seen = JSON.parse(localStorage.getItem('baqless_seen') || '[]'); } catch(e) {}
const seenPrev = seen.filter(id => id !== P.id && byId[id]);
seen = [P.id, ...seenPrev].slice(0, 6);
try { localStorage.setItem('baqless_seen', JSON.stringify(seen)); } catch(e) {}
if (seenPrev.length){
  const sec = document.createElement('section');
  sec.className = 'seen';
  sec.innerHTML = `<h2>${txt('pdp.gesehen.titel')}</h2><div class="rail" id="seenRail"></div>`;
  document.querySelector('.xsell').after(sec);
  document.getElementById('seenRail').innerHTML = seenPrev.slice(0, 4).map(id => {
    const p = byId[id];
    return `
    <article class="card" data-id="${p.id}">
      <div class="card-img${hatDetail(p) ? '' : ' single'}" data-flip>
        <img class="thumb" src="${p.thumb}" alt="${p.name} ${p.variant}" loading="lazy">
        ${hatDetail(p) ? `<img class="detail" src="${p.detail}" alt="" loading="lazy">` : ''}
      </div>
      <div class="card-meta">
        <div><h3><a class="card-link" href="produkt.html?p=${p.id}">${p.name}</a></h3><span class="variant">${p.variant} · Click-Lock</span></div>
        <span class="price">CHF ${p.price}</span>
      </div>
      <button class="add-btn" data-qty="1" data-add="${p.id}">${txt('pdp.knopf.in_den_warenkorb')}</button>
    </article>`;
  }).join('');
  document.getElementById('seenRail').addEventListener('click', e => {
    if (e.target.closest('[data-add]') || e.target.closest('.card-link')) return;
    const a = e.target.closest('article');
    if (a) location.href = 'produkt.html?p=' + a.dataset.id;
  });
}
</script>
</body>
</html>
