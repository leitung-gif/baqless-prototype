<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{t:seite.kollektion.beschreibung}}">
<link rel="canonical" href="{{CANONICAL}}">
{{HREFLANG}}
<link rel="icon" href="{{BASE}}favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="{{BASE}}icon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="{{BASE}}icon-512.png">
<link rel="apple-touch-icon" href="{{BASE}}apple-touch-icon.png">
<title>{{t:seite.kollektion.titel}}</title>
<style>
{{CSS}}
</style>
</head>
<body class="page-light hero-dark">

{{HEADER}}

<header class="plp-hero">
  <div class="blob" style="width:380px;height:380px;background:var(--coral);top:-120px;right:-80px"></div>
  <div class="blob" style="width:260px;height:260px;background:var(--lavender);bottom:-100px;left:-60px"></div>
  <div class="blob" style="width:120px;height:120px;background:var(--sage);top:40px;left:34%"></div>
  <h1>{{t:plp.kollektion.hero.titel}}</h1>
  <p>{{t:plp.kollektion.hero.text}}</p>
</header>

<main id="inhalt" class="plp-wrap">
  <div class="plp-tools" id="plpTools">
    <button class="fpill active" data-c="alle">{{t:plp.filter.alle}}</button>
    <button class="fpill" data-c="Honesty">Honesty</button>
    <button class="fpill" data-c="Amity">Amity</button>
    <button class="fpill" data-c="Embrace">Embrace</button>
    <button class="fpill" data-c="WA">WA</button>
    <select id="plpSort" aria-label="{{t:plp.sort.label}}">
      <option value="std">{{t:plp.sort.empfohlen}}</option>
      <option value="asc">{{t:plp.sort.preis_auf}}</option>
      <option value="desc">{{t:plp.sort.preis_ab}}</option>
      <option value="neu">{{t:plp.sort.neu_zuerst}}</option>
    </select>
  </div>
  <div class="plp-count" id="plpCount"></div>
  <div class="plp-grid" id="plpGrid"></div>
</main>

{{FOOTER}}
{{DRAWER}}

<script>
{{SHARED_JS}}

// ---------- PLP ----------
let fCol = new URLSearchParams(location.search).get('c') || 'alle';
let fSort = 'std';
const grid = document.getElementById('plpGrid');
const pills = [...document.querySelectorAll('.fpill')];
const validCols = pills.map(b => b.dataset.c);
if (!validCols.includes(fCol)) fCol = 'alle';
pills.forEach(b => b.classList.toggle('active', b.dataset.c === fCol));

function cardHtml(p, i){
  return `
  <article class="card" data-id="${p.id}" style="animation-delay:${Math.min(i * 55, 440)}ms">
    <div class="card-img" data-flip>
      ${p.tag ? `<span class="tag ${p.tagCls}">${p.tag}</span>` : ''}
      <img class="thumb" src="${p.thumb}" alt="${p.name} ${p.variant}" loading="lazy">
      <img class="detail" src="${p.detail}" alt="" loading="lazy">
    </div>
    <div class="card-meta">
      <div><h3><a class="card-link" href="produkt.html?p=${p.id}">${p.name}</a></h3><span class="variant">${p.variant} · Click-Lock</span></div>
      <span class="price">CHF ${p.price}</span>
    </div>
    <button class="add-btn" data-qty="1" data-add="${p.id}">${txt('plp.karte.knopf_warenkorb')}</button>
  </article>`;
}

function renderPlp(){
  let list = fCol === 'alle' ? [...PRODUCTS] : PRODUCTS.filter(p => p.collection === fCol);
  if (fSort === 'asc') list.sort((a,b) => a.price - b.price);
  if (fSort === 'desc') list.sort((a,b) => b.price - a.price);
  if (fSort === 'neu') list.sort((a,b) => (b.tag === 'Neu') - (a.tag === 'Neu'));
  const karten = list.map(cardHtml);
  // Editorial-Kachel bricht die Monotonie des Rasters nach der zweiten Reihe
  if (karten.length > 8) karten.splice(8, 0, `
    <div class="ed-break">
      <span class="kicker">${txt('plp.editorial.kicker')}</span>
      <p>${txt('plp.editorial.text')}</p>
      <a href="story.html">${txt('plp.editorial.link')}</a>
    </div>`);
  grid.innerHTML = karten.join('');
  document.getElementById('plpCount').textContent =
    `${txtN('stueck.paar', list.length)}${fCol !== 'alle' ? ' · ' + txt('plp.count.kollektion', {name: fCol}) : ''} · ${txt('plp.count.click_lock')}`;
  const url = new URL(location);
  fCol === 'alle' ? url.searchParams.delete('c') : url.searchParams.set('c', fCol);
  history.replaceState(null, '', url);
}
document.getElementById('plpTools').addEventListener('click', e => {
  const b = e.target.closest('.fpill');
  if (!b) return;
  fCol = b.dataset.c;
  pills.forEach(x => x.classList.toggle('active', x === b));
  renderPlp();
});
document.getElementById('plpSort').addEventListener('change', e => { fSort = e.target.value; renderPlp(); });
grid.addEventListener('click', e => {
  if (e.target.closest('[data-add]') || e.target.closest('.card-link')) return;
  const box = e.target.closest('[data-flip]');
  if (!box) return;
  const a = box.closest('article');
  if (matchMedia('(hover: none)').matches){
    // Erster Tipp dreht zum Getragen-Foto, der zweite fuehrt zur Produktseite
    if (box.classList.contains('flip') && a) location.href = 'produkt.html?p=' + a.dataset.id;
    else box.classList.toggle('flip');
  } else if (a) location.href = 'produkt.html?p=' + a.dataset.id;
});
renderPlp();
track('view_item_list', { item_list_name: 'Kollektionen' });
</script>
</body>
</html>
