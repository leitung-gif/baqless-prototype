<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Neu bei Baqless: die neuesten Ohrringe mit Click-Lock, dazu limitierte Paare aus Japan. Entwickelt in der Schweiz, von Hand gefertigt.">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Baqless · Neuheiten</title>
<style>
{{CSS}}
</style>
</head>
<body class="page-light hero-dark">

{{HEADER}}

<header class="plp-hero">
  <div class="blob" style="width:380px;height:380px;background:var(--coral);top:-120px;right:-80px"></div>
  <div class="blob" style="width:260px;height:260px;background:var(--sage);bottom:-100px;left:-60px"></div>
  <div class="blob" style="width:120px;height:120px;background:var(--lavender);top:40px;left:34%"></div>
  <h1>Frisch eingeklickt. <em>Neuheiten.</em></h1>
  <p>Die neuesten Paare zuerst, limitierte Stücke aus Japan gleich dahinter. Alles mit Click-Lock, alles für jeden Tag.</p>
</header>

<main class="plp-wrap">
  <div class="plp-count" id="plpCount"></div>
  <div class="plp-grid" id="plpGrid"></div>
</main>

{{FOOTER}}
{{DRAWER}}

<script>
{{SHARED_JS}}

// ---------- Neuheiten: Neu zuerst, dann Limitiert, dann alle ----------
const grid = document.getElementById('plpGrid');
const rank = p => p.tag === 'Neu' ? 0 : p.tag === 'Limitiert' ? 1 : 2;
const list = [...PRODUCTS].sort((a, b) => rank(a) - rank(b));

function cardHtml(p, i){
  return `
  <article class="card" data-id="${p.id}" style="animation-delay:${Math.min(i * 55, 440)}ms">
    <div class="card-img" data-flip>
      ${p.tag ? `<span class="tag ${p.tagCls}">${p.tag}</span>` : ''}
      <img class="thumb" src="${p.thumb}" alt="${p.name} ${p.variant}" loading="lazy">
      <img class="detail" src="${p.detail}" alt="" loading="lazy">
    </div>
    <div class="card-meta">
      <div><h3><a class="card-link" href="produkt.html?p=${p.id}">${p.name}</a></h3><span class="variant">${p.variant} · Click-Lock</span></div>
      <span class="price">CHF ${p.price}</span>
    </div>
    <button class="add-btn" data-qty="1" data-add="${p.id}">In den Warenkorb</button>
  </article>`;
}

grid.innerHTML = list.map(cardHtml).join('');
const nNeu = list.filter(p => p.tag === 'Neu').length;
document.getElementById('plpCount').textContent =
  `${nNeu} neue Paare · ${list.length} insgesamt · alle mit Click-Lock`;

grid.addEventListener('click', e => {
  if (e.target.closest('[data-add]') || e.target.closest('.card-link')) return;
  const box = e.target.closest('[data-flip]');
  if (!box) return;
  const a = box.closest('article');
  if (matchMedia('(hover: none)').matches){
    // Erster Tipp dreht zum Getragen-Foto, der zweite fuehrt zur Produktseite
    if (box.classList.contains('flip') && a) location.href = 'produkt.html?p=' + a.dataset.id;
    else box.classList.toggle('flip');
  } else if (a) location.href = 'produkt.html?p=' + a.dataset.id;
});
track('view_item_list', { item_list_name: 'Neuheiten' });
</script>
</body>
</html>
