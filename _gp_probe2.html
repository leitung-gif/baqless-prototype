<!doctype html><meta charset="utf-8"><title>probe2</title>
<style>html,body{margin:0}#f{width:1440px;height:2600px;border:0}</style>
<pre id="out">start</pre>
<iframe id="f" src="about:blank"></iframe>
<script>
const q = new URLSearchParams(location.search);
const PAGE = q.get('p') || 'index.html';
const SEL = q.get('s') || '';
try{ localStorage.setItem('baqless_cart', JSON.stringify([
  {id:'polarisyg', key:'polarisyg', name:'Amity Polaris Gold', variant:'Gold · Paar', price:69, qty:1},
  {id:'polarisyg', key:'polarisyg|einzel', name:'Amity Polaris Gold', variant:'Gold · Einzelohr', price:41, qty:2}
])); }catch(e){}
const out = document.getElementById('out'), f = document.getElementById('f');
f.src = PAGE;
f.onload = () => setTimeout(()=>{
  try{
    const d=f.contentDocument, w=f.contentWindow;
    let L=['URL '+PAGE,'clientW '+d.documentElement.clientWidth];
    for(const s of SEL.split('|').filter(Boolean)){
      const els=d.querySelectorAll(s);
      if(!els.length){L.push(s+' :: NOT FOUND');continue;}
      let n=0;
      for(const e of els){ if(n++>=5)break;
        const r=e.getBoundingClientRect(), cs=w.getComputedStyle(e);
        L.push(s+' #'+n+' x='+r.x.toFixed(1)+' y='+r.y.toFixed(1)+' w='+r.width.toFixed(1)+' h='+r.height.toFixed(1)
          +' | color='+cs.color+' bg='+cs.backgroundColor+' fs='+cs.fontSize+' fw='+cs.fontWeight
          +' radius='+cs.borderRadius+' pos='+cs.position+' pad='+cs.padding+' bw='+cs.borderTopWidth+' bc='+cs.borderTopColor
          +' stroke='+(cs.stroke||'-')+' fill='+(cs.fill||'-')+' op='+cs.opacity+' blend='+cs.mixBlendMode
          +' | "'+(e.textContent||'').trim().slice(0,70).replace(/\s+/g,' ')+'"');
      }
    }
    out.textContent=L.join('\n');
  }catch(err){out.textContent='ERR '+err;}
},1500);
</script>
