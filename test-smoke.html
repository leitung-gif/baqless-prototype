<!DOCTYPE html>
<html lang="de">
<head><meta charset="utf-8"><title>Baqless Smoke-Test</title></head>
<body>
<pre id="out">RUNNING</pre>
<iframe id="f" src="/produkt.html?p=polarisyg" style="width:1280px;height:900px"></iframe>
<script>
const out = [];
const log = (name, ok, info = '') => out.push(`${ok ? 'PASS' : 'FAIL'} ${name}${info ? ' — ' + info : ''}`);
const f = document.getElementById('f');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const click = (d, sel) => { const el = d.querySelector(sel); if (!el) return false; el.click(); return true; };
// Kein stiller Dauerlauf: wenn eine erwartete Navigation ausbleibt, laeuft der Test weiter
const loadOnce = (ms = 15000) => new Promise(r => {
  const done = () => { clearTimeout(t); r(); };
  const t = setTimeout(() => { f.removeEventListener('load', done); r(); }, ms);
  f.addEventListener('load', done, { once: true });
});

async function run() {
  await loadOnce(); await sleep(500);
  let d = f.contentDocument, w = f.contentWindow;
  w.localStorage.clear();

  // ===== PDP-Basis =====
  log('PDP Buybox H1', d.querySelector('.buy h1')?.textContent.trim() === 'Amity Polaris');
  log('PDP Preis', d.querySelector('.price-big')?.textContent.includes('69'));
  log('PDP SKU-Zeile', d.querySelector('.variant-line')?.textContent.includes('BQ-AMI-POL-G'));
  const thumbs = d.querySelectorAll('.gal-thumbs button');
  log('Galerie 2 Ansichten', thumbs.length === 2);
  const len1 = d.querySelector('.gal-main img')?.src.length;
  thumbs[1]?.click(); await sleep(120);
  const len2 = d.querySelector('.gal-main img')?.src.length;
  log('Galerie-Umschaltung', !!len1 && !!len2 && len1 !== len2 && thumbs[1].classList.contains('active'));
  const acc2 = d.querySelectorAll('.acc-item')[1];
  acc2?.querySelector('button')?.click(); await sleep(150);
  log('Akkordeon öffnet', acc2?.classList.contains('open') === true);
  log('Akkordeon meldet seinen Zustand', acc2?.querySelector('button')?.getAttribute('aria-expanded') === 'true'
    && d.querySelectorAll('.acc-item button[aria-expanded]').length === 6);

  // ===== Verschluss-Erklärmodul (die Lücke beider echten Shops) =====
  log('PDP: Verschluss-Modul mit 3 Schritten', d.querySelectorAll('.mech .mech-step').length === 3
    && d.querySelector('.mech h3')?.textContent.includes('ohne Rückteil'));
  log('PDP: Spec-Tabelle mit echten Massen', (() => {
    const t = d.querySelector('table.spec')?.textContent || '';
    return t.includes('5.84 × 5.84 × 1.77 mm') && t.includes('Sterling Silber 925') && t.includes('Herkunft');
  })());
  log('PDP: Grössengrafik in Originalgrösse', !!d.querySelector('#accSize .sizeviz svg')
    && d.querySelector('#accSize svg')?.getAttribute('aria-label')?.includes('Millimeter'));
  log('PDP: Passform-Warnung vor dem Kauf', d.querySelector('#accSize')?.textContent.includes('dicken Ohrläppchen'));

  // ===== Paar oder Einzelohr =====
  log('PDP: Einzelohr-Umschalter da', !!d.getElementById('halbToggle')
    && d.querySelectorAll('#halbToggle button').length === 2);
  log('PDP: Einzelpreis bei 59 Prozent', d.querySelector('#halbToggle button:last-child span')?.textContent === 'CHF 41');
  click(d, '#halbToggle button[data-einzelset="1"]'); await sleep(120);
  log('PDP: Umschalter meldet seinen Zustand', d.querySelector('#halbToggle button[data-einzelset="1"]')?.getAttribute('aria-pressed') === 'true'
    && d.querySelector('#halbToggle button[data-einzelset="0"]')?.getAttribute('aria-pressed') === 'false');
  log('PDP: Umschalten ändert Preis und SKU', d.querySelector('.price-big')?.textContent === 'CHF 41'
    && d.querySelector('.variant-line')?.textContent.includes('-H'));
  click(d, '#mainAdd'); await sleep(200);
  log('PDP: Einzelohr als eigene Warenkorbzeile', (() => {
    const line = d.querySelector('[data-line="polarisyg|einzel"]');
    return !!line && line.textContent.includes('Einzelohr') && line.textContent.includes('41');
  })());
  log('PDP: Einzelohr färbt NICHT auf fremde Karten ab', (() => {
    // Umschalter steht auf Einzelohr. Eine Cross-Sell-Karte muss trotzdem den vollen Preis nehmen.
    const karte = d.querySelector('#xsellRail .card[data-id]');
    const id = karte?.dataset.id;
    karte?.querySelector('[data-add]')?.click();
    // PRODUCTS und cart sind const bzw. let, stehen also nicht auf window: über eval lesen
    const preis = f.contentWindow.eval(`(PRODUCTS.find(x => x.id === '${id}') || {}).price`);
    const zeile = f.contentWindow.eval(`JSON.stringify(cart.find(x => x.id === '${id}') || null)`);
    const z = JSON.parse(zeile || 'null');
    return !!preis && !!z && z.price === preis && !(z.key || '').includes('einzel');
  })());
  log('PDP: Sticky-Leiste folgt dem Umschalter', (() => {
    const sb = d.querySelector('#stickybar [data-add]');
    return sb?.dataset.einzel === '1'
      && d.querySelector('#stickybar .sb-meta span')?.textContent === 'CHF 41';
  })());
  log('PDP: Grössengrafik in echten Millimetern', (() => {
    const svg = d.querySelector('#accSize svg');
    return svg?.getAttribute('width')?.endsWith('mm')
      && !d.querySelector('#accSize').textContent.includes('Originalgrösse');
  })());
  f.contentWindow.localStorage.setItem('baqless_cart', '[]');
  f.src = '/produkt.html?p=polarisyg&r=3';
  await loadOnce(); await sleep(400);
  d = f.contentDocument;
  log('PDP: zurück auf Paar', d.querySelector('.price-big')?.textContent === 'CHF 69'
    && d.getElementById('cartCount')?.textContent === '0');
  log('Warenkorb speichert keine Bilddaten', (() => {
    click(d, '#mainAdd');
    const roh = f.contentWindow.localStorage.getItem('baqless_cart') || '';
    return !roh.includes('data:image') && roh.length < 400;
  })(), (f.contentWindow.localStorage.getItem('baqless_cart') || '').length + ' Zeichen');
  log('Schweizer Zahlenformat', f.contentWindow.eval('fmtCHF(2755)') === 'CHF 2’755',
    f.contentWindow.eval('fmtCHF(2755)'));
  click(d, '[data-remove="polarisyg"]'); await sleep(150);

  log('Robust: beschädigter Speicher legt die Seite nicht lahm', (() => {
    f.contentWindow.localStorage.setItem('baqless_cart', '{"kaputt":true}');
    return true;
  })());
  f.src = '/kollektion.html?r=1';
  await loadOnce(); await sleep(500);
  d = f.contentDocument;
  log('Robust: Katalog rendert trotz kaputtem Warenkorb-Wert', d.querySelectorAll('#plpGrid .card').length === 16
    && d.getElementById('cartCount')?.textContent === '0');
  f.contentWindow.localStorage.clear();

  // ===== Ausverkauft auf der Produktseite =====
  f.src = '/produkt.html?p=blackhoop';
  await loadOnce(); await sleep(450);
  d = f.contentDocument;
  log('PDP ausverkauft: Hinweis steht in der Buybox', !!d.querySelector('.ausverkauft-hinweis')
    && d.querySelector('.ausverkauft-hinweis').textContent.includes('ausverkauft'));
  log('PDP ausverkauft: kein Kaufknopf, weder oben noch in der Leiste', (() => {
    return !d.querySelector('.buy-ctas [data-add]') && !d.querySelector('#stickybar [data-add]')
      && !!d.querySelector('#stickybar [data-notify]');
  })());
  log('PDP ausverkauft: strukturierte Daten sagen OutOfStock', (() => {
    const lds = [...d.querySelectorAll('script[type="application/ld+json"]')].map(x => x.textContent).join(' ');
    return lds.includes('OutOfStock') && !lds.includes('InStock');
  })());

  // Zurueck auf ein lieferbares Produkt, sonst laufen die folgenden Warenkorb-Tests ins Leere
  f.src = '/produkt.html?p=polarisyg&r=4';
  await loadOnce(); await sleep(450);
  d = f.contentDocument; w = f.contentWindow;
  w.localStorage.clear();

  // ===== V3: Menge + Cart v2 =====
  click(d, '#qtyPlus'); await sleep(80);
  log('Mengen-Stepper auf 2', d.getElementById('qtyVal')?.textContent === '2');
  click(d, '#mainAdd'); await sleep(250);
  log('Cart: 2 Stück', d.getElementById('cartCount')?.textContent === '2');
  log('Toast «Sitzt.»', d.getElementById('toast')?.textContent.includes('Sitzt.'));
  log('Tracking: add_to_cart im dataLayer', Array.isArray(w.dataLayer) && w.dataLayer.some(x => x.event === 'add_to_cart'));
  log('Tracking: view_item im dataLayer', w.dataLayer.some(x => x.event === 'view_item'));
  click(d, '#cartBtn'); await sleep(250);
  log('Drawer öffnet', d.getElementById('drawer')?.classList.contains('open') === true);
  log('Drawer-Total CHF 138', d.getElementById('drawerTotal')?.textContent.includes('138'));
  log('Gratisversand erreicht', d.getElementById('shipText')?.textContent.includes('gesichert'));
  click(d, '[data-qminus="polarisyg"]'); await sleep(200);
  log('Stepper minus → CHF 69', d.getElementById('drawerTotal')?.textContent.includes('69'));
  log('Gratisversand-Restbetrag', d.getElementById('shipText')?.textContent.includes('30'));
  const fillW = parseFloat(d.getElementById('shipFill')?.style.width);
  log('Fortschrittsbalken ~70%', fillW > 64 && fillW < 76, fillW + '%');
  click(d, '[data-remove="polarisyg"]'); await sleep(200);
  log('Entfernen leert Warenkorb', d.getElementById('cartCount')?.textContent === '0');
  click(d, '#drawerClose'); await sleep(150);

  // ===== V3: Persistenz =====
  click(d, '#mainAdd'); await sleep(200);
  f.src = '/produkt.html?p=polarisyg&r=1';
  await loadOnce(); await sleep(400);
  d = f.contentDocument; w = f.contentWindow;
  log('Cart überlebt Reload', d.getElementById('cartCount')?.textContent === '2');

  // ===== V3: Suche =====
  click(d, '#searchBtn'); await sleep(200);
  log('Such-Overlay öffnet', d.getElementById('searchOverlay')?.classList.contains('open') === true);
  const inp = d.getElementById('soInput');
  inp.value = 'polaris'; inp.dispatchEvent(new w.Event('input')); await sleep(150);
  log('Suche «polaris» → 2 Treffer', d.querySelectorAll('.so-item').length === 2);
  inp.value = 'xyz123'; inp.dispatchEvent(new w.Event('input')); await sleep(150);
  log('Suche leerer Zustand', !!d.querySelector('.so-empty'));
  log('Such-Treffer-Link', (d.querySelectorAll('.so-item').length === 0));
  click(d, '#soClose'); await sleep(120);
  log('Such-Overlay schliesst', d.getElementById('searchOverlay')?.classList.contains('open') === false);

  // ===== V3: JSON-LD + Sticky-Bar =====
  const lds = [...d.querySelectorAll('script[type="application/ld+json"]')];
  log('JSON-LD Product', lds.some(x => x.textContent.includes('"@type":"Product"')));
  log('JSON-LD Breadcrumbs', lds.some(x => x.textContent.includes('BreadcrumbList')));
  log('Sticky-Bar befüllt', d.getElementById('stickybar')?.querySelector('[data-add]') !== null);

  // ===== Sprach-/Markt-Dropdowns =====
  log('Sprachlabel zeigt die Fassung', d.getElementById('langLabel')?.textContent === 'DE');
  log('Sprachmenue markiert Deutsch', d.querySelector('#langDd .v2-menu button[data-lang="DE"]')?.classList.contains('active') === true
    && d.querySelector('#langDd .v2-menu button[data-lang="EN"]')?.classList.contains('active') === false);
  // Der Umschalter fuehrt in die andere Fassung und behaelt Seite und Abfrage
  log('Sprachwechsel zielt auf en/', w.sprachUrl('en').includes('/en/produkt.html')
    && w.sprachUrl('en').includes('p=polarisyg'), w.sprachUrl('en'));
  log('Sprachwechsel zielt auf fr/', w.sprachUrl('fr').includes('/fr/produkt.html'), w.sprachUrl('fr'));
  log('Deutsch bleibt ohne Ordner', !/\/(en|fr)\//.test(w.sprachUrl('de')), w.sprachUrl('de'));
  click(d, '#marketBtn'); await sleep(120);
  click(d, '#marketDd .v2-menu button[data-market="DE · EUR"]'); await sleep(120);
  log('Marktlabel DE·EUR', d.getElementById('marketLabel')?.textContent.includes('DE'));

  // ===== Cross-Sell + Variante =====
  log('Cross-Sell 4 Karten', d.querySelectorAll('#xsellRail .card').length === 4);
  const silber = [...d.querySelectorAll('.pills a')].find(a => a.textContent.includes('Silber'));
  silber?.click(); await loadOnce(); await sleep(400);
  d = f.contentDocument;
  log('Varianten-Wechsel: Silber CHF 59', d.querySelector('.price-big')?.textContent.includes('59')
    && d.querySelector('.variant-line')?.textContent.includes('Silber'));

  // ===== V3: Zuletzt angesehen (nach 2. Produkt) =====
  log('Seen-Rail erscheint', !!d.querySelector('#seenRail .card'));
  log('Seen-Rail zeigt Vorgänger', d.querySelector('#seenRail .card')?.dataset.id === 'polarisyg');
  log('PDP-Crumb → PLP', d.querySelector('.crumbs a[href*="kollektion.html"]') !== null);

  // ===== V3: PLP =====
  f.src = '/kollektion.html';
  await loadOnce(); await sleep(500);
  d = f.contentDocument;
  log('PLP: 16 Karten', d.querySelectorAll('#plpGrid .card').length === 16);
  log('Karten: Front cream, nicht farbig', (() => {
    const s = f.contentWindow.getComputedStyle(d.querySelector('#plpGrid .card .card-img'));
    return s.backgroundImage === 'none' && s.backgroundColor === 'rgb(255, 255, 255)';
  })());
  log('CI: Neu-Tag mit Navy-Schrift auf Coral', (() => {
    const t = d.querySelector('#plpGrid .tag.tag-coral');
    return !!t && f.contentWindow.getComputedStyle(t).color === 'rgb(11, 29, 63)';
  })());
  log('Katalog führt nur belegbare Auszeichnungen', (() => {
    const tags = JSON.parse(f.contentWindow.eval('JSON.stringify(PRODUCTS.map(p => p.tag).filter(Boolean))'));
    return [...new Set(tags)].every(t => t === 'Neu' || t === 'Limitiert');
  })());
  log('CI: Limitiert-Tag auf Lavender Deep', (() => {
    const t = d.querySelector('#plpGrid .tag.tag-lav');
    return !!t && f.contentWindow.getComputedStyle(t).backgroundColor === 'rgb(99, 85, 196)';
  })());
  click(d, '.fpill[data-c="Honesty"]'); await sleep(200);
  log('PLP-Filter Honesty → 6', d.querySelectorAll('#plpGrid .card').length === 6);
  log('PLP-Count-Text', d.getElementById('plpCount')?.textContent.includes('6'));
  log('PLP-URL-Param', f.contentWindow.location.search.includes('c=Honesty'));
  const sort = d.getElementById('plpSort');
  sort.value = 'asc'; sort.dispatchEvent(new f.contentWindow.Event('change')); await sleep(200);
  log('PLP-Sortierung Preis ↑', d.querySelector('#plpGrid .card .price')?.textContent.includes('49'));
  click(d, '.fpill[data-c="alle"]'); await sleep(150);
  log('PLP zurück auf Alle', d.querySelectorAll('#plpGrid .card').length === 16);
  click(d, '.fpill[data-c="WA"]'); await sleep(200);
  log('PLP-Filter WA → 3', d.querySelectorAll('#plpGrid .card').length === 3);
  click(d, '.fpill[data-c="alle"]'); await sleep(150);

  // ===== PLP mit Param laden =====
  f.src = '/kollektion.html?c=Amity';
  await loadOnce(); await sleep(400);
  d = f.contentDocument;
  log('PLP ?c=Amity → 4 Karten', d.querySelectorAll('#plpGrid .card').length === 4);

  // ===== Ausverkauft-Zustand =====
  f.src = '/kollektion.html';
  await loadOnce(); await sleep(600);
  d = f.contentDocument;
  log('PLP: ausverkaufte Karte markiert', (() => {
    const c = d.querySelector('.card[data-id="blackhoop"]');
    return !!c && c.classList.contains('soldout') && !!c.querySelector('.out-flag');
  })());
  log('PLP: ausverkauft bietet Benachrichtigung statt Warenkorb', (() => {
    const c = d.querySelector('.card[data-id="blackhoop"]');
    const b = c?.querySelector('[data-notify]');
    return !!b && !c.querySelector('[data-add]') && b.textContent === 'Benachrichtigen';
  })());
  d.querySelector('.card[data-id="blackhoop"] [data-notify]')?.click();
  await loadOnce(); await sleep(400);
  d = f.contentDocument;
  log('PLP: Benachrichtigung führt zur Produktseite statt zu leerem Versprechen',
    f.contentWindow.location.search.includes('p=blackhoop') && !!d.getElementById('notifyForm'));
  log('PDP: Benachrichtigung fragt erst nach der Adresse', (() => {
    const form = d.getElementById('notifyForm');
    const vorher = form.hidden;
    d.querySelector('#stickybar [data-notify], .buy-ctas [data-notify]')?.click();
    return vorher === true && form.hidden === false && !!d.getElementById('notifyMail');
  })());
  log('PDP: ungültige Adresse wird abgewiesen', (() => {
    const mail = d.getElementById('notifyMail');
    mail.value = 'keine-adresse';
    d.getElementById('notifyForm').dispatchEvent(new f.contentWindow.Event('submit', { cancelable: true, bubbles: true }));
    return mail.getAttribute('aria-invalid') === 'true';
  })());
  log('PDP: gültige Adresse wird quittiert und getrackt', (() => {
    const mail = d.getElementById('notifyMail');
    mail.value = 'test@lorien.group';
    d.getElementById('notifyForm').dispatchEvent(new f.contentWindow.Event('submit', { cancelable: true, bubbles: true }));
    return d.getElementById('notifyForm').textContent.includes('Eingetragen')
      && f.contentWindow.dataLayer.some(x => x.event === 'generate_lead');
  })());
  f.src = '/kollektion.html';
  await loadOnce(); await sleep(500);
  d = f.contentDocument;

  // ===== Neuheiten-Subpage =====
  f.src = '/neuheiten.html';
  await loadOnce(); await sleep(500);
  d = f.contentDocument;
  log('Neuheiten: 16 Karten', d.querySelectorAll('#plpGrid .card').length === 16);
  log('Neuheiten: Neu zuerst', d.querySelector('#plpGrid .card .tag')?.textContent === 'Neu');
  log('Neuheiten: Zähler-Text', d.getElementById('plpCount')?.textContent.includes('4 neue Paare'));
  log('Neuheiten: view_item_list-Tracking', f.contentWindow.dataLayer
    .some(x => x.event === 'view_item_list' && x.item_list_name === 'Neuheiten'));

  // ===== Homepage =====
  f.src = '/index.html';
  await loadOnce(); await sleep(700);
  d = f.contentDocument;
  log('Home: Rail 8 Karten', d.querySelectorAll('#rail .card').length === 8);
  log('Home: Karten-Link', d.querySelector('#rail .card-link')?.getAttribute('href')?.startsWith('produkt.html?p='));
  log('Home: Nav → PLP', d.querySelector('nav a[href="kollektion.html"]') !== null);
  log('Home: Nav → Neuheiten', d.querySelector('nav a[href="neuheiten.html"]') !== null);
  log('Home: Rail-CTA → Neuheiten', d.querySelector('.products a.btn[href="neuheiten.html"]') !== null);
  log('Home: Suche vorhanden', !!d.getElementById('searchOverlay'));
  log('Home: Cart persistiert', d.getElementById('cartCount')?.textContent === '2');
  log('Home: Newsletter-Form', !!d.getElementById('nlForm'));

  // ===== Hero-Video + Film-Sektion =====
  log('Home: Hero-Video Quelle', !!d.querySelector('.hero-arch video source[src*="hero-film"]'));
  const hv = d.querySelector('.hero-arch video');
  // Headless startet den Autoplay je nach Laufzeit verzögert: einmal anstossen, dann messen
  if (hv && !(hv.currentTime > 0)){ try { await hv.play(); } catch(e) {} await sleep(700); }
  log('Home: Hero-Video läuft an', !!hv && hv.currentTime > 0, 'ct=' + (hv ? hv.currentTime.toFixed(2) : 'n/a'));
  log('Home: Film-Sektion 2 Loops + Bild', d.querySelectorAll('.film-card video').length === 2
    && !!d.querySelector('a.film-card.still img'));
  log('Home: Funnel-Reihenfolge Produkte → Stimmen → Welten → Click-Lock → Film', (() => {
    const secs = [...d.querySelectorAll('header.hero, section')].map(x => x.id || x.className.split(' ')[0]);
    const i = n => secs.indexOf(n);
    return i('produkte') > 0 && i('produkte') < i('reviews') && i('reviews') < i('kollektionen')
      && i('kollektionen') < i('clicklock') && i('clicklock') < i('film');
  })());
  log('Home: Stimmen in einer Reihe (3 Karten)', d.querySelectorAll('#reviews .rev-card').length === 3);
  log('Home: Stimmen mit Rolle, Quelle und Journal-Link', d.querySelectorAll('#reviews .rev-src').length === 3
    && !!d.querySelector('#reviews a[href="journal.html"]')
    && d.querySelector('#reviews').textContent.includes('Taeko Wako'));
  log('Home: keine erfundenen Sterne mehr', d.querySelectorAll('#reviews .rev-stars').length === 0
    && !d.querySelector('#reviews').textContent.includes('★'));
  log('Home: keine Versandstandorte-Statistik', !d.body.innerText.includes('Versandstandorte'));
  log('Home: Story-CTA → Subpage', !!d.querySelector('.story a.btn[href="story.html"]'));
  log('Home: Nav → Story-Subpage', !!d.querySelector('nav a[href="story.html"]'));
  log('Zugang: Sprunglink zum Inhalt', (() => {
    const sk = d.querySelector('.skip-link');
    return !!sk && sk.getAttribute('href') === '#inhalt' && !!d.getElementById('inhalt');
  })());
  log('Zugang: Warenkorb öffnet als Dialog und führt den Fokus', (() => {
    const btn = d.getElementById('cartBtn');
    btn.focus(); btn.click();
    const dr = d.getElementById('drawer');
    return dr.getAttribute('aria-modal') === 'true' && dr.getAttribute('role') === 'dialog'
      && btn.getAttribute('aria-expanded') === 'true';
  })());
  await sleep(200);
  log('Zugang: Fokus steht im Warenkorb', d.activeElement === d.getElementById('drawerClose'));
  d.dispatchEvent(new f.contentWindow.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
  f.contentWindow.dispatchEvent(new f.contentWindow.KeyboardEvent('keydown', { key: 'Escape' }));
  await sleep(200);
  log('Zugang: Escape schliesst und gibt den Fokus zurück', !d.getElementById('drawer').classList.contains('open')
    && d.activeElement === d.getElementById('cartBtn'));
  log('Zugang: Suchfeld hat eine Beschriftung', !!d.querySelector('label[for="soInput"]'));
  log('Zugang: geschlossene Overlays sind nicht tabbar', (() => {
    // inert statt Sichtbarkeit pruefen: haengt an keiner Animation und ist damit eindeutig
    return d.getElementById('drawer').hasAttribute('inert')
      && d.getElementById('mnav').hasAttribute('inert')
      && d.getElementById('searchOverlay').hasAttribute('inert');
  })());
  log('Zugang: offener Warenkorb ist wieder bedienbar', (() => {
    d.getElementById('cartBtn').click();
    const offen = !d.getElementById('drawer').hasAttribute('inert');
    d.getElementById('drawerClose').click();
    return offen && d.getElementById('drawer').hasAttribute('inert');
  })());
  log('Zugang: Fokusrahmen hell auf dunklem Grund', (() => {
    const w2 = f.contentWindow;
    const hero = w2.getComputedStyle(d.querySelector('header.hero')).getPropertyValue('--focus-ring').trim();
    const wurzel = w2.getComputedStyle(d.documentElement).getPropertyValue('--focus-ring').trim();
    return hero.toUpperCase() === '#FAF7F2' && wurzel.toUpperCase() === '#0B1D3F';
  })());
  log('Footer: fünf Spalten in einer Reihe', (() => {
    const g = d.querySelector('.foot-grid');
    const tops = [...g.children].map(c => Math.round(c.getBoundingClientRect().top));
    return g.children.length === 5 && new Set(tops).size === 1;
  })());
  log('Footer: Warenkorb im Drawer verlinkt', !!d.querySelector('#drawer a[href="warenkorb.html"]'));
  log('Footer: Trust ohne Versand-Standorte', (() => {
    const t = d.querySelector('.foot-trust')?.textContent || '';
    return t.includes('30 Tage Rückgaberecht') && !t.includes('Japan');

  })());
  log('Checkout ohne Demo-Wording', d.getElementById('checkoutBtn')?.textContent.trim() === 'Zur Kasse');

  log('Home: Kollektions-Kacheln verlinkt', [...d.querySelectorAll('.col-card')].every(a => a.getAttribute('href')));
  log('Home: Kacheln = echte Kategorien', (() => {
    const hrefs = [...d.querySelectorAll('.col-card')].map(a => a.getAttribute('href'));
    return hrefs.length === 3 && ['Honesty','Amity','Embrace'].every(c => hrefs.includes('kollektion.html?c=' + c));
  })());
  log('Home: Kachel-Zähler korrekt', d.querySelector('[data-colcount="Honesty"]')?.textContent === '6 Paare'
    && d.querySelector('[data-colcount="Amity"]')?.textContent === '4 Paare'

  log('Home: Nav entschlackt', (() => {
    const t = [...d.querySelectorAll('.nav-links > a, .nav-links > .nav-drop > a')].map(a => a.textContent.trim());
    return t.length === 4 && t.join('|') === 'Neuheiten|Kollektionen|Journal|Story';
  })());
  log('Home: Kollektions-Menü mit Live-Zählern', (() => {
    const links = [...d.querySelectorAll('.nav-panel a[href*="?c="]')];
    return links.length === 4
      && d.querySelector('[data-navcount="Honesty"]')?.textContent === '6 Paare'
      && d.querySelector('[data-navcount="WA"]')?.textContent === '3 Paare';
  })());

  // ===== Echter Kaufweg: Warenkorb, Kasse, Bestätigung =====

  f.src = '/produkt.html?p=sageneon';
  await loadOnce(); await sleep(300);
  f.contentWindow.localStorage.setItem('baqless_cart', '[]');
  f.src = '/produkt.html?p=sageneon&r=2';
  await loadOnce(); await sleep(400);
  d = f.contentDocument;
  click(d, '#mainAdd'); await sleep(250);
  log('Kaufweg: Merken bleibt erhalten', (() => {
    click(d, '#saveBtn');
    return d.getElementById('saveBtn')?.textContent === 'Gemerkt';
  })());

  f.src = '/warenkorb.html';
  await loadOnce(); await sleep(500);
  d = f.contentDocument;
  log('Warenkorbseite: Zeilen aus dem Warenkorb', d.querySelectorAll('.cline').length === 1

  log('Warenkorbseite: Summe und Versandhinweis', (() => {
    const t = d.getElementById('cartSum')?.textContent || '';
    return t.includes('Zwischensumme') && t.includes('Total') && (t.includes('Gratis') || t.includes('Gratisversand'));
  })());
  log('Warenkorbseite: Cross-Sell nur mit Verfügbarem', (() => {
    const ids = [...d.querySelectorAll('#xrailRail .card')].map(c => c.dataset.id);
    return ids.length === 4 && !ids.includes('blackhoop') && !ids.includes('sageneon');
  })());

  log('Warenkorbseite: Menge erhöhen rechnet neu', d.querySelector('.cline .cq span')?.textContent === '2'

  f.src = '/kasse.html';
  await loadOnce(); await sleep(500);
  d = f.contentDocument;
  log('Kasse: lädt mit Bestellübersicht', d.querySelectorAll('#koSum .ko-line').length === 1
    && d.getElementById('koSum')?.textContent.includes('Total'));
  log('Kasse: Prototyp-Hinweis sichtbar', d.querySelector('.ko-note')?.textContent.includes('keine Zahlung'));
  log('Kasse: Produktbilder laden wirklich', [...d.querySelectorAll('#koSum .ko-line img')]
    .every(i => i.getAttribute('src') !== 'undefined' && i.naturalWidth > 0));
  log('Kasse: keine Kartennummer-Felder', d.querySelectorAll('input[autocomplete*="cc-"], input[name*="card"]').length === 0);
  log('Kasse: begin_checkout getrackt', f.contentWindow.dataLayer.some(x => x.event === 'begin_checkout'));
  log('Kasse: Rechtshinweis vor dem Kauf', (() => {
    const t = d.querySelector('.ko-recht')?.textContent || '';
    return t.includes('Mehrwertsteuer') && !!d.querySelector('.ko-recht a[href="agb.html"]')
      && !!d.querySelector('.ko-recht a[href*="widerruf"]');
  })());
  log('Kasse: rechnet nach, wenn der Warenkorb sich ändert', (() => {
    const vorher = d.getElementById('koSum').textContent;
    f.contentWindow.addToCart('minelta', 1);
    const nachher = d.getElementById('koSum').textContent;
    const ok = vorher !== nachher && nachher.includes('Honesty Minelta');

  d.querySelector('button[form="koForm"]')?.click(); await sleep(300);
  log('Kasse: leere Pflichtfelder werden gemeldet', d.querySelectorAll('[aria-invalid="true"]').length >= 5

  d.getElementById('fStr').value = 'Bahnhofstrasse 1'; d.getElementById('fPlz').value = '5000';
  d.getElementById('fOrt').value = 'Aarau';

  log('Kasse: Express ändert das Total', d.getElementById('koSum')?.textContent.includes('CHF 14')

  d.querySelector('button[form="koForm"]')?.click();
  await loadOnce(); await sleep(500);
  d = f.contentDocument;
  log('Bestätigung: Seite erreicht', f.contentWindow.location.pathname.includes('bestellung.html'));
  log('Bestätigung: Nummer, Name und Total', (() => {
    const t = d.body.innerText;
    return /BQ-\d{6}/.test(t) && t.includes('Sinan') && t.includes('CHF 144');
  })());
  log('Bestätigung: purchase getrackt', (() => {
    try { return JSON.parse(f.contentWindow.localStorage.getItem('baqless_bestellung')).total === 144; }

  })());
  log('Bestätigung: Warenkorb ist geleert', d.getElementById('cartCount')?.textContent === '0');

  await loadOnce(); await sleep(400);
  d = f.contentDocument;
  log('Kontakt: Titel', d.querySelector('.legal h1')?.textContent.includes('Hallo'));
  log('Kontakt: Nav lesbar auf hellem Grund', (() => {
    const c = f.contentWindow.getComputedStyle(d.getElementById('nav')).color;
    return c === 'rgb(34, 34, 34)';

  d.getElementById('cfName').value = 'Test'; d.getElementById('cfMail').value = 't@t.ch'; d.getElementById('cfMsg').value = 'Hoi';

  // ===== Mobile (375px iframe) =====
  const m = document.createElement('iframe');
  m.style.cssText = 'width:375px;height:740px;border:0';
  document.body.appendChild(m);
  await new Promise(r => { m.addEventListener('load', r, { once: true }); m.src = '/index.html'; });
  await sleep(900);
  const md = m.contentDocument, mw = m.contentWindow;
  log('Mobil: kein horizontaler Overflow', md.documentElement.scrollWidth <= 376,
    'scrollWidth=' + md.documentElement.scrollWidth);
  log('Mobil: Touch-Ziele im Kopf mindestens 44px', (() => {
    const masse = ['#burgerBtn', '#cartBtn', '#searchBtn'].map(sel => {
      const r = md.querySelector(sel)?.getBoundingClientRect();
      return r ? Math.min(r.width, r.height) : 0;
    });
    return masse.every(m2 => m2 >= 44);
  })(), [...['#burgerBtn','#cartBtn','#searchBtn']].map(sel => {
    const r = md.querySelector(sel)?.getBoundingClientRect();
    return sel + ':' + (r ? Math.round(Math.min(r.width, r.height)) : '?');
  }).join(' '));
  log('Mobil: Sprungmarken bleiben unter der Kopfzeile sichtbar',
    mw.getComputedStyle(md.documentElement).scrollPaddingTop === '92px');
  log('Mobil: Menü lässt sich nicht seitwärts schieben',
    mw.getComputedStyle(md.getElementById('mnav')).overflowX === 'hidden');
  const burger = md.getElementById('burgerBtn');
  log('Mobil: Burger sichtbar', !!burger && mw.getComputedStyle(burger).display !== 'none');
  log('Mobil: Nav-Icons im Viewport', (() => {
    const r = burger.getBoundingClientRect(), c = md.getElementById('cartBtn').getBoundingClientRect();
    return r.right <= 376 && r.width > 0 && c.right <= 376 && c.width > 0;
  })(), 'burgerRight=' + Math.round(burger.getBoundingClientRect().right));
  burger.click(); await sleep(300);
  log('Mobil: Menü öffnet', md.getElementById('mnav').classList.contains('open'));
  log('Mobil: Menü-Links komplett', md.querySelectorAll('#mnav .mnav-links a').length === 6
    && md.querySelectorAll('#mnav .mnav-sub a').length === 4);
  md.getElementById('mnavClose').click(); await sleep(300);
  log('Mobil: Menü schliesst', !md.getElementById('mnav').classList.contains('open'));
  const sBtn = md.getElementById('searchBtn');
  log('Mobil: Suche erreichbar', !!sBtn && mw.getComputedStyle(sBtn).display !== 'none');
  m.remove();

  document.getElementById('out').textContent = 'DONE\n' + out.join('\n');
}
run().catch(e => { document.getElementById('out').textContent = 'ERROR ' + e.message + '\n' + out.join('\n'); });
