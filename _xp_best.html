<!doctype html><meta charset="utf-8">
<body style="margin:0"><pre id="out">start</pre>
<div id="host"></div>
<script>
window.onerror=function(m,s,l,c){document.getElementById('out').textContent='ONERROR: '+m+' @'+l+':'+c;};
const out=document.getElementById('out'), log=[], NL=String.fromCharCode(10);
const w=ms=>new Promise(r=>setTimeout(r,ms));
function toRGB(c){const m=c.match(/rgba?\(([\d.]+),\s*([\d.]+),\s*([\d.]+)(?:,\s*([\d.]+))?\)/);return m?[+m[1],+m[2],+m[3],m[4]===undefined?1:+m[4]]:null;}
function lum(r){const f=v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);};return 0.2126*f(r[0])+0.7152*f(r[1])+0.0722*f(r[2]);}
function cr(a,b){const l1=lum(a),l2=lum(b),hi=Math.max(l1,l2),lo=Math.min(l1,l2);return (hi+0.05)/(lo+0.05);}
function bgOf(d,el){let n=el;while(n&&n.nodeType===1){const b=toRGB(d.defaultView.getComputedStyle(n).backgroundColor);if(b&&b[3]>0.95)return b;n=n.parentElement;}return [255,255,255,1];}
function hex(c){return '#'+c.slice(0,3).map(v=>Math.round(v).toString(16).padStart(2,'0')).join('').toUpperCase();}
function load(url){return new Promise(res=>{const f=document.createElement('iframe');f.style.cssText='width:1440px;height:1100px;border:0';f.src=url;f.onload=()=>res(f);const h=document.getElementById('host');h.innerHTML='';h.appendChild(f);});}
(async()=>{
 try{
  const best={nr:'BQ-2026-0417',mail:'lea@example.ch',zahlung:'TWINT',versandart:'Standard',
    name:'Lea Meier',adresse:'Bahnhofstrasse 1, 8001 Zuerich',land:'Schweiz',
    artikel:[{name:'Amity Polaris',variant:'Gold',qty:1,price:69}],
    versand:0,total:69,datum:'2026-08-17'};
localStorage.setItem('baqless_bestellung', JSON.stringify(best));
  let f=await load('bestellung.html'); await w(1400); let d=f.contentDocument;
  log.push('=== bestellung.html (mit baqless_bestellung) ===');
  log.push(' dank innerHTML-Laenge: '+d.getElementById('dank').innerHTML.length);
  const ring=d.querySelector('.dank .ring');
  if(ring){
    const cs=d.defaultView.getComputedStyle(ring), bg=bgOf(d,ring);
    const bc=toRGB(cs.borderTopColor), fc=toRGB(cs.color);
    log.push(' .ring border='+hex(bc)+' cr='+cr(bc.slice(0,3),bg).toFixed(2)+' | color='+hex(fc)+' cr='+cr(fc.slice(0,3),bg).toFixed(2)+' auf '+hex(bg));
    const sv=ring.querySelector('svg');
    if(sv){const c2=d.defaultView.getComputedStyle(sv);log.push(' .ring svg stroke='+c2.stroke+' color='+c2.color);}
  } else log.push(' .ring FEHLT');
  const zs=[...d.querySelectorAll('.schritt i')];
  log.push(' .schritt i n='+zs.length+' Inhalte='+zs.map(z=>z.textContent.trim()).join(','));
  if(zs.length){
    const cs=d.defaultView.getComputedStyle(zs[0]), bg=bgOf(d,zs[0]), fg=toRGB(cs.color);
    const r=zs[0].getBoundingClientRect();
    log.push('  color='+hex(fg)+' auf '+hex(bg)+' cr='+cr(fg.slice(0,3),bg).toFixed(2)+' size='+cs.fontSize+' box='+r.width.toFixed(0)+'x'+r.height.toFixed(0));
    log.push('  alle Boxen: '+zs.map(z=>{const q=z.getBoundingClientRect();return q.width.toFixed(0)+'x'+q.height.toFixed(0)}).join(' '));
  }
  const dn=d.querySelector('.dank-note');
  if(dn){const cs=d.defaultView.getComputedStyle(dn);log.push(' .dank-note size='+cs.fontSize+' weight='+cs.fontWeight+' zeichen='+dn.textContent.trim().length);}
  const ss=d.querySelector('.schritt span');
  if(ss){const cs=d.defaultView.getComputedStyle(ss);log.push(' .schritt span size='+cs.fontSize+' weight='+cs.fontWeight+' zeichen='+ss.textContent.trim().length);}
  // Kleintext auf der gerenderten Seite
  log.push(' KLEINTEXT bestellung:');
  d.querySelectorAll('*').forEach(e=>{
    if(e.children.length)return; const t=(e.textContent||'').trim(); if(t.length<45)return; if(t===t.toUpperCase())return;
    const cs=d.defaultView.getComputedStyle(e); if(cs.textTransform==='uppercase')return;
    const fs=parseFloat(cs.fontSize); if(fs>=15)return;
    log.push('   '+fs+'px w'+cs.fontWeight+' ['+e.className+'/'+e.tagName+'] '+t.length+'z: '+t.slice(0,55));
  });

  // ---- blackhoop Stickybar + PLP-Vergleich ----
  f=await load('produkt.html?p=blackhoop'); await w(1400); d=f.contentDocument;
  log.push('=== blackhoop Stickybar ===');
  const b=d.querySelector('#stickybar button');
  log.push(' Knopf: text="'+b.textContent+'" class='+b.className+' data-add='+b.dataset.add+' data-notify='+b.dataset.notify);
  log.push(' Knopf bg='+d.defaultView.getComputedStyle(b).backgroundColor+' color='+d.defaultView.getComputedStyle(b).color);
  log.push(' sb-meta: '+d.querySelector('#stickybar .sb-meta').textContent.replace(/\s+/g,' '));
  const ld=[...d.querySelectorAll('script[type="application/ld+json"]')].map(s=>{try{return JSON.parse(s.textContent).offers.availability}catch(e){return 'parse-fehler'}});
  log.push(' JSON-LD availability: '+ld.join(','));

  // ---- PLP: derselbe Artikel als Karte ----
  f=await load('kollektion.html'); await w(1600); d=f.contentDocument;
  const card=d.querySelector('.card[data-id="blackhoop"]');
  log.push('=== kollektion.html Karte blackhoop ===');
  if(card){
    log.push(' Klassen: '+card.className+' | out-flag: "'+(card.querySelector('.out-flag')||{textContent:'KEINE'}).textContent+'"');
    const im=card.querySelector('.card-img img');
    const cs=d.defaultView.getComputedStyle(im);
    log.push(' Bild opacity='+cs.opacity+' filter='+cs.filter);
    log.push(' Knopf: "'+(card.querySelector('.add-btn')||{textContent:'-'}).textContent+'"');
  } else log.push(' Karte FEHLT');

  // ---- Packshot-Farbe: Silber auf Amity (lavendel) ----
  for(const pid of ['polarissv','zirkonia','polarisyg']){
    f=await load('produkt.html?p='+pid); await w(1600); d=f.contentDocument;
    const gm=d.getElementById('galMain'), im=gm.querySelector('img');
    log.push('=== '+pid+' Packshot ===');
    log.push(' galMain class='+gm.className+' bg='+d.defaultView.getComputedStyle(gm).backgroundImage.slice(0,80));
    log.push(' img blend='+d.defaultView.getComputedStyle(im).mixBlendMode+' src-Anfang='+im.src.slice(0,40)+' natural='+im.naturalWidth+'x'+im.naturalHeight);
    // Quellpixel via Canvas lesen (gleiche Origin)
    try{
      const cv=document.createElement('canvas'); cv.width=im.naturalWidth; cv.height=im.naturalHeight;
      const ctx=cv.getContext('2d'); ctx.drawImage(im,0,0);
      const pts=[[0.5,0.5],[0.45,0.42],[0.55,0.6],[0.5,0.3],[0.06,0.06]];
      const q=pts.map(([px,py])=>{const p=ctx.getImageData(Math.floor(px*cv.width),Math.floor(py*cv.height),1,1).data;return '('+p[0]+','+p[1]+','+p[2]+')';});
      log.push(' Quellpixel (Mitte/…/Ecke): '+q.join(' '));
      // Multiply gegen den Verlauf rechnen (Mittelwert der beiden Stops)
    }catch(e){ log.push(' Canvas-Lesen fehlgeschlagen: '+e.message); }
  }
 }catch(e){ log.push('!! ABBRUCH: '+e.message+' || '+(e.stack||'').split(NL).slice(0,3).join(' // ')); }
 out.textContent=log.join(NL);
})();
</script>
</body>
